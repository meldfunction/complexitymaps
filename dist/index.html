<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pathways into Complexity</title>
<meta name="description" content="Ideas and practices for complex work, from many fields, in plain English: a wiki, a learning path, maps, people, and cases.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="anime.umd.min.js" defer id="anime-lib"></script>
<style>
/* Field Atlas: paper, ink, four hue families at oklch(0.52 0.09 H). */
:root{
  color-scheme: light;
  --paper:#f4f1ea; --paper2:#ece8de; --card:#fbfaf6; --ink:#1c211f; --muted:#5b625e; --line:#d9d4c7; --line2:#e6e1d5;
  --link:#2f5873; --warn:#9a4a1c; --gold:#8a6a14;
  --night:#151918; --night2:#1d2321; --night-line:#2e3633; --night-ink:#efece4; --night-muted:#9aa29c;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sci:oklch(0.52 0.09 245); --rel:oklch(0.52 0.09 150); --chg:oklch(0.52 0.09 40); --prc:oklch(0.52 0.09 85);
  --sci-t:oklch(0.92 0.035 245); --rel-t:oklch(0.92 0.035 150); --chg-t:oklch(0.92 0.035 40); --prc-t:oklch(0.92 0.035 85);
  --sci-n:oklch(0.76 0.1 245); --rel-n:oklch(0.76 0.1 150); --chg-n:oklch(0.76 0.1 40); --prc-n:oklch(0.78 0.1 85);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#171b1a; --paper2:#1f2422; --card:#202624; --ink:#ece8de; --muted:#a3aaa5; --line:#38403c; --line2:#2c3330;
    --link:#9cc3df; --warn:#e7a07a; --gold:#e0c070;
    --sci:oklch(0.74 0.1 245); --rel:oklch(0.74 0.1 150); --chg:oklch(0.74 0.1 40); --prc:oklch(0.78 0.1 85);
    --sci-t:oklch(0.3 0.04 245); --rel-t:oklch(0.3 0.04 150); --chg-t:oklch(0.3 0.04 40); --prc-t:oklch(0.32 0.04 85);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#171b1a; --paper2:#1f2422; --card:#202624; --ink:#ece8de; --muted:#a3aaa5; --line:#38403c; --line2:#2c3330;
  --link:#9cc3df; --warn:#e7a07a; --gold:#e0c070;
  --sci:oklch(0.74 0.1 245); --rel:oklch(0.74 0.1 150); --chg:oklch(0.74 0.1 40); --prc:oklch(0.78 0.1 85);
  --sci-t:oklch(0.3 0.04 245); --rel-t:oklch(0.3 0.04 150); --chg-t:oklch(0.3 0.04 40); --prc-t:oklch(0.32 0.04 85);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--sans);-webkit-text-size-adjust:100%}
body.dark{background:var(--night);color:var(--night-ink)}
a{color:var(--link)}
a:hover{color:var(--ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.sr{position:absolute;left:-9999px}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
.serif{font-family:var(--serif)}
.mono{font-family:var(--mono)}
.label{font:500 10.5px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3,h4{font-family:var(--serif);font-weight:400;margin:0;text-wrap:balance}
p{margin:0}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;padding:18px 0;flex-wrap:wrap}
.brand{font:400 19px/1 var(--serif);color:var(--ink);text-decoration:none}
body.dark .brand{color:var(--night-ink)}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav a{font-size:14px;color:var(--ink);text-decoration:none;padding:7px 12px;border-radius:999px}
.nav a[aria-current="page"]{background:var(--ink);color:var(--paper)}
.nav a:hover:not([aria-current="page"]){background:var(--paper2)}

/* shared bits */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;text-decoration:none;cursor:pointer}
.pill:hover{border-color:var(--ink);color:var(--ink)}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.badge{font:500 11px/1 var(--mono);border:1px solid var(--line);border-radius:999px;padding:5px 9px;color:var(--muted);display:inline-block}
.badge.dash{border-style:dashed}
.draft{font:500 11.5px/1.4 var(--mono);color:var(--warn)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 14px var(--sans);border-radius:999px;padding:11px 20px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);text-decoration:none;cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:hover{opacity:.9;color:var(--paper)}
.btn.ghost:hover{color:var(--ink);background:var(--paper2)}
.ext::after{content:" \2197"}
.empty{border:1px dashed var(--line);border-radius:12px;padding:14px 16px;color:var(--muted);font-size:14px}
/* cards wrap and the last row stretches, so a short final row never leaves an empty slot */
.grid{display:flex;flex-wrap:wrap;gap:12px}.grid>*{flex:1 1 260px;min-width:0}.grid.tight>*{flex-basis:220px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;color:var(--ink);text-decoration:none;min-width:0}
a.tile:hover{border-color:var(--ink);color:var(--ink)}
.tile .t{font-weight:700;line-height:1.3}
.tile p{font-size:13.5px;color:var(--muted)}
.tile .meta{font:12px var(--mono);color:var(--muted)}
.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
section.sec{margin-top:44px}
section.sec>h2{font-size:28px;margin-bottom:14px}
.sub{color:var(--muted);font-size:14px;margin:-6px 0 14px}
footer.foot{margin-top:56px;background:var(--paper2);border-top:1px solid var(--line)}
footer.foot .wrap{padding-top:22px;padding-bottom:28px;display:grid;gap:12px;font-size:13px;color:var(--muted)}
footer.foot .row{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline}
.status{display:inline-flex;align-items:center;gap:8px;font:500 12px/1.3 var(--mono);color:var(--muted)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status[data-state="live"] i{background:oklch(0.6 0.12 150)}
.status[data-state="cached"] i{background:oklch(0.7 0.12 85)}
.status[data-state="error"] i{background:oklch(0.6 0.14 30)}
.status button{background:none;border:0;padding:0;color:var(--link);text-decoration:underline;cursor:pointer;font:inherit}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.85fr);gap:48px;padding:36px 0 8px;align-items:center}
.hero .loop:first-child{margin-top:0}.hero .heroimg{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:16px;display:block}
.hero h1{font-size:clamp(38px,5.2vw,58px);line-height:1.04;letter-spacing:-.015em;margin:10px 0 18px}
.hero .lede{font-size:16.5px;line-height:1.6;max-width:44ch}
.search{display:flex;align-items:center;border:1.5px solid var(--ink);border-radius:999px;background:var(--card);padding:4px 4px 4px 18px;margin-top:24px;max-width:500px;position:relative}
.search input{flex:1;min-width:0;border:0;background:transparent;font:15px var(--sans);color:var(--ink);padding:9px 0;outline:none}
.search button{border:0;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:600;padding:9px 16px;cursor:pointer}
.results[hidden]{display:none}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.12);padding:6px;display:grid}
.results a{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink)}
.results a:hover,.results a:focus{background:var(--paper2)}
.results .k{font:11px var(--mono);color:var(--muted);margin-left:auto;flex:none}
.popular{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px;font-size:12.5px;color:var(--muted)}
.popular .pill{font-size:12.5px;padding:4px 10px}
.photo{aspect-ratio:1/1;border:1.5px dashed var(--line);border-radius:16px;background:var(--paper2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-size:13px;text-align:center;padding:24px}
.photo svg{width:22px;height:22px}
.doors{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.door{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:16px 16px 22px;min-height:150px;text-decoration:none;color:var(--ink)}
.door .label{color:var(--muted)}
.door b{font:400 19px/1.2 var(--serif)}
.door span:last-child{font-size:13px;color:var(--muted)}
.door.blue{background:oklch(0.42 0.08 245);border-color:oklch(0.42 0.08 245);color:#f4f1ea}
.door.black{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.door.blue .label,.door.black .label,.door.blue span:last-child,.door.black span:last-child{color:inherit;opacity:.78}
.door.dashed{border-style:dashed;background:transparent}
.door:hover{transform:translateY(-1px);color:inherit}
.door.blue:hover{color:#f4f1ea}
.door.black:hover{color:var(--paper)}
.browse-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.browse-head h2{font-size:28px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card)}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.goals{display:flex;flex-wrap:wrap;gap:10px}.goals>*{flex:1 1 calc(25% - 10px);min-width:190px}
.goal{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:16px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;gap:16px;text-decoration:none;color:var(--ink)}
.goal b{font:400 18px/1.25 var(--serif)}
.goal span{font-size:12.5px;color:var(--muted)}
.goal:hover{border-color:var(--ink);color:var(--ink)}
.lenses{display:flex;flex-wrap:wrap;gap:16px 18px}.lenses>*{flex:1 1 calc(25% - 18px);min-width:190px}
.lens{border-left:1.5px solid var(--ink);padding:2px 0 2px 12px}
.lens i{font:italic 15px/1.45 var(--serif);display:block;margin-top:4px}
.mission{background:var(--ink);color:var(--paper);margin-top:56px}
.mission .wrap{display:grid;grid-template-columns:180px minmax(0,1fr) auto;gap:24px 40px;padding-top:56px;padding-bottom:60px;align-items:baseline}
.mission .label{color:var(--paper);opacity:.6}
.mstats{display:grid;grid-template-columns:repeat(2,auto);gap:18px 36px;align-self:center}
.mstats b{display:block;font:400 40px/1 var(--serif)}.mstats span{font:12px var(--mono);opacity:.7;text-transform:uppercase;letter-spacing:.06em}
.mission p{font:400 clamp(24px,3vw,32px)/1.25 var(--serif);max-width:28ch}
.ctas{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cta{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:26px 28px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--ink);min-height:200px}
.cta h3{font-size:32px}
.cta p{color:var(--muted);max-width:40ch}
.cta b{margin-top:auto;font-size:14px}
.cta.blue{background:oklch(0.42 0.08 245);border-color:oklch(0.42 0.08 245);color:#f4f1ea}
.cta.blue p,.cta.blue .label{color:#f4f1ea;opacity:.82}
.cta:hover{color:inherit;border-color:var(--ink)}
.featured{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:40px;border-top:1px solid var(--line);padding-top:28px}
.featured h3{font-size:30px;margin:8px 0 10px}
.also a{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);color:var(--link);text-decoration:none}

/* wiki */
.wiki{display:grid;grid-template-columns:150px minmax(0,1fr) 300px;gap:0;border-top:1px solid var(--line)}
.wiki>aside.toc{border-right:1px solid var(--line);padding:24px 18px 24px 0}
.toc a{display:block;font-size:13.5px;color:var(--ink);text-decoration:none;padding:6px 0;border-bottom:1px solid var(--line2)}
.toc a:hover{color:var(--link)}
.wiki>article{padding:24px 36px 40px;min-width:0}
.wiki>aside.side{border-left:1px solid var(--line);padding:20px 0 20px 18px;min-width:0}
.art-title{font-size:clamp(32px,4vw,44px);line-height:1.06;margin:8px 0 12px;max-width:16ch}
.art-ov{font:italic 20px/1.45 var(--serif);max-width:34ch;margin:14px 0 6px}
.art h2{font-size:26px;margin:40px 0 12px;scroll-margin-top:16px}
.art .body p{font-size:15.5px;line-height:1.65;max-width:62ch;margin-bottom:12px}
.terms{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.def{margin-top:10px;border-left:2px solid var(--ink);padding:6px 12px;font-size:14px;max-width:60ch}
.lensbox{margin-top:28px;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:18px 20px}
.lensbox .h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.lensbox .h h3{font-size:20px}
.lensbox p{font:italic 18px/1.5 var(--serif);margin-top:10px;max-width:56ch}
.road{list-style:none;margin:0;padding:0;position:relative}
.road::before{content:"";position:absolute;left:6px;top:10px;bottom:10px;border-left:1.5px solid var(--ink)}
.road>li{position:relative;padding:5px 0 5px 26px}
.road>li::before{content:"";position:absolute;left:0;top:13px;width:11px;height:11px;border-radius:50%;border:1.5px solid var(--ink);background:var(--paper)}
.road button.who,.road a.who{font:400 18px/1.3 var(--serif);background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px;cursor:pointer}
.road .n{font:11.5px var(--mono);color:var(--muted);margin-left:8px}
.road .y{font:11.5px var(--mono);color:var(--gold);margin-left:8px}
.road .pop{margin:8px 0 6px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:10px 12px;font-size:13.5px}
.gov{border-left:2px solid var(--ink);padding:2px 0 2px 12px;margin:6px 0 14px;max-width:62ch}
.gov .label{color:var(--ink);font-weight:600}
.sectors{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px}
.sectors .badge{border-style:dashed}
.secnotes{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:6px 0 0;width:100%;font-size:14px}
.secnotes dt{font-weight:600}
.secnotes dd{margin:0;color:var(--muted)}
@media (max-width:520px){.secnotes{grid-template-columns:1fr}.secnotes dd{margin-bottom:6px}}
.practice{margin:6px 0 0;padding-left:22px;max-width:62ch}
.practice li{margin:4px 0}
.casebox{background:var(--paper2);border-radius:12px;padding:14px 16px;margin-top:10px;display:block;color:var(--ink);text-decoration:none}
.casebox:hover{color:var(--ink);outline:1px solid var(--line)}
.casebox h4{font-size:18px;margin:4px 0}
.casebox p{font-size:14px}
.placeholder{border:1px dashed var(--line);border-radius:10px;padding:10px 14px;font:12px var(--mono);color:var(--muted);margin-top:10px}
.sim{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.diff{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.diff .tile{border-style:dashed}
.why{font:11.5px var(--mono);color:var(--muted)}
.localmap{position:relative;aspect-ratio:36/32;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:14px 14px}
.localmap svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;display:flex;align-items:center;gap:4px;text-align:center;font-size:11px;line-height:1.2;color:var(--ink);text-decoration:none;width:110px;cursor:pointer;background:none;border:0;padding:0}
.node i{display:block;border-radius:50%;flex:none;border:1.5px solid;background:var(--card)}
.node span{display:block}
.node:hover span{text-decoration:underline}
.key{margin-top:14px;padding:14px;font-size:12.5px;display:grid;gap:7px}
.key div{display:flex;gap:8px;align-items:center}
.key .ln{width:18px;border-top:1.5px solid var(--ink)}
.key .ln.d{border-top-style:dashed;border-color:var(--muted)}
.idx-filters{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 22px}
.idx{columns:3 280px;column-gap:28px}
.idx .cl{break-inside:avoid;margin-bottom:22px}
.idx .cl h3{font:500 11px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.idx .cl a{display:block;color:var(--link);text-decoration:none;padding:6px 0;border-bottom:1px solid var(--line2);font-size:15px}
.idx .cl a .nm,.also a .nm{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,currentColor 40%,transparent)}
.idx .cl a:hover .nm,.also a:hover .nm{text-decoration-color:currentColor;text-decoration-thickness:2px}
.idx .cl a small{font:11px var(--mono);color:var(--muted);margin-left:6px}

/* path (learning tree) */
.steps{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 6px}
.crumbs a{font-size:13px;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:var(--card)}
.crumbs a::after{content:" \00d7";color:var(--muted)}
.qh{font-size:clamp(32px,4.4vw,48px);line-height:1.08;margin:18px 0 28px}
.starts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.start{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:26px;min-height:180px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;color:var(--ink);text-decoration:none}
.start b{font:400 26px/1.15 var(--serif)}
.start span{color:var(--muted);font-size:14px}
.start:hover{border-color:var(--ink);color:var(--ink)}
.branchwrap{display:grid;grid-template-columns:auto 1fr;gap:0;align-items:center}
.root{background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 14px;margin-right:24px}
.root .label{color:var(--paper);opacity:.65}
.root b{display:block;font-size:16px}
.branches{border-left:1.5px solid var(--ink);display:grid;gap:10px;padding:6px 0}
.branch{position:relative;margin-left:24px;max-width:420px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 16px;text-decoration:none;color:var(--ink);display:block}
.branch::before{content:"";position:absolute;left:-25px;top:50%;width:24px;border-top:1.5px solid var(--ink)}
.branch:hover{border-color:var(--ink);color:var(--ink)}
.branch b{font-size:16.5px;display:flex;align-items:center;gap:8px}
.branch .m{font:12px/1.5 var(--mono);color:var(--muted);margin:2px 0 4px}
.branch i{font:italic 14.5px/1.45 var(--serif);display:block}
.branch.add{border-style:dashed;background:transparent}
.addbox{margin:6px 0 0 24px;max-width:520px;border:1px dashed var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
.addbox input{font:15px var(--sans);border:1px solid var(--line);border-radius:999px;padding:9px 14px;background:var(--card);color:var(--ink);width:100%}
.where{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.where .card{padding:18px 20px}
.where h3{font-size:22px;margin-bottom:8px}
.where li{margin:6px 0}
.where ul{padding-left:18px;margin:0}

/* people */
.people{display:grid;grid-template-columns:200px minmax(0,1fr) 260px;border-top:1px solid var(--line);min-height:70vh}
.people>nav{background:var(--paper2);padding:20px 12px;border-right:1px solid var(--line)}
.people>nav a{display:block;text-decoration:none;color:var(--ink);padding:9px 10px;border-radius:10px;margin-bottom:4px}
.people>nav a b{font:600 14.5px var(--serif);display:block}
.people>nav a small{font:11px var(--mono);color:var(--muted)}
.people>nav a[aria-current="true"]{background:var(--ink);color:var(--paper)}
.people>nav a[aria-current="true"] small{color:var(--paper);opacity:.7}
.people>article{padding:28px 40px 48px;min-width:0}
.people>aside{border-left:1px solid var(--line);padding:24px 20px;background:var(--card)}
.pname{font-size:clamp(36px,4.6vw,50px);line-height:1.05;margin:6px 0 10px}
.known{font-size:17px;max-width:52ch}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:68px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.tl b{font:600 13px var(--mono)}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.ideas .card{padding:14px 16px}
.ideas b{font:600 15px var(--serif);display:block;margin-bottom:4px}
.q{border:1.5px solid var(--ink);border-radius:14px;overflow:hidden;margin-bottom:14px;background:var(--card)}
.q .hd{padding:10px 18px;border-bottom:1px solid var(--line)}
.q .pair{display:grid;grid-template-columns:1fr 1fr}
.q .pair>div{padding:16px 18px}
.q .pair>div+div{background:var(--paper2);border-left:1px solid var(--line)}
.q .claim{font:400 18.5px/1.45 var(--serif);margin:6px 0 10px}
.q .who{font:600 12px var(--serif);color:var(--muted)}
.q blockquote{margin:10px 0 0;border-left:2px solid var(--ink);padding:2px 0 2px 12px;font:italic 15.5px/1.45 var(--serif)}
.q blockquote a{display:block;font:11px var(--mono);margin-top:4px}
.q .more{padding:12px 18px;border-top:1px solid var(--line)}
.q .more a{display:block;font-weight:600;font-size:14px;margin-top:8px}
.q .more small{display:block;color:var(--muted);font-size:12.5px}
.q .land{padding:10px 18px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.reads li{list-style:none;padding:8px 0;border-bottom:1px solid var(--line)}
.reads ul{padding:0;margin:0}
.reads b{font:600 14px var(--serif)}
.reads small{display:block;color:var(--muted);font-size:13px}
.asks p{font:400 16px/1.45 var(--serif);padding:10px 0;border-bottom:1px solid var(--line)}
.appears a{display:block;text-decoration:none;color:var(--ink);font-size:14.5px}
.appears div{padding:10px 0;border-bottom:1px solid var(--line)}
.appears small a{display:inline;font:12px var(--mono);color:var(--link);margin-right:10px}

/* contribute / ack / about */
.narrow{max-width:640px;margin:0 auto}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 16px;margin-bottom:8px;cursor:pointer;color:var(--ink);text-decoration:none}
.opt b{font:600 16px var(--serif);display:block}
.opt span{font-size:13.5px;color:var(--muted)}
.opt:hover,.opt[aria-pressed="true"]{border-color:var(--ink)}
.slot{border:1.5px dashed var(--line);border-radius:14px;padding:16px 20px;font:13px/1.6 var(--mono);color:var(--muted)}
.slot .label{color:var(--warn)}
.ack-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px 36px;margin-top:28px}
.ack-grid h3{font-size:24px;margin-bottom:6px}
.ack-grid p{font:13px/1.65 var(--mono);color:var(--muted)}
.orient{display:flex;flex-wrap:wrap;gap:12px}.orient>*{flex:1 1 280px;min-width:0}
.levels{width:100%;border-collapse:collapse;font-size:14px}
.levels th,.levels td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line)}
.levels th{font:400 17px var(--serif);width:200px}
.stage-list{display:grid;gap:12px}
.media{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.media li{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:baseline}
.media .k{font:11.5px var(--mono);color:var(--muted)}
.libbar{display:grid;grid-template-columns:1fr auto;gap:10px;margin:14px 0}
.libbar input,.libbar select{font:15px var(--sans);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:10px 16px;width:100%}
.star{color:var(--gold);font-size:12px;font-weight:600}

/* map hub (always night) */
.hub{background:var(--night);color:var(--night-ink);min-height:100vh}
.hub .top{padding:18px 0}
.tabs{display:flex;gap:2px;border:1px solid var(--night-line);border-radius:999px;padding:4px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.tabs a{flex:none;color:var(--night-ink);text-decoration:none;font-size:14px;padding:7px 15px;border-radius:999px}
.hub .tabs a{color:var(--night-ink)}
.hub .tabs a[aria-current="page"]{background:var(--night-ink);color:var(--night)}
.hubnote{font:12px/1.4 var(--mono);color:var(--night-muted);max-width:32ch;text-align:right}
.hubgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:0;background:var(--night2);border-radius:16px;overflow:hidden;min-height:560px}
.hubgrid.full{grid-template-columns:1fr}
.hubmain{padding:20px 22px;min-width:0;position:relative}
.hubside{border-left:1px solid var(--night-line);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.hub .label{color:var(--night-muted)}
.hub a{color:oklch(0.82 0.08 85)}
.hub a.plain{color:var(--night-ink);text-decoration:none}
.hub .btn{background:var(--night-ink);color:var(--night);border-color:var(--night-ink)}
.hub .btn.ghost{background:transparent;color:var(--night-ink);border-color:var(--night-line)}
.scrollx{overflow-x:auto;max-width:100%}
.stage{position:relative;width:100%;aspect-ratio:1000/620;min-width:0}
.label{overflow-wrap:anywhere}
.stage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.stage .lab{position:absolute;transform:translate(-50%,-50%);font:500 10.5px/1.25 var(--mono);letter-spacing:.06em;text-transform:uppercase;text-align:center;white-space:nowrap;pointer-events:none}
.stage .slab{position:absolute;font:12px/1.2 var(--serif);color:var(--night-ink);white-space:nowrap;pointer-events:none;text-shadow:0 0 4px var(--night)}
.stage .hit{position:absolute;transform:translate(-50%,-50%);border-radius:50%;background:transparent;border:0;cursor:pointer;padding:0}
.stage .gal{position:absolute;transform:translate(-50%,-50%);border-radius:50%;background:transparent;border:0;cursor:pointer}
.stage .gal:hover{background:radial-gradient(rgba(255,255,255,.04),transparent 70%)}
.qwhat{font-size:14.5px;line-height:1.55;margin:6px 16px 14px;padding:10px 14px;border-left:3px solid var(--line);background:var(--paper2);border-radius:0 8px 8px 0}
.linktoggle{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:0 0 10px}
.linktoggle .label{color:var(--night-muted);margin-right:2px}
.linktoggle .pill{background:transparent;color:var(--night-ink);border-color:var(--night-line);font-size:12.5px;padding:5px 11px}
.linktoggle .pill[aria-pressed="true"]{background:var(--night-ink);color:var(--night)}
.connlist{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px;max-height:320px;overflow:auto}
.connlist li{font-size:13.5px}.connlist small{display:block;font-size:12px;opacity:.75;margin-left:16px}
.stage svg .conn{pointer-events:stroke;transition:stroke-opacity .15s}
.stage.hl svg .conn{stroke-opacity:.06}.stage.hl svg .conn.hot{stroke-opacity:.95;stroke:var(--night-ink)}
.mapfoot{font:12px/1.6 var(--mono);color:var(--night-muted);margin-top:10px;display:flex;flex-wrap:wrap;gap:4px 18px}
.panel h3{font-size:24px;line-height:1.15;margin:4px 0 8px;color:var(--night-ink)}
.panel p{font-size:13.5px;color:var(--night-muted)}
.panel .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.list a{display:block;padding:9px 0;border-bottom:1px solid var(--night-line);color:var(--night-ink);text-decoration:none;font-size:14.5px}
.list a:hover{color:oklch(0.82 0.08 85)}
.tree{position:relative;overflow-x:auto;padding-bottom:6px}
.treeline{position:relative;display:flex;justify-content:space-between;min-width:560px;margin:56px 10px 0}
.treeline::before{content:"";position:absolute;left:30px;right:30px;top:var(--y,64px);border-top:2.5px solid currentColor}
.stop{position:relative;flex:1;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;padding:0 4px}
.stop .num{font:11px var(--mono);color:var(--night-muted)}
.stop b{font:600 13.5px/1.2 var(--serif)}
.stop .nt{font:11px/1.2 var(--serif);color:var(--night-muted)}
.stop .yr{font:11px var(--mono);color:oklch(0.82 0.08 85)}
.stop .yr.no{color:var(--night-muted)}
.stop .pt{width:14px;height:14px;border-radius:50%;background:currentColor;position:absolute;top:calc(var(--y,64px) - 7px)}
.stop .pt.big{width:18px;height:18px;top:calc(var(--y,64px) - 9px);box-shadow:0 0 0 3px var(--night2)}
.stop .boxes{margin-top:calc(var(--y,64px) - 44px + 40px);display:grid;gap:6px;width:100%}
.stop .boxes a{border:1px solid currentColor;border-radius:8px;padding:6px 8px;font:12px/1.3 var(--serif);text-decoration:none;color:var(--night-ink);background:rgba(255,255,255,.03)}
.stop .who{background:none;border:0;padding:0;cursor:pointer;color:inherit;text-decoration:underline;text-decoration-color:var(--night-line);text-underline-offset:3px}
.tm{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.tm .cl{background:rgba(255,255,255,.03);border-radius:10px;padding:8px}
.tm .cl h4{font:500 10.5px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;margin:0 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:5px}
.tm button{text-align:left;border:0;border-radius:6px;min-height:52px;padding:7px 8px;font:12px/1.25 var(--serif);color:var(--night-ink);cursor:pointer}
.tm button.gap{background:repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 6px,transparent 6px 12px);outline:1px dashed var(--night-muted);outline-offset:-1px}
.tm button[aria-pressed="true"]{outline:2px solid var(--night-ink);outline-offset:-2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{border:1px solid var(--night-line);border-radius:12px;padding:10px 12px}
.stats b{font:400 26px var(--serif);display:block}
.stats span{font:11px var(--mono);color:var(--night-muted)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.hub .pill{background:transparent;color:var(--night-ink);border-color:var(--night-line)}
.hub .pill[aria-pressed="true"]{background:var(--night-ink);color:var(--night)}
.check{list-style:none;padding:0;margin:0;font-size:13.5px}
.check li{padding:5px 0;border-bottom:1px solid var(--night-line)}
.time{overflow:auto;max-height:600px;position:relative;border-top:1px solid var(--night-line)}
.time .axis{position:sticky;top:0;z-index:2;background:var(--night2);height:28px;border-bottom:1px solid var(--night-line)}
.time .axis span{position:absolute;top:7px;font:11px var(--mono);color:var(--night-muted);transform:translateX(-50%)}
.time .grp{font:600 12px var(--serif);padding:10px 0 4px;position:sticky;left:0}
.time .row{position:relative;height:26px}
.time .bar{position:absolute;top:3px;height:20px;border-radius:999px;display:flex;align-items:center;gap:6px;padding:0 10px;white-space:nowrap;font:600 12px var(--serif);color:var(--night);text-decoration:none;min-width:max-content}
.time .bar small{font:400 11px var(--mono);opacity:.75}
.time .bar.inst{background:transparent!important;border:1px solid;color:var(--night-ink)}
.time .bar.living{border-top-right-radius:0;border-bottom-right-radius:0}
.time .grid-l{position:absolute;top:0;bottom:0;border-left:1px solid var(--night-line)}
.addstops{display:flex;flex-wrap:wrap;gap:8px}
.addstops button{background:transparent;border:1px solid var(--night-line);border-radius:12px;color:var(--night-ink);padding:8px 12px;text-align:left;cursor:pointer;font-size:13px}
.addstops small{display:block;font:11px var(--mono);color:var(--night-muted)}

@media (max-width:1060px){
  .wiki{grid-template-columns:minmax(0,1fr) 280px}
  .wiki>aside.toc{display:none}
  .people{grid-template-columns:180px minmax(0,1fr)}
  .people>aside{grid-column:2;border-left:0;border-top:1px solid var(--line)}
  .goals>*,.lenses>*{flex-basis:calc(50% - 18px);min-width:0}
  .doors{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:760px){
  .hero{grid-template-columns:1fr;gap:24px}
  .photo{aspect-ratio:16/10}
  .doors{grid-template-columns:1fr}
  .door{min-height:0;padding:14px 16px}
  .goals,.lenses,.ctas,.featured,.starts,.where,.sim,.diff,.two,.ack-grid{grid-template-columns:1fr}
  .mission .wrap{grid-template-columns:1fr;gap:10px}
  .wiki{grid-template-columns:1fr}
  .wiki>article{padding:18px 0 28px}
  .wiki>aside.side{border-left:0;border-top:1px solid var(--line);padding:18px 0}
  .people{grid-template-columns:1fr}
  .people>nav{display:flex;overflow-x:auto;gap:6px;border-right:0;border-bottom:1px solid var(--line);padding:10px}
  .people>nav a{flex:none;margin:0}
  .people>article{padding:20px 0 28px}
  .people>aside{grid-column:auto}
  .q .pair{grid-template-columns:1fr}
  .q .pair>div+div{border-left:0;border-top:1px solid var(--line)}
  .hubgrid{grid-template-columns:1fr}
  .hubside{border-left:0;border-top:1px solid var(--night-line)}
  .hubnote{display:none}
  .scrollx .stage{min-width:780px}
  .branchwrap{grid-template-columns:1fr}
  .root{margin:0 0 12px;justify-self:start}
  .branch{margin-left:16px}
  .branch::before{left:-17px;width:16px}
  .addbox{margin-left:16px}
  .levels th{width:auto}
  .media li{grid-template-columns:1fr;gap:2px}
  .libbar{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){ .door,.goal,.tile,.start,.branch{transition:border-color .15s,transform .15s} }
/* motion: everything here is optional; with motion off the page renders in its final state */
.loop{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:14px 16px;margin-top:14px}
.loop svg{width:100%;height:auto;display:block;max-height:300px}
.loop .lnode circle{fill:var(--card);stroke:var(--ink);stroke-width:1.5}
.loop .lnode text{font:600 11.5px var(--sans);fill:var(--ink);text-anchor:middle}
.loop .lnode.moved circle{fill:var(--paper2);stroke-width:2.5}
.loop .arc{fill:none;stroke:var(--muted);stroke-width:1.4}
.loop .pulse{fill:var(--chg)}
.loop p{font:italic 14.5px/1.45 var(--serif);margin:6px 0 8px}
.road{--draw:1}
.road::before{transform:scaleY(var(--draw));transform-origin:top}
.treeline{--draw:1}
.treeline::before{transform:scaleX(var(--draw));transform-origin:left}
.branches{--draw:1}
.branchwrap .branches{border-left:0;position:relative}
.branchwrap .branches::after{content:"";position:absolute;left:0;top:0;bottom:0;border-left:1.5px solid var(--ink);transform:scaleY(var(--draw));transform-origin:top}
.stage svg .mst,.stage svg .mx,.stage svg .star{transform-box:fill-box;transform-origin:center}
.tm button{position:relative;overflow:hidden;background:rgba(255,255,255,.04)}
.tm button .fl{position:absolute;inset:0;transform-origin:bottom;pointer-events:none}
.tm button .tx{position:relative}
.replay{position:absolute;z-index:3;transform:translate(-50%,0);width:min(240px,46%);background:var(--night2);border:1px solid var(--night-line);border-radius:10px;padding:8px 10px;font:12.5px/1.4 var(--serif);color:var(--night-ink);pointer-events:none}
.replay b{display:block;font-size:13.5px}
.reorder{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px;position:relative}
.reorder li{display:flex;align-items:center;gap:8px;border:1px solid var(--night-line);border-radius:10px;padding:6px 8px;background:var(--night2);font-size:13.5px;touch-action:none}
.reorder li span{flex:1;min-width:0}
.reorder li .grip{flex:none}
.reorder .grip{cursor:grab;color:var(--night-muted);font:16px var(--mono);user-select:none;padding:0 2px}
.reorder button{background:transparent;border:1px solid var(--night-line);border-radius:6px;color:var(--night-ink);width:26px;height:26px;cursor:pointer}
.scrub{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:0 0 10px;font-size:13px;color:var(--night-muted)}
.scrub input[type=range]{flex:1;min-width:160px;accent-color:oklch(0.82 0.08 85)}
.scrub output{font:600 14px var(--mono);color:var(--night-ink);min-width:4ch}
.scrubline{position:absolute;top:0;bottom:0;left:0;width:22px;margin-left:-11px;z-index:3;cursor:ew-resize;touch-action:none}
.scrubline::before{content:"";position:absolute;left:10px;top:0;bottom:0;border-left:2px solid oklch(0.82 0.08 85)}
.scrubline[hidden]{display:none}
.time.scrubbing .bar{opacity:.22}
.time.scrubbing .bar.alive{opacity:1;box-shadow:0 0 0 2px var(--night-ink)}
.together{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px;font-size:12.5px}
.together a{border:1px solid var(--night-line);border-radius:999px;padding:3px 9px;text-decoration:none;color:var(--night-ink)}
.balance{display:inline-flex;align-items:center;gap:8px;margin-left:auto}
.balance svg{width:110px;height:44px;overflow:visible}
.balance .beam{transform-box:view-box;transform-origin:55px 16px}
.balance line,.balance path{stroke:currentColor;fill:none;stroke-width:1.5}
.balance small{font:10.5px var(--mono)}
.motiontoggle{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline;cursor:pointer}
@media (max-width:600px){ .stage.metro{min-width:720px} }
@media (prefers-reduced-motion:no-preference){ .time .bar{transition:opacity .2s} .balance .beam{transition:transform .5s cubic-bezier(.3,1.6,.5,1)} }
html.no-motion .balance .beam,html.no-motion .time .bar,html.has-anime .balance .beam{transition:none}
@media print{ .road>li,.stop,.branch{opacity:1!important;transform:none!important} }
</style>

<script>
const DATA = {"about": {"title": "Pathways into Complexity", "lede": "Lineages, practices, and methods for working in complex systems, with cases, organizations, and live resources from the Systems Change Learning Guide.", "worker": "https://capacities.jayajohnyramchandani.workers.dev/"}, "clusters": [{"name": "Foundations and science", "token": "found", "light": "#3b5b7a", "dark": "#86a7c7"}, {"name": "Relational, Indigenous, and meaning", "token": "rel", "light": "#8a4f7d", "dark": "#c894bb"}, {"name": "Living systems", "token": "live", "light": "#4f7a3a", "dark": "#96c07f"}, {"name": "Organizing and sensemaking", "token": "org", "light": "#2f6f62", "dark": "#6fb7a6"}, {"name": "Movements and hosting", "token": "mov", "light": "#b0613a", "dark": "#e19a72"}, {"name": "Living practices", "token": "prac", "light": "#7a4a2a", "dark": "#d09a74"}, {"name": "Power, narrative, and conflict", "token": "pow", "light": "#6a3f8f", "dark": "#b596d8"}, {"name": "Crisis and transition", "token": "cri", "light": "#9a3b3b", "dark": "#e28b85"}, {"name": "Policy, systemic design, and economics", "token": "pol", "light": "#a8741a", "dark": "#e0b25a"}, {"name": "Strategy, money, and accountability", "token": "str", "light": "#2e5d73", "dark": "#7fb3cc"}, {"name": "Design and practice", "token": "des", "light": "#5a5f8f", "dark": "#a5a9d8"}, {"name": "Learning and pedagogy", "token": "ped", "light": "#6b6a1f", "dark": "#c9c66a"}], "kinds": [{"name": "Lineage", "desc": "A body of ideas that changes how you understand systems. It informs action without prescribing it."}, {"name": "Practice", "desc": "A way of being together that shifts perception and relationship. It works indirectly and breaks when aimed at an output."}, {"name": "Method", "desc": "A structured process with steps and artifacts, aimed at a designed outcome. It can be commissioned and reported on."}, {"name": "Structure", "desc": "An arrangement of authority, decision-making, and feedback. It changes who decides and how information flows."}, {"name": "Field", "desc": "A domain where lineages, practices, methods, and structures meet a context. It is where you work, not how."}, {"name": "Tradition", "desc": "A whole way of knowing held by peoples and places. It enters through relationship, consent, and shared power."}, {"name": "Hybrid", "desc": "A pathway that is several kinds at once. Watch for the method part being taken and the rest dropped."}], "orientations": [{"name": "Consent before command", "line": "Move when no one has a reasoned objection, rather than waiting for everyone to agree or for someone to order it.", "source": "Sociocracy (Kees Boeke, Gerard Endenburg)", "ask": "Who has not yet been asked whether they can live with this?"}, {"name": "Match the variety", "line": "A response has to be as varied as the situation it meets. Do not simplify people to fit the system.", "source": "W. Ross Ashby, requisite variety", "ask": "Where are we forcing many different lives through one channel?"}, {"name": "Widen the choices", "line": "Act so that the people affected have more options afterward, not fewer.", "source": "Heinz von Foerster, the ethical imperative", "ask": "Does this close doors for anyone who was not in the room?"}, {"name": "Take only what is given", "line": "Relationship before extraction. Ask, take what is offered, share it, and give something back.", "source": "Robin Wall Kimmerer, the Honorable Harvest", "ask": "What are we taking from this community, and what are we returning?"}, {"name": "Many contexts, no master frame", "line": "Every issue lives in family, work, body, place, and history at once. No single discipline or worldview holds all of it.", "source": "Nora Bateson (transcontextuality), Arturo Escobar (the pluriverse)", "ask": "Which context are we ignoring because it does not fit our frame?"}, {"name": "Learning over proving", "line": "Treat results as information for the next move, and hold people accountable for learning, not for hitting numbers they do not control.", "source": "Human Learning Systems, developmental evaluation, Deming", "ask": "What did we learn that changes what we do next?"}, {"name": "Power in plain sight", "line": "Name who decides, whose issues never reach the table, and which beliefs make the arrangement feel natural.", "source": "Steven Lukes, John Gaventa, Paulo Freire", "ask": "Which form of power is doing the work here without being named?"}], "levels": [{"name": "Body and person", "who": "Resmaa Menakem, Staci K. Haines, Robert Kegan, Jennifer Garvey Berger. Practices: somatic work, immunity to change, reflective practice"}, {"name": "Knowing and perception", "who": "Iain McGilchrist, Evan Thompson, Alicia Juarrero, Terrence Deacon, Isabelle Stengers, Donna Haraway, Karen Barad, Jan Meyer and Ray Land"}, {"name": "Group and dialogue", "who": "Arawana Hayashi, William Isaacs, Chris Corrigan. Practices: Bohm Dialogue, T-groups, Group Relations, Warm Data Labs, Art of Hosting, Liberating Structures, Work That Reconnects, action learning"}, {"name": "Organization", "who": "Dave Snowden, Glenda Eoyang, Otto Scharmer, Peter Senge, Amy Edmondson, David Cooperrider, Bjarte Bogsnes, Matthew Skelton and Manuel Pais. Practices: sociocracy, Appreciative Inquiry, Adaptive Action, Beyond Budgeting"}, {"name": "Community and place", "who": "Nora Bateson, Bayo Akomolafe, adrienne maree brown, Robin Wall Kimmerer, Tyson Yunkaporta, Rebecca Solnit, Daniel Aldrich, Dean Spade. Practices: positive deviance, participatory action research, popular education, mutual aid"}, {"name": "Society and policy", "who": "Toby Lowe, Geoff Mulgan, Hilary Cottam, Mariana Mazzucato, Jennifer Pahlka, Charles Sabel, Indy Johar, Lou Downe, Michael Quinn Patton, John Gaventa. Practices: Human Learning Systems, developmental evaluation, service design, narrative change"}, {"name": "Planetary and civilizational", "who": "Vanessa Machado de Oliveira, Jonathan Rowson, Carl Folke, Daniel Christian Wahl, Fritjof Capra, Kate Raworth, Arturo Escobar, Yaneer Bar-Yam"}], "braids": [{"pair": "Nora Bateson + Otto Scharmer", "why": "Relational sensing beside a structured change process. The friction shows what each assumes about intention."}, {"pair": "Bayo Akomolafe + Dave Snowden", "why": "Post-humanist inquiry beside practical sensemaking. Both distrust tidy plans for different reasons."}, {"pair": "Robin Wall Kimmerer + Elinor Ostrom", "why": "Reciprocity beside commons governance. Two routes to the same insight about shared resources."}, {"pair": "Service design + developmental evaluation + transition design", "why": "Journey, learning loop, and long horizon for government innovation."}, {"pair": "Power analysis + Hosting", "why": "Hosting without power analysis can launder existing hierarchies; power analysis without hosting can stay academic."}, {"pair": "Somatic practice + Crisis response", "why": "Regulated bodies make better decisions in the first hours, and recover better afterward."}], "journeys": [{"id": "quiet-heron", "title": "From crisis response to city innovation", "who": "quiet-heron started in government crisis response, working with small, ritual-rich communities, and later moved into a city innovation role inside a reluctant bureaucracy.", "stages": [{"where": "Starting point: crisis response in small communities", "levels": ["Community and place", "Group and dialogue", "Body and person"], "pathways": ["crisis-disaster-and-high-reliability", "ritual-liminality-and-transition", "somatic-and-embodied-practice", "indigenous-and-land-based-knowledge", "positive-deviance"], "note": "What they already know: communities self-organize in a crisis, ritual holds people through disruption, and regulated bodies make better decisions. These pathways name and deepen that knowledge."}, {"where": "Arriving in city government", "levels": ["Organization", "Society and policy"], "pathways": ["sensemaking-and-acting-in-uncertainty", "group-relations", "power-analysis", "government-plumbing"], "note": "Sort ordered from complex problems so procedure can stay procedural. Read resistance as a system defense rather than a personal failing. Learn where procurement, budgets, and audit actually push back."}, {"where": "Doing the work", "levels": ["Organization", "Society and policy", "Group and dialogue"], "pathways": ["nora-bateson-and-warm-data", "service-design", "developmental-evaluation", "measurement-and-accountability", "communities-of-practice-and-action-learning"], "note": "Host Warm Data Labs alongside the structured methods, not upstream of them, to loosen fixed perception. Use service design and developmental evaluation for accountable, learning-based change. Build a community of practice with the people inside who already work this way."}], "braid": "Crisis and ritual knowing carried into the institution: the experience of communities adapting fast is proof of what the bureaucracy could do if its constraints loosened."}, {"id": "amber-finch", "title": "From corporate innovation to civic partnerships", "who": "amber-finch ran an innovation team in a large company and now brokers partnerships between business, city government, and community groups.", "stages": [{"where": "Starting point: corporate innovation", "levels": ["Organization"], "pathways": ["corporate-innovation-and-renewal", "strategy-under-uncertainty", "teams-and-learning-cultures", "design-thinking"], "note": "Comfortable with experiments, portfolios, and customer research. Less practiced at working where no one owns the problem."}, {"where": "Entering civic work", "levels": ["Community and place", "Society and policy"], "pathways": ["collaboration-across-boundaries", "power-analysis", "participatory-design-and-design-justice", "critical-and-popular-education"], "note": "Learn why design thinking alone can flatten communities into users, and how power shapes who gets to define the problem."}, {"where": "Doing the work", "levels": ["Society and policy", "Group and dialogue"], "pathways": ["hosting-and-participatory-practice", "funding-and-budgeting-for-adaptation", "measurement-and-accountability", "narrative-change"], "note": "Convene rather than run. Move money toward trust and portfolios, measure learning instead of outputs, and help partners tell a shared story of why change is needed now."}], "braid": "Business speed braided with civic patience: portfolio thinking is an asset in public work once it is paired with shared power."}], "pathways": [{"name": "Cybernetics, the shared foundation", "cluster": "Foundations and science", "overview": "Steering through feedback: how systems regulate themselves, and how observers are part of what they observe.", "road": "Norbert Wiener → W. Ross Ashby (requisite variety) → Heinz von Foerster (second-order cybernetics) → Maturana and Varela → Gordon Pask (conversation theory) → Paul Pangaro", "mix": "Gregory Bateson and Margaret Mead at the Macy Conferences, Stafford Beer", "policy": "Requisite variety as a design test: services must match the variety of people's lives. Beer's Project Cybersyn is the classic, contested case of cybernetic government.", "links": [{"t": "American Society for Cybernetics", "u": "https://asc-cybernetics.org"}, {"t": "The Cybernetics Society", "u": "https://cybsoc.org"}], "kind": "Lineage", "terms": ["cybernetic", "wiener", "ashby", "von foerster", "pask", "stafford beer", "feedback", "requisite variety"], "caps": ["Systems Thinking & Modeling"], "id": "cybernetics-the-shared-foundation", "orgs": ["asc"], "cases": ["cybersyn"], "gov": false, "reading": [], "short": "cyb", "short_name": "Cybernetics", "family": "sci", "sectors": ["edu"], "scales": ["org", "pol"], "work_kinds": ["att"], "goals": ["connect"], "lens": "Complexity as variety. Ashby's law says anything that steers a system must be able to match the variety of what it faces. Later cyberneticians added that the observer is part of the system.", "lens_status": "draft", "explainer": ["Cybernetics studies how systems steer themselves using feedback: a thermostat, a body keeping its temperature, a team adjusting after a result. Its founders in the 1940s and 50s saw the same patterns in machines, brains and societies.", "A later branch, second-order cybernetics, added that the observer is part of the system being observed, so how you look shapes what you find. Much of the rest of this map grows from these ideas."], "practice": ["Draw one loop you are part of: what you do, what changes, how you find out, what you do next.", "Ask where the feedback is slow, missing, or filtered before it reaches the people who decide.", "Check requisite variety: list the situations you face, then the responses you have. Where the first list is longer, you will lose control.", "Name yourself as an observer. Write down what your position lets you see and what it hides."], "sector_notes": {"biz": "Control systems, dashboards and management reporting are cybernetic, whether or not anyone calls them that.", "ngo": "Programmes that hear from beneficiaries only once a year are steering with a very slow loop.", "health": "Body regulation (temperature, blood sugar) was a founding example, and clinical audit is a feedback loop on care.", "edu": "Gordon Pask's conversation theory treats teaching as two systems adjusting to each other.", "com": "Neighbourhood groups steer well when people see the results of what they did quickly."}, "key_ideas": [{"term": "feedback", "defn": "When the result of an action loops back and shapes the next action."}, {"term": "requisite variety", "defn": "Ashby's law: to steer something, your responses need to be at least as varied as the situations you face."}, {"term": "second-order cybernetics", "defn": "Cybernetics that includes the observer: how you look is part of what you find."}, {"term": "viable system model", "defn": "Stafford Beer's model of the five functions any organization needs to survive and adapt."}, {"term": "homeostasis", "defn": "A system keeping something steady, like body temperature, by correcting drift."}], "plain_overview": "How systems steer themselves through feedback, and why the observer is part of the picture.", "plain_policy": "", "stops": [{"name": "Norbert Wiener", "note": "", "years": "1894–1964", "people": ["Norbert Wiener"]}, {"name": "W. Ross Ashby", "note": "requisite variety", "years": "1903–1972", "people": ["W. Ross Ashby"]}, {"name": "Heinz von Foerster", "note": "second-order cybernetics", "years": "1911–2002", "people": ["Heinz von Foerster"]}, {"name": "Maturana and Varela", "note": "", "years": "", "people": []}, {"name": "Gordon Pask", "note": "conversation theory", "years": "1928–1996", "people": ["Gordon Pask"]}, {"name": "Paul Pangaro", "note": "", "years": "", "people": []}]}, {"name": "The formal science of complex systems", "cluster": "Foundations and science", "overview": "Mathematical and computational study of emergence, networks, adaptation, and self-organization across physics, biology, and society.", "road": "Ilya Prigogine (dissipative structures) → Santa Fe Institute → network science (Barabási, Strogatz, Watts) → NECSI (Yaneer Bar-Yam)", "mix": "Hermann Haken (†2024, synergetics), Stuart Kauffman", "policy": "Agent-based models and network analysis of service systems, epidemics, and markets to test policy before rollout.", "links": [{"t": "Santa Fe Institute", "u": "https://www.santafe.edu"}, {"t": "Complexity Explorer (free courses)", "u": "https://www.complexityexplorer.org"}, {"t": "Network Science textbook (free)", "u": "http://networksciencebook.com"}, {"t": "NECSI", "u": "https://necsi.edu"}], "kind": "Lineage", "terms": ["santa fe", "complexity science", "network science", "agent-based", "emergence", "prigogine", "self-organi"], "caps": ["Systems Thinking & Modeling", "Complex Problem Solving"], "id": "the-formal-science-of-complex-systems", "orgs": ["sfi"], "cases": ["artificial-anasazi"], "gov": false, "reading": [], "short": "cx", "short_name": "Formal complexity science", "family": "sci", "sectors": ["edu"], "scales": ["pla", "pol"], "work_kinds": ["att"], "goals": ["connect"], "lens": "Complexity as many agents following simple local rules, producing emergent, non-linear behaviour that can be modelled but rarely predicted precisely.", "lens_status": "draft", "explainer": ["Complexity science studies systems made of many parts that interact, such as cells, ant colonies, cities and markets. The parts follow fairly simple local rules, yet together they produce patterns that none of them planned: traffic jams, epidemics, price bubbles, the shape of a flock.", "Researchers use computer models, network maps and mathematics to study how these patterns emerge and when they suddenly shift. The field's main lesson for practice is humility: you can often understand how a complex system behaves without being able to predict exactly what it will do next."], "practice": ["Pick a pattern you care about (waiting lists, rents, school choice) and ask which local rules people follow that add up to it.", "Sketch the network: who is connected to whom, and which few nodes hold many connections.", "Play with an agent-based model on Complexity Explorer or NetLogo before trusting a forecast.", "Look for tipping points: where would a small push cause a big shift?"], "sector_notes": {"biz": "Supply chains and markets behave like networks; a failure at one hub spreads widely.", "ngo": "Network maps show which partners hold a coalition together and where it would break.", "health": "Epidemic models and hospital flow models come straight from this field.", "edu": "Classrooms show emergence: the mood of a class is not any one pupil's doing.", "com": "Local patterns like who shops where or who trusts whom are emergent and can shift quickly."}, "key_ideas": [{"term": "emergence", "defn": "When a whole shows patterns that none of its parts have on their own."}, {"term": "self-organization", "defn": "Order that arises from local interactions without anyone in charge."}, {"term": "agent-based model", "defn": "A computer simulation of many individual agents following rules, to see what patterns emerge."}, {"term": "network science", "defn": "The study of how things are connected and how connections shape what spreads."}, {"term": "tipping point", "defn": "A threshold where a small change flips a system into a different state."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "Ilya Prigogine", "note": "dissipative structures", "years": "1917–2003", "people": ["Ilya Prigogine"]}, {"name": "Santa Fe Institute", "note": "", "years": "founded 1984", "people": ["Santa Fe Institute"]}, {"name": "network science", "note": "Barabási, Strogatz, Watts", "years": "", "people": []}, {"name": "NECSI", "note": "Yaneer Bar-Yam", "years": "founded 1996", "people": ["NECSI"]}]}, {"name": "Relational, transcontextual, and post-humanist knowing", "cluster": "Relational, Indigenous, and meaning", "overview": "Knowing through relationships rather than parts. Attends to how contexts shape each other and questions the human-centered, modern frame itself.", "road": "Gregory Bateson (Steps to an Ecology of Mind) → Nora Bateson (Warm Data, Combining) → Bayo Akomolafe (These Wilds Beyond Our Fences) → Vanessa Machado de Oliveira (Hospicing Modernity)", "mix": "Tyson Yunkaporta (Sand Talk), Donna Haraway (Staying with the Trouble), Karen Barad (agential realism), Isabelle Stengers. Joanna Macy (†2025) bridged systems theory, Buddhism, and deep ecology.", "policy": "Shows how policy categories fragment lived lives. Warm Data Labs with public teams, and the practice of hospicing institutions that no longer serve.", "links": [{"t": "International Bateson Institute", "u": "https://batesoninstitute.org"}, {"t": "Warm Data Lab", "u": "https://warmdatalab.net"}, {"t": "The Emergence Network", "u": "https://www.emergencenetwork.org"}, {"t": "Bayo Akomolafe", "u": "https://www.bayoakomolafe.net"}, {"t": "Gesturing Towards Decolonial Futures", "u": "https://decolonialfutures.net"}, {"t": "Work That Reconnects Network", "u": "https://workthatreconnects.org"}], "kind": "Lineage", "terms": ["bateson", "akomolafe", "machado", "hospicing", "haraway", "barad", "stengers", "relational", "post-human", "decolonial"], "caps": ["Cultural & Epistemic Inquiry", "Critical Consciousness"], "id": "relational-transcontextual-and-post-humanist-knowing", "orgs": ["bateson-institute", "emergence-network", "gtdf"], "cases": ["te-awa-tupua"], "gov": false, "reading": [], "short": "reln", "short_name": "Relational knowing", "family": "rel", "sectors": ["edu", "com"], "scales": ["per", "plc"], "work_kinds": ["sac", "int"], "goals": ["connect"], "lens": "Complexity as relationship: nothing exists on its own, and what something is depends on its connections, including its connection to whoever is looking.", "lens_status": "draft", "explainer": ["This pathway gathers thinkers who say we understand the world best through relationships, not by breaking it into separate parts. Gregory Bateson traced how mind is spread across organism and environment. Others question the idea that humans stand apart from the rest of life.", "It also asks hard questions about modern ways of knowing. Bayo Akomolafe and Vanessa Machado de Oliveira ask how even our efforts to fix things can repeat the patterns that caused harm, and invite slowing down and staying with difficulty rather than rushing to solutions."], "practice": ["Take one problem and describe it from five contexts: family, work, health, money, place.", "Notice when you reach for a quick solution, and stay one more conversation with the question.", "Ask what the situation looks like from beings or places with no voice in the room.", "Read one text slowly with others, and talk about what it did to you, not just what it said."], "sector_notes": {"biz": "Shows up in regenerative business and in questioning growth as a default.", "ngo": "Invites charities to examine how help can repeat the harms it set out to fix.", "health": "Relational care sees illness through a person's whole web of relationships.", "edu": "Relational pedagogy treats learning as something that happens between people.", "com": "Community work that starts from relationships rather than needs assessments."}, "key_ideas": [{"term": "ecology of mind", "defn": "Bateson's idea that mind is a pattern across organism and environment, not something inside a head."}, {"term": "transcontextual", "defn": "A problem lives in many contexts at once, and each shapes the others."}, {"term": "hospicing modernity", "defn": "Caring for a dying way of life well, so something new can emerge, rather than propping it up."}, {"term": "post-humanism", "defn": "Questioning the idea that humans stand apart from and above the rest of life."}, {"term": "agential realism", "defn": "Karen Barad's view that things come into being through their relationships."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "Gregory Bateson", "note": "Steps to an Ecology of Mind", "years": "1904–1980", "people": ["Gregory Bateson"]}, {"name": "Nora Bateson", "note": "Warm Data, Combining", "years": "b. 1969", "people": ["Nora Bateson"]}, {"name": "Bayo Akomolafe", "note": "These Wilds Beyond Our Fences", "years": "", "people": []}, {"name": "Vanessa Machado de Oliveira", "note": "Hospicing Modernity", "years": "", "people": []}]}, {"name": "Nora Bateson and Warm Data", "cluster": "Relational, Indigenous, and meaning", "overview": "Writer, filmmaker, and President of the International Bateson Institute. She carries her father Gregory's ecology of mind into living practice through Warm Data: information about the interrelationships that bind a complex system, found only by moving across contexts.", "road": "Gregory Bateson → An Ecology of Mind (film, 2010) → Small Arcs of Larger Circles (2016) → Warm Data Labs and host trainings → Combining (2023). Key ideas: transcontextual inquiry, symmathesy (mutual learning within living systems), aphanipoiesis (unseen coalescence toward vitality).", "mix": "Bayo Akomolafe, Tyson Yunkaporta, Otto Scharmer (as a structured counterpoint), the hosting practices", "policy": "Warm Data Labs hosted with public staff and residents change how people inside the system perceive and relate to an issue. Whatever policy or design follows comes from that shifted ground in its own time, not from findings harvested and handed over.", "links": [{"t": "International Bateson Institute", "u": "https://batesoninstitute.org"}, {"t": "Warm Data Lab", "u": "https://warmdatalab.net"}], "kind": "Hybrid", "terms": ["nora bateson", "warm data", "combining", "symmathesy", "transcontextual"], "caps": ["Observing & Listening", "Cultural & Epistemic Inquiry"], "id": "nora-bateson-and-warm-data", "orgs": ["bateson-institute"], "cases": ["zero-step"], "gov": false, "reading": [], "short": "warm", "short_name": "Nora Bateson and Warm Data", "family": "rel", "sectors": ["com", "ngo", "edu"], "scales": ["grp", "plc"], "work_kinds": ["cre", "att"], "goals": ["land"], "lens": "Complexity as interdependence across contexts: a problem lives in many contexts at once, and learning happens between them, in what Bateson calls symmathesy.", "lens_status": "draft", "explainer": ["Nora Bateson, daughter of Gregory Bateson, carries his ecology of mind into practice. Her central idea is Warm Data: information about how the parts of a system relate, which you can only find by looking across many contexts at once, such as family, economy, health and culture.", "Warm Data Labs are gatherings where people move between small conversations, each framed by a different context, and talk about an issue from their own lives. There is no goal and no output. The aim is that people start to perceive the issue differently, and change follows from that."], "practice": ["Pick an issue and talk about it with a friend through three contexts in turn: family, money, health.", "Notice when you want a takeaway, and let the conversation stay open instead.", "Attend a Warm Data Lab before trying to host one; host training is offered by the Bateson Institute.", "Keep a note of patterns that show up across contexts, not inside one."], "sector_notes": {"biz": "Used in leadership retreats to loosen fixed views of a problem.", "ngo": "Helps community programmes see how one issue tangles with others.", "health": "Shows how illness is bound up with work, family and place.", "edu": "Bateson writes on education for a confusing future; labs are run with teachers and students.", "com": "Labs are often hosted locally, open to anyone in a neighbourhood."}, "key_ideas": [{"term": "warm data", "defn": "Information about how parts of a system relate, gathered across many contexts at once."}, {"term": "symmathesy", "defn": "Living things learn and change together, in context. No part learns alone."}, {"term": "transcontextual", "defn": "A problem lives in many contexts at once: family, economy, health, culture."}, {"term": "aphanipoiesis", "defn": "Bateson's word for the unseen ways things come together toward vitality."}, {"term": "warm data lab", "defn": "A gathering where people talk about an issue through many contexts in turn, with no set outcome."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "Gregory Bateson", "note": "", "years": "1904–1980", "people": ["Gregory Bateson"]}, {"name": "An Ecology of Mind", "note": "film, 2010", "years": "", "people": []}, {"name": "Small Arcs of Larger Circles", "note": "2016", "years": "", "people": []}, {"name": "Warm Data Labs and host trainings", "note": "", "years": "", "people": []}, {"name": "Combining (2023). Key ideas: transcontextual inquiry, symmathesy (mutual learning within living systems), aphanipoiesis (unseen coalescence toward vitality).", "note": "", "years": "", "people": []}]}, {"name": "Indigenous and land-based knowledge", "cluster": "Relational, Indigenous, and meaning", "overview": "Knowledge held in relationship with land, kin, and story, where reciprocity and pattern are themselves ways of knowing.", "road": "Vine Deloria Jr. → Gregory Cajete (Native Science) → Robin Wall Kimmerer (Braiding Sweetgrass, the Honorable Harvest) → Tyson Yunkaporta (Sand Talk)", "mix": "Leroy Little Bear, Winona LaDuke, Elinor Ostrom on the commons", "policy": "Indigenous-led stewardship and co-management of land and water, reciprocity as a design principle, and consultation that shares power instead of extracting input.", "links": [{"t": "Robin Wall Kimmerer", "u": "https://www.robinwallkimmerer.com"}, {"t": "Center for Native Peoples and the Environment", "u": "https://www.esf.edu/nativepeoples/"}], "kind": "Tradition", "terms": ["indigenous", "kimmerer", "sweetgrass", "yunkaporta", "sand talk", "cajete", "land-based", "traditional knowledge"], "caps": ["Ecological & Planetary Inquiry", "Cultural & Epistemic Inquiry", "Spiritual & Moral Inquiry"], "id": "indigenous-and-land-based-knowledge", "orgs": ["kimmerer"], "cases": ["menominee", "te-awa-tupua"], "gov": false, "reading": [], "short": "indig", "short_name": "Indigenous and land-based knowledge", "family": "rel", "sectors": ["com", "edu"], "scales": ["plc", "pla"], "work_kinds": ["sub", "com", "sac"], "goals": ["land"], "lens": "Complexity as kinship and pattern: knowledge lives in relationship with land and community over generations, and right relationship is part of what makes it true.", "lens_status": "draft", "explainer": ["Indigenous and land-based knowledge is knowledge held by peoples in long relationship with particular lands, waters and kin. It is carried in story, ceremony, language, practice and law, and it treats reciprocity and responsibility as part of knowing.", "This pathway points to Indigenous authors who write for wider audiences, like Robin Wall Kimmerer and Tyson Yunkaporta. It is not a set of techniques to borrow. Engaging well means relationship, consent, credit and shared power, guided by the communities whose knowledge it is."], "practice": ["Learn whose land you are on, and what the nations there ask of visitors and neighbours.", "Read Indigenous authors in their own words before reading about them.", "When a project draws on Indigenous knowledge, ask who was consulted, who consented, and who benefits.", "Support Indigenous-led organizations with money and decision power, not only invitations."], "sector_notes": {"biz": "Free, prior and informed consent is a standard for projects on Indigenous land.", "ngo": "Conservation groups are shifting toward Indigenous-led stewardship.", "health": "Culturally grounded care, led by Indigenous health services, improves outcomes.", "edu": "Land-based education and Indigenous science sit alongside Western science in some curricula.", "com": "Co-management of land and water shares authority between nations and governments."}, "key_ideas": [{"term": "reciprocity", "defn": "Taking only what is given, and giving back in return, as a principle of relationship."}, {"term": "honorable harvest", "defn": "Kimmerer's guidelines for taking from the land with respect, so it can keep giving."}, {"term": "two-eyed seeing", "defn": "Seeing with the strengths of Indigenous and Western knowledge together, from Mi'kmaw Elder Albert Marshall."}, {"term": "free, prior and informed consent", "defn": "The right of Indigenous peoples to agree or refuse before projects affect their lands."}, {"term": "land-based knowledge", "defn": "Knowledge that comes from long relationship with a particular place."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "Vine Deloria Jr.", "note": "", "years": "1933–2005", "people": ["Vine Deloria Jr."]}, {"name": "Gregory Cajete", "note": "Native Science", "years": "", "people": []}, {"name": "Robin Wall Kimmerer", "note": "Braiding Sweetgrass, the Honorable Harvest", "years": "b. 1953", "people": ["Robin Wall Kimmerer"]}, {"name": "Tyson Yunkaporta", "note": "Sand Talk", "years": "", "people": []}]}, {"name": "Presencing, Theory U, and Social Presencing Theater", "cluster": "Relational, Indigenous, and meaning", "overview": "Change that starts by suspending habitual seeing, sensing the whole, and letting new possibilities take form through the group.", "road": "Kurt Lewin (action research) → Argyris and Schön → Peter Senge → Otto Scharmer (Theory U, shaped in part by his interviews with Francisco Varela) → Arawana Hayashi (Social Presencing Theater, sensing a system through embodied movement)", "mix": "David Bohm (On Dialogue), Katrin Kaufer, Adam Kahane (transformative scenario planning)", "policy": "Co-sensing with residents and frontline staff before anything is designed. u.lab runs are widely used by public teams. Social Presencing Theater is hosted as embodied sensing, not as a technique for gathering input.", "links": [{"t": "Presencing Institute and u.lab", "u": "https://www.presencing.org"}, {"t": "Reos Partners", "u": "https://reospartners.com"}], "kind": "Hybrid", "terms": ["theory u", "scharmer", "presencing", "u-lab", "u.lab", "social presencing", "hayashi"], "caps": ["Leading in Complexity", "Observing & Listening"], "id": "presencing-theory-u-and-social-presencing-theater", "orgs": ["presencing", "reos"], "cases": ["food-lab"], "gov": true, "reading": [], "short": "theoryu", "short_name": "Presencing and Theory U", "family": "rel", "sectors": ["biz", "gov", "ngo"], "scales": ["grp", "org"], "work_kinds": ["int"], "goals": ["grow"], "lens": "Complexity as the future emerging: the quality of attention in a group shapes what it can bring into being, so change begins with how people see.", "lens_status": "draft", "explainer": ["Theory U describes a journey for groups facing change. Instead of jumping from a problem to a solution, a group goes down the U: suspending habitual judgements, sensing the whole system, and connecting at the bottom with what wants to emerge. Then it comes up the other side by prototyping and building.", "Otto Scharmer and the Presencing Institute developed it from interviews with many leaders and thinkers. Social Presencing Theater, created by Arawana Hayashi, uses simple movement so groups can sense a system with their bodies. The free u.lab course has reached many public-sector teams."], "practice": ["Before your next project, go on a learning journey to see the system from the other side.", "Practise listening at four levels: downloading, factual, empathic and generative.", "Try a short stuckness-to-movement exercise from Social Presencing Theater.", "Prototype quickly once an idea crystallizes, and learn from real use."], "sector_notes": {"biz": "Used in leadership programmes and organizational change.", "ngo": "Coalitions use u.lab hubs to build shared awareness.", "health": "Health systems have run Theory U journeys with patients and staff.", "edu": "u.school applies it to education transformation.", "com": "Community hubs run u.lab locally."}, "key_ideas": [{"term": "presencing", "defn": "Sensing and acting from the highest future possibility, from presence plus sensing."}, {"term": "theory u", "defn": "A change process that moves through seeing, sensing and presencing before prototyping."}, {"term": "downloading", "defn": "Listening that only confirms what you already think."}, {"term": "learning journey", "defn": "Visiting places and people in a system to see it freshly."}, {"term": "social presencing theater", "defn": "Arawana Hayashi's movement practice for sensing a system with the body."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "Kurt Lewin", "note": "action research", "years": "1890–1947", "people": ["Kurt Lewin"]}, {"name": "Argyris and Schön", "note": "", "years": "", "people": []}, {"name": "Peter Senge", "note": "", "years": "b. 1947", "people": ["Peter Senge"]}, {"name": "Otto Scharmer", "note": "Theory U, shaped in part by his interviews with Francisco Varela", "years": "b. 1961", "people": ["Otto Scharmer"]}, {"name": "Arawana Hayashi", "note": "Social Presencing Theater, sensing a system through embodied movement", "years": "", "people": []}]}, {"name": "The metacrisis and meaning", "cluster": "Relational, Indigenous, and meaning", "overview": "Treats interlocking ecological, social, and epistemic crises as one pattern rooted in how modern culture perceives and makes meaning.", "road": "Bateson and Edgar Morin (†2026) → Iain McGilchrist (The Matter with Things) → Jonathan Rowson (Perspectiva) → Zak Stein and John Vervaeke", "mix": "Vanessa Machado de Oliveira, Nora Bateson", "policy": "Long-horizon governance, and the sensemaking and meaning-making capacity democracies need to handle intertwined crises.", "links": [{"t": "Perspectiva", "u": "https://systems-souls-society.com"}, {"t": "Channel McGilchrist", "u": "https://channelmcgilchrist.com"}], "kind": "Lineage", "terms": ["metacrisis", "meta-crisis", "mcgilchrist", "perspectiva", "rowson", "polycrisis", "meaning crisis", "great simplification"], "caps": ["Spiritual & Moral Inquiry", "Critical Consciousness"], "id": "the-metacrisis-and-meaning", "orgs": ["gtdf", "perspectiva"], "cases": ["wales-future-generations"], "gov": false, "reading": [], "short": "meta", "short_name": "Metacrisis and meaning", "family": "rel", "sectors": ["edu"], "scales": ["per", "pla"], "work_kinds": ["sac", "int"], "goals": ["grow"], "lens": "Complexity as one pattern beneath many crises: the way a culture attends to the world shapes the problems it produces and the solutions it can see.", "lens_status": "draft", "explainer": ["The metacrisis is the idea that climate breakdown, inequality, polarization and other crises are not separate problems but symptoms of a deeper pattern in how modern culture perceives, values and makes sense of the world.", "Thinkers here, including Iain McGilchrist, Jonathan Rowson and Zak Stein, look at attention, meaning, education and the health of public sensemaking. Their claim is that technical fixes alone will not be enough without changes in how people see, and that this inner work is also public work."], "practice": ["Pick two crises you care about and ask what they have in common at the level of values and attention.", "Notice where your own attention goes in a day, and what that trains you to see.", "Join or host a small reading circle on Perspectiva or McGilchrist and discuss what it changes in your work.", "Ask what an institution would need to sense the long term, not just the next cycle."], "sector_notes": {"biz": "Raises questions about attention-harvesting business models.", "ngo": "Asks charities whether single-issue campaigns can address shared roots.", "health": "Links mental health to meaning and the wider culture.", "edu": "Education for the metacrisis focuses on wisdom and sensemaking, not only skills.", "com": "Local groups explore meaning and practice together in study circles."}, "key_ideas": [{"term": "metacrisis", "defn": "The idea that many crises share one root in how modern culture sees and makes meaning."}, {"term": "polycrisis", "defn": "Several crises interacting so the whole is worse than the sum."}, {"term": "meaning crisis", "defn": "John Vervaeke's term for the loss of shared ways to make sense of life."}, {"term": "hemisphere hypothesis", "defn": "McGilchrist's argument that culture has come to favour a narrow, grasping kind of attention."}, {"term": "sensemaking", "defn": "Working out together what's going on in an unclear situation, before deciding what to do."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "Bateson and Edgar Morin", "note": "†2026", "years": "1921–2026", "people": ["Edgar Morin"]}, {"name": "Iain McGilchrist", "note": "The Matter with Things", "years": "b. 1953", "people": ["Iain McGilchrist"]}, {"name": "Jonathan Rowson", "note": "Perspectiva", "years": "b. 1977", "people": ["Jonathan Rowson"]}, {"name": "Zak Stein and John Vervaeke", "note": "", "years": "", "people": []}]}, {"name": "Semiotics: signs, codes, and meaning-making", "cluster": "Relational, Indigenous, and meaning", "kind": "Lineage", "overview": "How anything comes to mean something: words, images, rules, forms, tracks in the snow. Meaning is not stored in things but made in a three-way relation between a sign, what it points to, and whoever reads it, and whole cultures are woven from these relations.", "road": "Charles Sanders Peirce (icon, index, symbol; semiosis) → Ferdinand de Saussure (signifier and signified) → Yuri Lotman (the semiosphere, Tartu–Moscow school) → Umberto Eco (<i>A Theory of Semiotics<\/i>) → Eduardo Kohn (<i>How Forests Think<\/i>, semiotics beyond the human)", "mix": "Roland Barthes (myth), Thomas Sebeok, Gregory Bateson, the narrative change pathway, biosemiotics", "policy": "Public signs, forms, and warnings are sign systems. Semiotics helps check what a message actually signals to different readers, design warnings meant to outlast the people who made them, and see how official categories shape what a system can notice.", "links": [{"t": "Peirce's theory of signs (Stanford Encyclopedia of Philosophy)", "u": "https://plato.stanford.edu/entries/peirce-semiotics/"}, {"t": "Semiosphere (overview)", "u": "https://en.wikipedia.org/wiki/Semiosphere"}, {"t": "Eduardo Kohn: How Forests Think (UC Press)", "u": "https://www.ucpress.edu/books/how-forests-think/paper"}, {"t": "University of Tartu: Institute of Philosophy and Semiotics", "u": "https://filsem.ut.ee/en"}], "terms": ["semiotic", "semiosis", "peirce", "saussure", "lotman", "semiosphere", "signifier", "umberto eco", "how forests think", "tartu"], "caps": ["Cultural & Epistemic Inquiry", "Narrative & Media Analysis", "Critical Consciousness"], "id": "semiotics-signs-codes-and-meaning-making", "orgs": ["tartu-semiotics", "iass"], "cases": ["ten-millennia"], "gov": false, "reading": [], "short": "semio", "short_name": "Semiotics", "family": "rel", "sectors": ["edu", "gov"], "scales": ["grp", "pol"], "work_kinds": ["cre", "att"], "goals": ["connect"], "lens": "Complexity as meaning-making: wh
