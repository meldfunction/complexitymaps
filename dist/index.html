at a sign means depends on a three-way relation between the sign, what it points to and whoever reads it, so meaning is always in motion and different for different readers.", "lens_status": "draft", "explainer": ["Semiotics is the study of signs: anything that stands for something else to someone. Words, pictures, traffic lights, smoke meaning fire, a uniform meaning authority. Charles Sanders Peirce described three kinds: icons, which resemble what they stand for; indexes, which are connected to it, like a footprint; and symbols, which work by convention, like most words.", "From there semiotics looks at how whole cultures run on sign systems. Saussure showed that meaning comes from differences within a system. Yuri Lotman described the semiosphere, the shared space of meaning a culture lives in. Eduardo Kohn extends the question beyond humans: in How Forests Think, he shows how the Amazonian forest is full of other beings interpreting signs."], "practice": ["Take one public form or sign and ask three different people what it tells them; compare.", "Sort the signs in a service into icons, indexes and symbols, and check which depend on knowledge some users lack.", "When a message must last, use several kinds of sign together and repeat it in more than one channel.", "Ask what an official category (like 'household' or 'disability') makes visible and what it hides."], "sector_notes": {"biz": "Branding and user interface design are applied semiotics.", "ngo": "Campaigns test how symbols land with different audiences.", "health": "Warning labels and patient information depend on signs being read as intended.", "edu": "Media literacy teaches students to read images and texts as sign systems.", "com": "Public art and place names carry meanings that differ between communities."}, "key_ideas": [{"term": "semiotics", "defn": "The study of signs: anything that stands for something else to someone."}, {"term": "icon, index, symbol", "defn": "Peirce's three kinds of sign: by resemblance, by connection, and by convention."}, {"term": "signifier and signified", "defn": "Saussure's split between the form of a sign and the concept it carries."}, {"term": "semiosphere", "defn": "Lotman's term for the shared space of signs a culture lives in."}, {"term": "semiosis", "defn": "The process by which something comes to stand for something else to someone."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "Charles Sanders Peirce", "note": "icon, index, symbol; semiosis", "years": "1839–1914", "people": ["Charles Sanders Peirce"]}, {"name": "Ferdinand de Saussure", "note": "signifier and signified", "years": "1857–1913", "people": ["Ferdinand de Saussure"]}, {"name": "Yuri Lotman", "note": "the semiosphere, Tartu–Moscow school", "years": "1922–1993", "people": ["Yuri Lotman"]}, {"name": "Umberto Eco", "note": "A Theory of Semiotics", "years": "1932–2016", "people": ["Umberto Eco"]}, {"name": "Eduardo Kohn", "note": "How Forests Think, semiotics beyond the human", "years": "", "people": []}]}, {"name": "Living systems and regeneration", "cluster": "Living systems", "overview": "Life as self-producing and interdependent, applied to ecological resilience and regenerative design of cultures and economies.", "road": "Maturana and Varela (autopoiesis) → Fritjof Capra → Daniel Christian Wahl (Designing Regenerative Cultures), alongside C.S. Holling → Carl Folke (resilience)", "mix": "Donella Meadows, Joanna Macy", "policy": "Resilience planning, climate adaptation, and bioregional thinking that treats places as living systems.", "links": [{"t": "Capra Course", "u": "https://www.capracourse.net"}, {"t": "Stockholm Resilience Centre", "u": "https://www.stockholmresilience.org"}], "kind": "Lineage", "terms": ["regenerat", "living system", "capra", "wahl", "resilience", "autopoie", "maturana", "varela", "biomimic", "bioregion"], "caps": ["Regenerative Systems Design", "Ecological & Planetary Inquiry"], "id": "living-systems-and-regeneration", "orgs": ["src", "capra"], "cases": ["menominee", "mink-hiiumaa"], "gov": false, "reading": [], "short": "livsys", "short_name": "Living systems and regeneration", "family": "rel", "sectors": ["com", "edu"], "scales": ["plc", "pla"], "work_kinds": ["sub"], "goals": ["connect", "land"], "lens": "Complexity as life itself: self-making networks that keep renewing themselves and their surroundings.", "lens_status": "draft", "explainer": ["Living systems thinking starts from what life does: living things make and remake themselves, depend on each other, and adapt to change. Maturana and Varela called this self-making autopoiesis. Fritjof Capra and others showed how the same principles apply to ecosystems and human communities.", "Two practical strands grew from it. Resilience thinking studies how social-ecological systems absorb shocks and reorganize. Regenerative design asks how human activity can leave places healthier than before, not just do less harm."], "practice": ["Treat your place as a living system: map flows of water, food, energy and people.", "Ask of any project whether it leaves the place more or less able to renew itself.", "Look for slow variables, like soil health or trust, that shape what is possible later.", "Design for diversity and redundancy, not just efficiency."], "sector_notes": {"biz": "Regenerative business and circular economy apply these ideas.", "ngo": "Conservation and land groups use resilience thinking.", "health": "One Health links human, animal and environmental health.", "edu": "Ecoliteracy brings living-systems thinking into schools.", "com": "Bioregional and transition groups organize around their watershed or region."}, "key_ideas": [{"term": "autopoiesis", "defn": "Self-making: living systems produce and maintain themselves."}, {"term": "resilience", "defn": "A system's capacity to absorb shocks and reorganize while keeping its core functions."}, {"term": "regenerative design", "defn": "Design that leaves places and communities healthier than before."}, {"term": "bioregion", "defn": "A region defined by natural features like a watershed, rather than by political lines."}, {"term": "adaptive cycle", "defn": "C.S. Holling's model of growth, conservation, release and reorganization in living systems."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "Maturana and Varela", "note": "autopoiesis", "years": "", "people": []}, {"name": "Fritjof Capra", "note": "", "years": "b. 1939", "people": ["Fritjof Capra"]}, {"name": "Daniel Christian Wahl (Designing Regenerative Cultures), alongside C.S. Holling", "note": "", "years": "", "people": []}, {"name": "Carl Folke", "note": "resilience", "years": "b. 1955", "people": ["Carl Folke"]}]}, {"name": "Biosemiotics and the Umwelt", "cluster": "Living systems", "kind": "Lineage", "overview": "Life runs on signs, not just chemistry. Every organism lives in its own Umwelt, the world as its senses and needs make it meaningful, and living systems are webs of interpretation from cells to ecosystems.", "road": "Jakob von Uexküll (Umwelt, <i>A Foray into the Worlds of Animals and Humans<\/i>) → Thomas Sebeok (zoosemiotics) → Jesper Hoffmeyer (<i>Signs of Meaning in the Universe<\/i>, semiotic freedom) → Kalevi Kull (Tartu biosemiotics, ecosemiotics) → Terrence Deacon (<i>Incomplete Nature<\/i>)", "mix": "Gregory Bateson (a difference that makes a difference), Maturana and Varela, Charles Sanders Peirce, Eduardo Kohn, Timo Maran (ecosemiotics)", "policy": "Conservation and urban planning that ask what a place means to the species living there, not only how many there are: Umwelt-based analysis of city green spaces, and reintroduction projects that read local human meanings of an animal as carefully as its ecology.", "links": [{"t": "International Society for Biosemiotic Studies", "u": "https://biosemiotics.org/"}, {"t": "Biosemiotics (overview)", "u": "https://en.wikipedia.org/wiki/Biosemiotics"}, {"t": "Umwelt (overview)", "u": "https://en.wikipedia.org/wiki/Umwelt"}, {"t": "Ecosemiotics at the University of Tartu", "u": "https://www.ecosem.ut.ee/en/?p=36"}], "terms": ["biosemiotic", "umwelt", "uexküll", "uexkull", "hoffmeyer", "sebeok", "semiotic freedom", "ecosemiotic", "zoosemiotic", "multispecies"], "caps": ["Ecological & Planetary Inquiry", "Cultural & Epistemic Inquiry", "Systems Thinking & Modeling"], "id": "biosemiotics-and-the-umwelt", "orgs": ["isbs", "tartu-semiotics"], "cases": ["mink-hiiumaa"], "gov": false, "reading": [], "short": "biosem", "short_name": "Biosemiotics and Umwelt", "family": "rel", "sectors": ["edu", "com"], "scales": ["plc", "pla"], "work_kinds": ["sub", "att"], "goals": ["connect", "land"], "lens": "Complexity as interpretation: living systems are webs of beings reading signs from each other and their surroundings, so to understand a living system you ask what things mean to whom.", "lens_status": "draft", "explainer": ["Biosemiotics studies life as a world of signs. A bacterium swims toward sugar because it reads a chemical gradient as a sign of food. A bird hears an alarm call and flees. A cell responds to a hormone. In each case something stands for something else to a living being, and the being acts on it.", "The idea goes back to Jakob von Uexküll, who said every animal lives in its own Umwelt: the slice of the world its senses and needs make meaningful. A tick's world has only a few signs in it. Biosemiotics, developed in Copenhagen and Tartu, argues that meaning is part of nature, not something only human minds add."], "practice": ["Pick an animal near you and list what its world is made of: what it notices, what it ignores, what signals danger or food.", "When planning a green space, ask what the place means to the species that use it, not only how many there are.", "Read Uexküll's short Foray into the Worlds of Animals and Humans with a group and walk a place through different Umwelten.", "In a reintroduction or conservation project, map what the species means to local people as well as what it needs."], "sector_notes": {"biz": "Sensory design and animal welfare draw on how other species perceive.", "ngo": "Conservation groups use Umwelt thinking to reduce human-wildlife conflict.", "health": "Cell signalling and the immune system are prime examples of biological sign processes.", "edu": "A strong bridge between biology, philosophy and the humanities.", "com": "Umwelt-based walks help residents see their neighbourhood through other species."}, "key_ideas": [{"term": "umwelt", "defn": "The world as a particular animal experiences it: only what its senses and needs make meaningful."}, {"term": "biosemiotics", "defn": "The study of signs and meaning in living systems, from cells to ecosystems."}, {"term": "semiotic freedom", "defn": "How many ways a living thing can respond to the same sign; it tends to grow through evolution."}, {"term": "ecosemiotics", "defn": "The study of how signs connect cultures and ecosystems, developed in Tartu."}, {"term": "semiosis", "defn": "The process by which something comes to stand for something else to someone."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "Jakob von Uexküll", "note": "Umwelt, A Foray into the Worlds of Animals and Humans", "years": "1864–1944", "people": ["Jakob von Uexküll"]}, {"name": "Thomas Sebeok", "note": "zoosemiotics", "years": "1920–2001", "people": ["Thomas Sebeok"]}, {"name": "Jesper Hoffmeyer", "note": "Signs of Meaning in the Universe, semiotic freedom", "years": "1942–2019", "people": ["Jesper Hoffmeyer"]}, {"name": "Kalevi Kull", "note": "Tartu biosemiotics, ecosemiotics", "years": "b. 1952", "people": ["Kalevi Kull"]}, {"name": "Terrence Deacon", "note": "Incomplete Nature", "years": "b. 1950", "people": ["Terrence Deacon"]}]}, {"name": "Sensemaking and acting in uncertainty", "cluster": "Organizing and sensemaking", "overview": "Practical frameworks for telling ordered problems from complex ones and acting through small, safe-to-fail probes.", "road": "W. Ross Ashby → Karl Weick (†2026) → Alicia Juarrero → Dave Snowden (Cynefin) → Glenda Eoyang (Human Systems Dynamics)", "mix": "Stacey and Shaw's complex responsive processes", "policy": "Cynefin in policy and national risk work, safe-to-fail probes instead of big pilots, and distributed citizen narratives as live evidence.", "links": [{"t": "The Cynefin Company", "u": "https://thecynefin.co"}, {"t": "Human Systems Dynamics Institute", "u": "https://www.hsdinstitute.org"}], "kind": "Method", "terms": ["cynefin", "snowden", "sensemaking", "sense-making", "weick", "eoyang", "human systems dynamics", "juarrero"], "caps": ["Complex Problem Solving", "Leading in Complexity"], "id": "sensemaking-and-acting-in-uncertainty", "orgs": ["cynefin", "hsd"], "cases": ["rahs"], "gov": true, "reading": [], "short": "sense", "short_name": "Sensemaking in uncertainty", "family": "sci", "sectors": ["gov", "biz", "ngo"], "scales": ["org", "pol"], "work_kinds": ["adm", "att"], "goals": ["uncertain"], "lens": "Complexity as a domain. In Cynefin, a complex situation is one where cause and effect can only be seen in hindsight, so you run small probes, sense what happens and respond, rather than analyse and plan.", "lens_status": "draft", "explainer": ["Sensemaking is how people work out what's going on when a situation is unclear, before deciding what to do. This pathway gathers practical tools for it. The best known is Cynefin, which sorts situations by how well cause and effect can be known: clear, complicated, complex or chaotic.", "In clear and complicated situations you can analyse and plan. In complex ones, cause and effect only make sense looking back, so you act in small, reversible steps, watch what happens and adjust. Many organizations get into trouble by treating complex problems as if they had a knowable answer."], "practice": ["Before deciding, sort the situation: is the answer known, knowable by experts, only visible in hindsight, or is it chaos?", "For complex issues, design three or four small, safe-to-fail probes instead of one big pilot.", "Agree in advance what you would amplify and what would make you stop each probe.", "Collect short stories from people affected and look for patterns across many of them, not one star example."], "sector_notes": {"biz": "Used to separate operational problems with best practice from market shifts that need probing.", "ngo": "Helps programmes stop reporting complex work as if it followed a logic model.", "health": "Clinical protocols suit clear cases; patients with many conditions often sit in the complex domain.", "edu": "School leaders use it to tell timetable problems apart from culture problems.", "com": "Neighbourhood groups can run small experiments and keep what works."}, "key_ideas": [{"term": "cynefin", "defn": "A framework from Dave Snowden that sorts situations into clear, complicated, complex and chaotic. Each needs a different way of acting."}, {"term": "sensemaking", "defn": "Working out together what's going on in an unclear situation, before deciding what to do."}, {"term": "safe-to-fail", "defn": "A small experiment designed so that if it fails, the damage is small and you still learn."}, {"term": "probe-sense-respond", "defn": "In complex situations, act a little, see what happens, then adjust."}, {"term": "weak signals", "defn": "Early, faint signs of change that are easy to dismiss."}], "plain_overview": "Tools for working out what's going on when nobody can know the answer in advance, and acting in small steps.", "plain_policy": "Used in government to plan for risk, run small tests instead of big pilots, and treat people's own stories as up-to-date evidence.", "stops": [{"name": "W. Ross Ashby", "note": "", "years": "1903–1972", "people": ["W. Ross Ashby"]}, {"name": "Karl Weick", "note": "†2026", "years": "1936–2026", "people": ["Karl Weick"]}, {"name": "Alicia Juarrero", "note": "", "years": "", "people": []}, {"name": "Dave Snowden", "note": "Cynefin", "years": "b. 1954", "people": ["Dave Snowden"]}, {"name": "Glenda Eoyang", "note": "Human Systems Dynamics", "years": "", "people": []}]}, {"name": "Governance and self-organizing structures", "cluster": "Organizing and sensemaking", "overview": "Designing decision structures that use feedback, consent, and distributed authority instead of command and control.", "road": "Ashby → Stafford Beer (Viable System Model) → Kees Boeke and Gerard Endenburg (†2025, sociocracy) → Elinor Ostrom (polycentric governance)", "mix": "Frederic Laloux, the Buurtzorg case, Indy Johar (Dark Matter Labs)", "policy": "Ostrom's design principles for co-governance of shared resources, polycentric arrangements across agencies, and consent-based structures inside teams.", "links": [{"t": "Sociocracy For All", "u": "https://www.sociocracyforall.org"}, {"t": "Ostrom Workshop", "u": "https://ostromworkshop.indiana.edu"}, {"t": "American Society for Cybernetics", "u": "https://asc-cybernetics.org"}], "kind": "Structure", "terms": ["sociocracy", "holacracy", "self-management", "self-organizing", "ostrom", "commons", "polycentric", "viable system", "consent"], "caps": ["Leading in Complexity", "Organizing & Facilitating"], "id": "governance-and-self-organizing-structures", "orgs": ["sofa", "ostrom"], "cases": ["cybersyn", "buurtzorg"], "gov": false, "reading": [], "short": "selforg", "short_name": "Self-organizing governance", "family": "sci", "sectors": ["biz", "ngo", "com"], "scales": ["org", "grp"], "work_kinds": ["com"], "goals": ["others"], "lens": "Complexity as distributed control: no single centre can know enough, so authority and feedback are designed to sit close to the work, linked so the whole can still adapt.", "lens_status": "draft", "explainer": ["This pathway is about how groups can govern themselves without a single boss making every call. It gathers tested designs: sociocracy, where decisions are made by consent in linked circles; the Viable System Model, which shows the functions any organization needs; and Elinor Ostrom's principles for communities that manage shared resources like water or forests.", "Self-organizing does not mean structureless. These designs are often more explicit than a hierarchy about who decides what, how objections are heard, and how information travels. They spread authority to where the knowledge is."], "practice": ["Map who actually decides what today, including the informal decisions.", "Try consent for one recurring decision: proceed unless someone has a reasoned objection that it would cause harm.", "Write down the domain of one team: what it can decide without asking.", "If you share a resource, check it against Ostrom's eight principles, such as clear boundaries and local monitoring."], "sector_notes": {"biz": "Buurtzorg and Haier show self-managing teams at scale; many firms use consent in leadership teams.", "ngo": "Small charities and co-ops use sociocracy to share decisions with staff and members.", "health": "Self-managing nurse teams in home care are the best-known example.", "edu": "Student councils and staff circles can run on consent rather than majority vote.", "com": "Community land trusts, housing co-ops and allotments are classic commons."}, "key_ideas": [{"term": "sociocracy", "defn": "A way of governing with consent decisions in linked circles, so every voice has a route."}, {"term": "consent", "defn": "A decision passes unless someone has a reasoned objection that it would cause harm, not when everyone agrees."}, {"term": "commons", "defn": "A shared resource managed by the community that uses it."}, {"term": "polycentric governance", "defn": "Many centres of decision at different scales, overlapping and checking each other."}, {"term": "viable system model", "defn": "Stafford Beer's model of the five functions any organization needs to survive and adapt."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "Ashby", "note": "", "years": "", "people": []}, {"name": "Stafford Beer", "note": "Viable System Model", "years": "1926–2002", "people": ["Stafford Beer"]}, {"name": "Kees Boeke and Gerard Endenburg", "note": "†2025, sociocracy", "years": "1933–2025; 1884–1966", "people": ["Gerard Endenburg", "Kees Boeke"]}, {"name": "Elinor Ostrom", "note": "polycentric governance", "years": "1933–2012", "people": ["Elinor Ostrom"]}]}, {"name": "Emergence in movements and social change", "cluster": "Movements and hosting", "overview": "How small, relational, adaptive actions scale into systemic change without central control.", "road": "Grace Lee Boggs and Octavia Butler → adrienne maree brown (Emergent Strategy) → Margaret Wheatley and the Berkana Two Loops model", "mix": "Nora Bateson on change that happens between contexts", "policy": "Governments hosting rather than directing: funding networks, backing community-led pilots, and using the Two Loops model to steward transitions.", "links": [{"t": "adrienne maree brown", "u": "https://adriennemareebrown.net"}, {"t": "Berkana Institute", "u": "https://berkana.org"}, {"t": "Margaret Wheatley", "u": "https://www.margaretwheatley.com"}], "kind": "Field", "terms": ["emergent strategy", "adrienne maree brown", "movement", "wheatley", "berkana", "two loops", "grace lee boggs"], "caps": ["Organizing & Facilitating", "Advocacy & Political Participation"], "id": "emergence-in-movements-and-social-change", "orgs": ["berkana", "boggs"], "cases": ["sva", "highlander-case", "wajir"], "gov": false, "reading": [], "short": "moves", "short_name": "Emergence in movements", "family": "chg", "sectors": ["com"], "scales": ["plc", "pol"], "work_kinds": ["com", "pol"], "goals": ["power"], "lens": "Complexity as emergence: patterns at scale grow from small, repeated relationships and practices, so how you work locally is the strategy.", "lens_status": "draft", "explainer": ["This pathway is about how social change grows from small relationships and practices rather than from a master plan. adrienne maree brown's Emergent Strategy draws on Octavia Butler and Grace Lee Boggs: change spreads like patterns in nature, through many small, adaptive actions.", "Margaret Wheatley and the Berkana Institute's Two Loops model describes how, as an old system declines, people build the new one in networks that connect, grow into communities of practice and finally become the new norm. How you work locally is the strategy."], "practice": ["Pick one small practice you want to see in the world and make it how your group works now.", "Map the people pioneering the new and connect two of them who have not met.", "Name who is hospicing the old system and how you can support them too.", "Review your group's work by asking what grew, not just what was achieved."], "sector_notes": {"biz": "Purpose-driven firms borrow emergent strategy for culture change.", "ngo": "Networks and alliances use the Two Loops model to plan transitions.", "health": "Patient movements show change growing from small groups.", "edu": "Student-led movements spread through relationships.", "com": "Mutual aid networks are emergent strategy in practice."}, "key_ideas": [{"term": "emergent strategy", "defn": "adrienne maree brown's approach: change grows from small, adaptive, relational actions."}, {"term": "two loops", "defn": "Berkana's model of an old system declining while a new one grows through networks."}, {"term": "fractal", "defn": "The idea that how we work at small scale repeats at large scale."}, {"term": "network", "defn": "Connections between people who share an interest, the first stage of emergence."}, {"term": "community of practice", "defn": "A group that shares a practice and learns from each other over time."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "Grace Lee Boggs and Octavia Butler", "note": "", "years": "1915–2015; 1947–2006", "people": ["Grace Lee Boggs", "Octavia Butler"]}, {"name": "adrienne maree brown", "note": "Emergent Strategy", "years": "", "people": []}, {"name": "Margaret Wheatley and the Berkana Two Loops model", "note": "", "years": "", "people": []}]}, {"name": "Hosting and participatory practice", "cluster": "Movements and hosting", "overview": "Methods for convening groups so that collective intelligence and new patterns can emerge from the room.", "road": "Harrison Owen (Open Space) → Juanita Brown and David Isaacs (World Café) → Art of Hosting (Toke Møller, Chris Corrigan) → Liberating Structures (Lipmanowicz and McCandless) → Warm Data Labs", "mix": "David Bohm (On Dialogue), sociocracy, Social Presencing Theater", "policy": "Participatory processes, citizens' assemblies, and deliberative forums, with Art of Hosting methods long used in public institutions.", "links": [{"t": "Art of Hosting", "u": "https://artofhosting.org"}, {"t": "Liberating Structures", "u": "https://www.liberatingstructures.com"}, {"t": "The World Café", "u": "https://theworldcafe.com"}], "kind": "Practice", "terms": ["art of hosting", "open space", "world café", "world cafe", "liberating structures", "facilitat", "convening"], "caps": ["Organizing & Facilitating"], "id": "hosting-and-participatory-practice", "orgs": ["aoh", "ls"], "cases": ["porto-alegre"], "gov": true, "reading": [], "short": "host", "short_name": "Hosting", "family": "chg", "sectors": ["ngo", "com", "gov"], "scales": ["grp", "plc"], "work_kinds": ["car", "com"], "goals": ["others"], "lens": "Complexity in the room: when the right people meet around a real question, the group can produce ideas and commitments no one brought with them.", "lens_status": "draft", "explainer": ["Hosting is the craft of convening groups so that they can think and act well together. It brings a family of methods: Open Space, where participants set the agenda; World Café, small rotating table conversations; Circle; and Liberating Structures, 33 simple patterns that replace the usual meeting formats.", "The Art of Hosting community teaches these as a practice, not a toolkit. The host's job is to set a clear purpose, invite the right people and create conditions for the conversation that matters, then trust the group."], "practice": ["Write a powerful question for your next meeting, one people actually want to talk about.", "Replace one presentation with a 1-2-4-All from Liberating Structures.", "Try Open Space for an issue with many owners: let participants set the agenda.", "Close with a harvest: decide how the group's thinking will be captured and used."], "sector_notes": {"biz": "Liberating Structures are widely used in agile teams.", "ngo": "Art of Hosting is common in networks and coalitions.", "health": "World Café and Open Space are used in health service redesign.", "edu": "Teachers use Liberating Structures in classrooms.", "com": "Citizens' assemblies and neighbourhood meetings use these formats."}, "key_ideas": [{"term": "open space", "defn": "A meeting where participants set the agenda and go where they can contribute most."}, {"term": "world café", "defn": "Small table conversations that rotate, so ideas cross-pollinate across a large group."}, {"term": "liberating structures", "defn": "33 simple patterns for meetings that include everyone."}, {"term": "harvest", "defn": "Capturing what a gathering produced so it can be used."}, {"term": "powerful question", "defn": "A question that invites real thinking and matters to the people in the room."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "Harrison Owen", "note": "Open Space", "years": "1935–2024", "people": ["Harrison Owen"]}, {"name": "Juanita Brown and David Isaacs", "note": "World Café", "years": "", "people": []}, {"name": "Art of Hosting", "note": "Toke Møller, Chris Corrigan", "years": "", "people": []}, {"name": "Liberating Structures", "note": "Lipmanowicz and McCandless", "years": "", "people": []}, {"name": "Warm Data Labs", "note": "", "years": "", "people": []}]}, {"name": "Bohm Dialogue", "cluster": "Living practices", "overview": "Groups suspending assumptions and attending to collective thought as it moves, with no agenda or decision to reach.", "road": "David Bohm (On Dialogue) → William Isaacs (Dialogue and the Art of Thinking Together) → Peter Senge's learning organization work", "mix": "Otto Scharmer, Nora Bateson, the hosting practices", "policy": "Dialogue held for its own sake in cross-agency and community settings, with no decision on the table. Over time it loosens the assumptions that would otherwise harden into policy.", "links": [], "kind": "Practice", "terms": ["bohm", "dialogue", "isaacs", "thinking together"], "caps": ["Observing & Listening", "Organizing & Facilitating"], "id": "bohm-dialogue", "orgs": [], "cases": ["steel-dialogue"], "gov": false, "reading": [{"kind": "Article", "title": "Bohm Dialogue (overview)", "u": "https://en.wikipedia.org/wiki/Bohm_Dialogue"}, {"kind": "Article", "title": "The art of dialogue (MIT, on William Isaacs's Dialogue Project)", "u": "https://betterworld.mit.edu/spectrum/issues/winter-2001/the-art-of-dialogue/"}, {"kind": "Book page", "title": "David Bohm: On Dialogue (Routledge)", "u": "https://www.routledge.com/On-Dialogue/Bohm-Nichol/p/book/9780415149112"}], "short": "bohm", "short_name": "Bohm Dialogue", "family": "rel", "sectors": ["ngo", "edu"], "scales": ["grp"], "work_kinds": ["att"], "goals": ["others"], "lens": "Complexity as collective thought: meaning flows through a group and shapes what it can see, so change begins by attending to how the group thinks.", "lens_status": "draft", "explainer": ["Bohm Dialogue is a way for a group to think together. People sit in a circle, often for a long time, with no agenda and no decision to make. The aim is to notice how thought moves in the group, and to suspend your assumptions: hold them up to look at, rather than defend them or drop them.", "The physicist David Bohm developed it late in life because he saw that collective thought is full of hidden assumptions that cause conflict. William Isaacs and the MIT Dialogue Project brought it into organizations, and Peter Senge made it part of the learning organization."], "practice": ["Gather 10 to 30 people for at least an hour with no agenda except to talk and listen.", "When you feel a strong reaction, say what it is rather than arguing from it.", "Practise suspension: notice an assumption, say it aloud, and look at it together.", "Meet regularly; the practice deepens over several sessions."], "sector_notes": {"biz": "Used to rebuild trust between union and management and in leadership teams.", "ngo": "Coalitions use it before strategy decisions to surface hidden assumptions.", "health": "Dialogue groups help clinicians and managers hear each other.", "edu": "Dialogue circles in schools and universities practise listening.", "com": "Community dialogues across divides, with no decision on the table."}, "key_ideas": [{"term": "dialogue", "defn": "A shared inquiry where meaning flows through a group, from the Greek for 'through the word'."}, {"term": "suspension", "defn": "Holding an assumption up to look at, without defending it or dropping it."}, {"term": "proprioception of thought", "defn": "Bohm's idea of noticing your own thinking as it happens, the way you sense your body."}, {"term": "thinking together", "defn": "Isaacs' phrase for groups that think as a whole rather than trade fixed positions."}, {"term": "container", "defn": "The shared space of trust that lets a group hold difficult conversation."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "David Bohm", "note": "On Dialogue", "years": "1917–1992", "people": ["David Bohm"]}, {"name": "William Isaacs", "note": "Dialogue and the Art of Thinking Together", "years": "", "people": []}, {"name": "Peter Senge's learning organization work", "note": "", "years": "b. 1947", "people": ["Peter Senge"]}]}, {"name": "T-groups and sensitivity training", "cluster": "Living practices", "overview": "Small unstructured groups learning from their own here-and-now interaction. The root of much of organization development.", "road": "Kurt Lewin → NTL Institute at Bethel, Maine (1947) → Chris Argyris and Edgar Schein (†2023) → Stanford's Interpersonal Dynamics course", "mix": "Group Relations, action research", "policy": "Leadership development that builds capacity to notice group dynamics, power, and feedback inside public teams.", "links": [{"t": "NTL Institute", "u": "https://www.ntl.org"}], "kind": "Practice", "terms": ["t-group", "sensitivity training", "ntl", "interpersonal dynamics", "group dynamics"], "caps": ["Observing & Listening", "Conflict Transformation"], "id": "t-groups-and-sensitivity-training", "orgs": ["ntl"], "cases": ["new-britain"], "gov": false, "reading": [], "short": "tgroup", "short_name": "T-groups", "family": "rel", "sectors": ["biz", "edu"], "scales": ["grp", "per"], "work_kinds": ["int"], "goals": ["others"], "lens": "Complexity in the here and now: a group's behaviour emerges from its members' interactions, and you learn it best by studying it as it happens.", "lens_status": "draft", "explainer": ["A T-group (training group) is a small group that meets with no agenda except to learn from what happens between its members, here and now. People give and receive feedback on how they come across and notice how the group forms, struggles and works.", "It began in 1946 when Kurt Lewin's team found that participants learned most when they joined staff discussions of their own behaviour. The National Training Laboratories followed in 1947. T-groups shaped organization development and live on in courses like Stanford's Interpersonal Dynamics, known as Touchy Feely."], "practice": ["Join a structured T-group lab with trained facilitators; do not improvise one on colleagues.", "Practise giving feedback about specific behaviour and its effect on you, not about character.", "In meetings, notice who speaks, who is interrupted and what is avoided.", "Ask for feedback on one habit and try a small change."], "sector_notes": {"biz": "The root of much management and leadership training.", "ngo": "Builds the self-awareness facilitators need.", "health": "Group-based learning for clinicians handling difficult relationships.", "edu": "Interpersonal Dynamics at Stanford and similar courses.", "com": "Helps organizers notice group dynamics and power."}, "key_ideas": [{"term": "here and now", "defn": "Paying attention to what is happening in the group right now, not to outside topics."}, {"term": "feedback", "defn": "Telling someone the effect their behaviour had on you, specifically and kindly."}, {"term": "group dynamics", "defn": "Kurt Lewin's term for the forces that shape how groups behave."}, {"term": "t-group", "defn": "A small training group that learns from its own interaction."}, {"term": "laboratory method", "defn": "Learning by experimenting with behaviour in a safe, temporary setting."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "Kurt Lewin", "note": "", "years": "1890–1947", "people": ["Kurt Lewin"]}, {"name": "NTL Institute at Bethel, Maine", "note": "1947", "years": "", "people": []}, {"name": "Chris Argyris and Edgar Schein", "note": "†2023", "years": "1923–2013", "people": ["Chris Argyris"]}, {"name": "Stanford's Interpersonal Dynamics course", "note": "", "years": "", "people": []}]}, {"name": "Group Relations", "cluster": "Living practices", "overview": "Temporary learning institutions where members study authority, role, and unconscious group dynamics as they happen.", "road": "Wilfred Bion (Experiences in Groups) → A.K. Rice and the Tavistock Institute's Leicester Conference (since 1957) → the A.K. Rice Institute in the US", "mix": "T-groups, systems psychodynamics", "policy": "Understanding authority and role in bureaucracies, and why systems unconsciously resist the change they commission.", "links": [{"t": "Tavistock Institute", "u": "https://www.tavinstitute.org"}], "kind": "Practice", "terms": ["tavistock", "bion", "group relations", "leicester conference", "psychodynamic"], "caps": ["Leading in Complexity", "Conflict Transformation"], "id": "group-relations", "orgs": ["tavistock"], "cases": ["leicester"], "gov": false, "reading": [], "short": "grel", "short_name": "Group Relations", "family": "rel", "sectors": ["biz", "gov", "ngo"], "scales": ["grp", "org"], "work_kinds": ["pol"], "goals": ["others"], "lens": "Complexity below the surface: groups carry unconscious patterns of anxiety and defence that shape what an organization can do.", "lens_status": "draft", "explainer": ["Group Relations studies how groups and organizations behave below the surface: the anxieties, fantasies and unspoken assumptions that shape how people take up authority and roles. It grew from Wilfred Bion's work with groups and the Tavistock Institute.", "Its main method is the conference, a temporary organization where members study authority and leadership as they happen. The Leicester Conference has run since 1957. The insight for practice: organizations often resist the very change they commission, for reasons nobody says out loud."], "practice": ["Attend a Group Relations conference before applying the ideas to others.", "Ask what anxiety a structure or procedure might be protecting people from.", "Notice when a group seems to be acting on an unspoken assumption, such as waiting for a leader to save it.", "Separate the person from the role: what is being asked of the role?"], "sector_notes": {"biz": "Executive education and consulting draw on systems psychodynamics.", "ngo": "Helps leaders understand projections from staff and funders.", "health": "Isabel Menzies Lyth's study of nurses showed how hospital routines defended against anxiety.", "edu": "Taught in leadership and organizational psychology programmes.", "com": "Helps groups see scapegoating and dependency."}, "key_ideas": [{"term": "basic assumption", "defn": "Bion's term for an unspoken belief that takes over a group, like dependence on a leader."}, {"term": "social defence", "defn": "A structure or routine that protects people from anxiety, often at the cost of the task."}, {"term": "role", "defn": "The part a person takes up in a system, separate from who they are."}, {"term": "authority", "defn": "The right to act, given by the system and taken up by the person."}, {"term": "primary task", "defn": "The task an organization must perform to survive."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "Wilfred Bion", "note": "Experiences in Groups", "years": "1897–1979", "people": ["Wilfred Bion"]}, {"name": "A.K. Rice and the Tavistock Institute's Leicester Conference", "note": "since 1957", "years": "", "people": []}, {"name": "the A.K. Rice Institute in the US", "note": "", "years": "", "people": []}]}, {"name": "Appreciative Inquiry", "cluster": "Living practices", "overview": "Change that starts from what already gives life to a system rather than from its problems.", "road": "David Cooperrider and Suresh Srivastva (Case Western, 1980s) → the 4-D cycle → Appreciative Inquiry Summits for whole-system change", "mix": "Positive deviance, World Café", "policy": "Whole-system summits with residents, staff, and partners that design from existing strengths.", "links": [], "kind": "Method", "terms": ["appreciative inquiry", "cooperrider", "strength-based", "asset-based"], "caps": ["Organizing & Facilitating", "Participatory Research & Design"], "id": "appreciative-inquiry", "orgs": ["ai-fowler"], "cases": ["imagine-chicago"], "gov": true, "reading": [], "short": "ai", "short_name": "Appreciative Inquiry", "family": "rel", "sectors": ["biz", "ngo", "gov"], "scales": ["org", "plc"], "work_kinds": ["cre"], "goals": ["others"], "lens": "Complexity as the stories a system tells about itself: the questions people ask shape what they notice and so what grows.", "lens_status": "draft", "explainer": ["Appreciative Inquiry starts change from what already works. Instead of diagnosing problems, people interview each other about high points and strengths, then build a picture of the future from them.", "David Cooperrider and Suresh Srivastva developed it in the 1980s at Case Western Reserve University. It usually follows a 4-D cycle: discover, dream, design and destiny (or deliver). Summits bring a whole system into one room, sometimes hundreds of people."], "practice": ["Pair people up to interview each other about a time the organization was at its best.", "Pull out the themes that made those moments possible.", "Write provocative propositions: bold statements of the future built from those themes.", "Ask who is missing from the room, and invite them for the next round."], "sector_notes": {"biz": "Used in strategy, culture change and mergers.", "ngo": "Imagine Chicago used it for city-wide conversation.", "health": "Hospitals use it to build on what goes well in patient care.", "edu": "Schools use appreciative interviews with pupils and parents.", "com": "Asset-based community development shares the same starting point."}, "key_ideas": [{"term": "appreciative inquiry", "defn": "Change that starts by studying what already works well."}, {"term": "4-d cycle", "defn": "Discover, dream, design and destiny: the steps of an Appreciative Inquiry."}, {"term": "ai summit", "defn": "A large meeting that brings a whole system together to design its future."}, {"term": "strength-based", "defn": "Starting from people's strengths rather than their deficits."}, {"term": "generative question", "defn": "A question that opens new possibilities rather than confirming what is known."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "David Cooperrider and Suresh Srivastva", "note": "Case Western, 1980s", "years": "b. 1954", "people": ["David Cooperrider"]}, {"name": "the 4-D cycle", "note": "", "years": "", "people": []}, {"name": "Appreciative Inquiry Summits for whole-system change", "note": "", "years": "", "people": []}]}, {"name": "Work That Reconnects", "cluster": "Living practices", "overview": "A group practice that moves through gratitude, honoring pain for the world, seeing with new eyes, and going forth.", "road": "Joanna Macy (†2025) → Molly Young Brown and facilitators worldwide → the Work That Reconnects Network", "mix": "Deep ecology, the relational pathway", "policy": "Sustaining public servants and communities working on climate and loss, where despair blocks action.", "links": [{"t": "Work That Reconnects Network", "u": "https://workthatreconnects.org"}], "kind": "Practice", "terms": ["work that reconnects", "joanna macy", "active hope", "deep ecology", "grief"], "caps": ["Somatic Eco-Regulation", "Spiritual & Moral Inquiry"], "id": "work-that-reconnects", "orgs": ["wtr"], "cases": ["after-chernobyl"], "gov": false, "reading": [], "short": "wtr", "short_name": "Work That Reconnects", "family": "rel", "sectors": ["com"], "scales": ["per", "grp"], "work_kinds": ["car", "sac"], "goals": ["grow"], "lens": "Complexity as interconnection felt in the body: our pain for the world shows we are part of a larger living system, and acknowledging it frees the energy to act.", "lens_status": "draft", "explainer": ["The Work That Reconnects is a set of group practices created by Joanna Macy and colleagues. It moves through a spiral of four stages: coming from gratitude, honouring our pain for the world, seeing with new eyes, and going forth.", "It began in the early 1980s as despair and empowerment work, for people overwhelmed by the threat of nuclear war. The core insight is that grief and fear for the world, shared openly, are signs of connection, and can become the energy for action. Macy died in 2025; the Work That Reconnects Network carries the practice on."], "practice": ["Begin a gathering with what people are grateful for.", "Make room for people to say what they fear or grieve about the world, without rushing to fix it.", "Try a deep-time exercise: imagine speaking with people living 200 years from now.", "Close with each person naming one step they will take."], "sector_notes": {"biz": "Used in some sustainability teams facing climate anxiety.", "ngo": "Sustains activists and climate workers against burnout.", "health": "Complements care for eco-anxiety and grief.", "edu": "Used in climate education to help students act from feeling, not despair.", "com": "Community groups host workshops after local disasters or losses."}, "key_ideas": [{"term": "the spiral", "defn": "The four stages of the Work That Reconnects: gratitude, honouring pain, seeing with new eyes, going forth."}, {"term": "active hope", "defn": "Hope as something you do, not something you have."}, {"term": "deep time", "defn": "Imagining across many generations to widen your sense of the present."}, {"term": "the great turning", "defn": "Macy's name for the shift from an industrial growth society to a life-sustaining one."}, {"term": "deep ecology", "defn": "The view that all living things have value in themselves, not only for human use."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "Joanna Macy", "note": "†2025", "years": "1929–2025", "people": ["Joanna Macy"]}, {"name": "Molly Young Brown and facilitators worldwide", "note": "", "years": "", "people": []}, {"name": "the Work That Reconnects Network", "note": "", "years": "", "people": []}]}, {"name": "Somatic and embodied practice", "cluster": "Living practices", "kind": "Practice", "overview": "Change that lives in the body: how bodies hold history, shape what we can perceive under stress, and settle enough to act together. Treats embodiment as a condition for working in complexity, not a wellness add-on.", "road": "Wilhelm Reich and body-oriented psychology → Richard Strozzi-Heckler (somatic leadership) → Staci K. Haines (generative somatics, <i>The Politics of Trauma<\/i>) → Resmaa Menakem (<i>My Grandmother's Hands<\/i>, cultural somatics)", "mix": "Arawana Hayashi (Social Presencing Theater), Joanna Macy, the crisis and transition cluster", "policy": "Trauma-informed services and workplaces, frontline staff regulation in high-stress roles, and noticing how bodies in a room shape what a public meeting can actually hear.", "links": [{"t": "Staci K. Haines: What is social justice somatics?", "u": "https://www.stacihaines.com/context"}, {"t": "generative somatics legacy archive", "u": "https://generativesomatics.org/explore-the-legacy/"}, {"t": "Resmaa Menakem", "u": "https://resmaa.com/about-resmaa-menakem/"}], "terms": ["somatic", "embodi", "body", "trauma", "menakem", "haines", "nervous system", "regulation"], "caps": ["Somatic Eco-Regulation", "Observing & Listening"], "id": "somatic-and-embodied-practice", "orgs": ["somatics"], "cases": ["trojan-warrior"], "gov": false, "reading": [], "short": "soma", "short_name": "Somatic practice", "family": "rel", "sectors": ["ngo", "com"], "scales": ["per"], "work_kinds": ["car", "int"], "goals": ["grow"], "lens": "Complexity lived in the body: history and stress shape what people can perceive, so the capacity to work with complexity depends on bodies that can settle.", "lens_status": "draft", "explainer": ["Somatic practice treats the body as where change happens. Under stress, bodies narrow what people can perceive and react from old patterns. Practices that build awareness of breath, posture and sensation help people settle and act with more choice.", "Social justice somatics, developed by Staci Haines and generative somatics, links personal trauma to social conditions. Resmaa Menakem's cultural somatics looks at how racialized trauma lives in bodies across generations. For complex work, a settled body is a condition for listening and acting together."], "practice": ["Before a hard conversation, take a minute to feel your feet and lengthen your breath.", "Notice where in your body you feel pressure in a meeting, and what you do next.", "Practise a centring exercise daily for a month, from Strozzi or generative somatics.", "In a group, pause and ask how people are, physically, before deciding."], "sector_notes": {"biz": "Somatic leadership coaching from the Strozzi Institute.", "ngo": "Movement organizations use generative somatics to sustain organizers.", "health": "Trauma-informed care pays attention to the body's responses to stress.", "edu": "Regulation practices in classrooms help students learn.", "com": "Community healing circles address collective trauma."}, "key_ideas": [{"term": "somatics", "defn": "Practices that work with the body as lived from the inside."}, {"term": "centring", "defn": "Bringing attention back to the body to act from choice rather than reaction."}, {"term": "regulation", "defn": "The nervous system settling after stress so a person can think and connect."}, {"term": "embodiment", "defn": "How experience and history live in the body and shape action."}, {"term": "cultural somatics", "defn": "Menakem's approach to how racialized trauma is carried in bodies across generations."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "Wilhelm Reich and body-oriented psychology", "note": "", "years": "1897–1957", "people": ["Wilhelm Reich"]}, {"name": "Richard Strozzi-Heckler", "note": "somatic leadership", "years": "b. 1944", "people": ["Richard Strozzi-Heckler"]}, {"name": "Staci K. Haines", "note": "generative somatics, The Politics of Trauma", "years": "", "people": []}, {"name": "Resmaa Menakem", "note": "My Grandmother's Hands, cultural somatics", "years": "", "people": []}]}, {"name": "Power analysis", "cluster": "Power, narrative, and conflict", "kind": "Method", "overview": "Making power visible: who decides, whose issues never reach the table, and which beliefs make an arrangement feel natural. The missing question in much systems work.", "road": "Steven Lukes (<i>Power: A Radical View<\/i>, three faces of power) → John Gaventa (Power Cube: spaces, places, and forms of power) → Lisa VeneKlasen and Valerie Miller (<i>A New Weave of Power<\/i>, JASS)", "mix": "Paulo Freire, Michel Foucault, Sasha Costanza-Chock, Group Relations", "policy": "Mapping who actually shapes a policy, which consultations are closed, invited, or claimed spaces, and where invisible power (norms, beliefs) keeps residents out.", "links": [{"t": "Powercube (IDS)", "u": "https://www.powercube.net/analyse-power/what-is-the-powercube/"}, {"t": "JASS: Just Power guide", "u": "https://pressbooks.pub/jass-power-guide/chapter/theme-5-engaging-and-resisting/"}], "terms": ["power", "powercube", "gaventa", "lukes", "veneklasen", "jass", "privilege", "positionality"], "caps": ["Positionality & Power Analysis", "Critical Consciousness", "Socioeconomic & Political Inquiry"], "id": "power-analysis", "orgs": ["ids-power", "jass"], "cases": ["porto-alegre"], "gov": false, "reading": [], "short": "power", "short_name": "Power analysis", "family": "chg", "sectors": ["com", "ngo", "fund"], "scales": ["plc", "pol"], "work_kinds": ["pol"], "goals": ["power"], "lens": "Complexity as layered power: visible decisions, hidden agenda-setting, and invisible norms, operating at different levels and in different spaces.", "lens_status": "draft", "explainer": ["Power analysis makes power visible. Steven Lukes described three faces of power: who wins in open decisions, who controls which issues ever reach the table, and how beliefs and norms make some arrangements seem natural.", "John Gaventa's Power Cube adds spaces (closed, invited, claimed), levels (local to global) and forms (visible, hidden, invisible). Lisa VeneKlasen and Valerie Miller turned these into practical tools for organizers. Much systems work skips power; this pathway puts it back."], "practice": ["Map a decision you care about: who decides, who sets the agenda, and which beliefs keep others out.", "Sort the spaces where your issue is discussed into closed, invited and claimed.", "Name your own position: where do you hold power, and where do you lack it?", "Ask who benefits from things staying as they are."], "sector_notes": {"biz": "Stakeholder mapping often misses hidden and invisible power.", "ngo": "Advocacy groups use the Power Cube to plan campaigns.", "health": "Shows who shapes health policy and whose voices are missing.", "edu": "Popular education uses power analysis with learners.", "com": "Organizers map power before choosing targets."}, "key_ideas": [{"term": "three faces of power", "defn": "Lukes' visible, hidden and invisible power: decisions, agenda-setting and shaping beliefs."}, {"term": "power cube", "defn": "Gaventa's tool for analysing the spaces, levels and forms of power."}, {"term": "claimed space", "defn": "A space that people create for themselves, outside official channels."}, {"term": "invisible power", "defn": "Power that works through norms and beliefs, so people do not see it as power."}, {"term": "positionality", "defn": "Where you stand in relation to power, and how that shapes what you see."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "Steven Lukes", "note": "Power: A Radical View, three faces of power", "years": "b. 1941", "people": ["Steven Lukes"]}, {"name": "John Gaventa", "note": "Power Cube: spaces, places, and forms of power", "years": "b. 1949", "people": ["John Gaventa"]}, {"name": "Lisa VeneKlasen and Valerie Miller", "note": "A New Weave of Power, JASS", "years": "", "people": []}]}, {"name": "Narrative change", "cluster": "Power, narrative, and conflict", "kind": "Method", "overview": "Shifting the deep stories a society uses to make sense of an issue, so different policies become thinkable. Works over years through many voices, not one campaign.", "road": "George Lakoff (framing) → FrameWorks Institute (strategic frame analysis) → Narrative Initiative (<i>Toward New Gravity<\/i>) → Marshall Ganz (public narrative: story of self, us, and now)", "mix": "adrienne maree brown, Bayo Akomolafe, Hilary Cottam", "policy": "Reframing public problems so structural causes become visible, and giving public servants and residents a way to tell a shared story of why change is needed now.", "links": [{"t": "FrameWorks the same deeper story."], "sector_notes": {"biz": "Brands shape cultural narratives, for better and worse.", "ngo": "FrameWorks research guides how charities talk about their issues.", "health": "Reframing ageing and mental health has shifted public understanding.", "edu": "Media literacy helps students see frames at work.", "com": "Community storytelling builds shared identity and agency."}, "key_ideas": [{"term": "framing", "defn": "How an issue is presented, which shapes how people reason about it."}, {"term": "deep story", "defn": "A widely held, often unspoken story people use to make sense of the world."}, {"term": "public narrative", "defn": "Ganz's method: story of self, story of us, story of now."}, {"term": "narrative power", "defn": "The ability to shape which stories are told and believed."}, {"term": "cultural model", "defn": "A shared mental shortcut people use to understand an issue."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "George Lakoff", "note": "framing", "years": "b. 1941", "people": ["George Lakoff"]}, {"name": "FrameWorks Institute", "note": "strategic frame analysis", "years": "", "people": []}, {"name": "Narrative Initiative", "note": "Toward New Gravity", "years": "", "people": []}, {"name": "Marshall Ganz", "note": "public narrative: story of self, us, and now", "years": "b. 1943", "people": ["Marshall Ganz"]}]}, {"name": "Conflict transformation", "cluster": "Power, narrative, and conflict", "kind": "Hybrid", "overview": "Treating conflict as information about a system and a doorway into changed relationships, rather than a problem to settle quickly. Holds justice and relationship together.", "road": "John Paul Lederach (<i>The Moral Imagination<\/i>) → Arnold and Amy Mindell (Deep Democracy, Worldwork) → Howard Zehr (restorative justice) → Marshall Rosenberg (Nonviolent Communication)", "mix": "Group Relations, T-groups, the somatic pathway, adrienne maree brown", "policy": "Restorative approaches in justice, schools, and housing; community mediation; and hosting charged public meetings so minority voices are not steamrolled by consensus.", "links": [{"t": "Kroc Institute: The Moral Imagination", "u": "https://kroc.nd.edu/research/books/the-moral-imagination-the-art-and-soul-of-building-peace-2004/"}, {"t": "Process Work Institute: Worldwork", "u": "https://www.processwork.org/tree/organizations-worldwork/"}, {"t": "Zehr Institute for Restorative Justice", "u": "https://zehr-institute.org/publications/the-little-book-of-restorative-justice/"}], "terms": ["conflict", "restorative", "lederach", "mindell", "deep democracy", "worldwork", "peacebuilding", "mediation", "nonviolent communication"], "caps": ["Conflict Transformation"], "id": "conflict-transformation", "orgs": ["kroc", "pwi", "zehr"], "cases": ["wajir", "trc", "steel-dialogue"], "gov": false, "reading": [], "short": "conflict", "short_name": "Conflict transformation", "family": "chg", "sectors": ["com", "ngo", "gov"], "scales": ["grp", "plc"], "work_kinds": ["pol"], "goals": ["others"], "lens": "Complexity as conflict carrying information: tensions show where a system's relationships and structures are out of step, and working through them can change the whole.", "lens_status": "draft", "explainer": ["Conflict transformation sees conflict as a sign that relationships and structures need to change, not just a problem to settle. John Paul Lederach argued that lasting peace needs moral imagination: seeing ourselves in a web of relationships that includes our enemies.", "The pathway brings together restorative justice (Howard Zehr), which focuses on repairing harm; Deep Democracy and Worldwork (Arnold and Amy Mindell), which bring minority voices into the room; and Nonviolent Communication (Marshall Rosenberg), which helps people hear the needs behind positions."], "practice": ["Before mediating, ask what relationships need to change, not only what deal is possible.", "In a restorative circle, ask: what happened, who was ting their plans.", "road": "Enrico Quarantelli (disaster sociology) → Karl Weick and Kathleen Sutcliffe (<i>Managing the Unexpected<\/i>, high reliability organizing) → Rebecca Solnit (<i>A Paradise Built in Hell<\/i>) → Daniel Aldrich (social capital in recovery) → Dean Spade (mutual aid)", "mix": "Cynefin's chaotic domain, the somatic pathway, Ostrom on self-organized commons", "policy": "Emergency management that works with spontaneous volunteers rather than against them, investing in neighborhood ties before disasters, and after-action learning without blame.", "links": [{"t": "Natural Hazards Center", "u": "https://hazards.colorado.edu"}, {"t": "Weick and Sutcliffe: high reliability principles", "u": "https://www.high-reliability.org/Weick-Sutcliffe"}, {"t": "Dean Spade on mutual aid (interview)", "u": "https://inthesetimes.com/article/mutual-aid-disaster-emergency-organizing-solidarity-dean-spade-interview"}], "terms": ["crisis", "disaster", "emergency", "mutual aid", "resilience", "high reliability", "recovery", "solnit", "aldrich"], "caps": ["Leading in Complexity", "Ecosystem Engagement"], "id": "crisis-disaster-and-high-reliability", "orgs": ["nhc"], "cases": ["sva"], "gov": true, "reading": [], "short": "crisis", "short_name": "Crisis and high reliability", "family": "chg", "sectors": ["gov", "com"], "scales": ["plc", "org"], "work_kinds": ["car"], "goals": ["uncertain"], "lens": "Complexity as the unexpected: high-reliability organizations stay alert to small failures and defer to whoever has the most relevant expertise in the moment.", "lens_status": "draft", "explainer": ["This pathway draws on research into what really happens when disaster strikes. Contrary to the image of panic, people usually help each other: Rebecca Solnit calls the communities that form a paradise built in hell. Daniel Aldrich showed that social ties predict recovery better than money.", "High reliability organizations, like aircraft carriers and nuclear plants, stay safe by staying alert to small failures and letting the person with the most relevant knowledge decide. Mutual aid, which Dean Spade describes, is how communities organize to meet needs directly."], "practice": ["Map who knows whom on your street before an emergency, and who might need help.", "Run a short after-action review after any incident: what happened, why, and what we will change.", "Practise deferring to expertise: in a crisis, who in the room knows most about this?", "Plan to work with spontaneous volunteers rather than turning them away."], "sector_notes": {"biz": "High reliability practices in aviation, energy and manufacturing.", "ngo": "Humanitarian groups increasingly back local mutual aid.", "health": "Hospitals adopt high reliability principles to reduce harm.", "edu": "Schools plan for emergencies with community ties in mind.", "com": "Mutual aid networks formed widely during the COVID-19 pandemic."}, "key_ideas": [{"term": "high reliability organization", "defn": "An organization that operates safely in high-risk conditions by staying alert to small failures."}, {"term": "mutual aid", "defn": "People meeting each other's needs directly, as equals, outside formal charity."}, {"term": "social capital", "defn": "The networks and trust that let people act together."}, {"term": "preoccupation with failure", "defn": "Treating small errors as signs of bigger risks."}, {"term": "deference to expertise", "defn": "Letting whoever knows most about the situation make the call."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "Enrico Quarantelli", "note": "disaster sociology", "years": "1924–2017", "people": ["Enrico Quarantelli"]}, {"name": "Karl Weick and Kathleen Sutcliffe", "note": "Managing the Unexpected, high reliability organizing", "years": "1936–2026", "people": ["Karl Weick"]}, {"name": "Rebecca Solnit", "note": "A Paradise Built in Hell", "years": "b. 1961", "people": ["Rebecca Solnit"]}, {"name": "Daniel Aldrich", "note": "social capital in recovery", "years": "b. 1974", "people": ["Daniel Aldrich"]}, {"name": "Dean Spade", "note": "mutual aid", "years": "b. 1977", "people": ["Dean Spade"]}]}, {"name": "Ritual, liminality, and transition", "cluster": "Crisis and transition", "kind": "Lineage", "overview": "Why ritual matters when systems change. Transitions pass through a threshold where old roles dissolve before new ones form, and communities have long held people through that in-between.", "road": "Arnold van Gennep (rites of passage) → Victor Turner (liminality, communitas) → William Bridges (endings, neutral zone, new beginnings) → Francis Weller (grief as communal work)", "mix": "Work That Reconnects, Bayo Akomolafe, Vanessa Machado de Oliveira (hospicing), Indigenous and land-based knowledge", "policy": "Marking endings when programs close or teams merge, grief and memorial work after a crisis, and treating reorganizations as transitions people move through, not org charts.", "links": [{"t": "William Bridges Associates: What is transition?", "u": "https://wmbridges.com/about/what-is-transition/"}, {"t": "Francis Weller: The Geography of Sorrow (The Sun)", "u": "https://www.thesunmagazine.org/articles/27277-the-geography-of-sorrow"}], "terms": ["ritual", "liminal", "threshold", "transition", "grief", "rites of passage", "communitas", "ceremony"], "caps": ["Spiritual & Moral Inquiry", "Somatic Eco-Regulation", "Cultural & Epistemic Inquiry"], "id": "ritual-liminality-and-transition", "orgs": ["emergence-network", "gtdf", "wtr", "bridges"], "cases": ["trc"], "gov": false, "reading": [], "short": "ritual", "short_name": "Ritual and liminality", "family": "chg", "sectors": ["com"], "scales": ["per", "grp"], "work_kinds": ["sac"], "goals": ["grow"], "lens": "Complexity as threshold: systems change passes through an unstable in-between time, and how people are held there shapes what emerges.", "lens_status": "draft", "explainer": ["Every real transition passes through an in-between time, when old roles have ended and new ones have not formed. Arnold van Gennep described rites of passage in three phases: separation, the threshold, and return. Victor Turner called the threshold liminality, and the bond people form there communitas.", "William Bridges applied this to organizations: change is the external event, but transition is the inner process of letting go, the neutral zone, and new beginnings. Francis Weller writes about grief as communal work. Systems change involves endings, and ritual helps people through them."], "practice": ["When something ends, mark it: name what is being lost and thank it.", "Tell people in a reorganization that a confusing middle period is normal.", "Hold a simple ritual for a team ending or a programme closing.", "Make space for grief in community after a loss."], "sector_notes": {"biz": "Bridges' transition model is used in change management.", "ngo": "Charities closing programmes use endings rituals with staff and partners.", "health": "Hospice and bereavement care hold people through the most personal transitions.", "edu": "Graduations and orientation are rites of passage that can be designed with care.", "com": "Grief rituals and memorials help communities after disasters."}, "key_ideas": [{"term": "liminality", "defn": "The in-between state of a transition, when old roles are gone and new ones have not formed."}, {"term": "rite of passage", "defn": "A ritual marking a transition, with separation, threshold and return."}, {"term": "communitas", "defn": "The strong bond among people going through a threshold together."}, {"term": "neutral zone", "defn": "Bridges' term for the confusing middle of a transition."}, {"term": "communal grief", "defn": "Grieving together as a community, as Weller describes."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "Arnold van Gennep", "note": "rites of passage", "years": "1873–1957", "people": ["Arnold van Gennep"]}, {"name": "Victor Turner", "note": "liminality, communitas", "years": "1920–1983", "people": ["Victor Turner"]}, {"name": "William Bridges", "note": "endings, neutral zone, new beginnings", "years": "1933–2013", "people": ["William Bridges"]}, {"name": "Francis Weller", "note": "grief as communal work", "years": "", "people": []}]}, {"name": "Public policy and government innovation", "cluster": "Policy, systemic design, and economics", "overview": "Moving public management from targets and linear delivery toward learning, relationships, experimentation, and adaptive stewardship.", "road": "Rittel and Webber (wicked problems) → Donella Meadows (leverage points) → Geoff Mulgan (collective intelligence, public imagination) → Toby Lowe (Human Learning Systems) → Hilary Cottam (Radical Help, the relational state)", "mix": "Mariana Mazzucato (mission-oriented policy), Christian Bason (design for policy), Indy Johar (Dark Matter Labs), Bill Sharpe (Three Horizons), UNDP's portfolio approach to systems change", "policy": "This is the home field for the policy lens. Read it alongside the Strategy, money, and accountability cluster, where budgets, contracts, and metrics decide whether any of this survives contact with a real institution.", "links": [{"t": "Human Learning Systems", "u": "https://www.humanlearning.systems"}, {"t": "Centre for Public Impact", "u": "https://www.centreforpublicimpact.org"}, {"t": "UCL Institute for Innovation and Public Purpose", "u": "https://www.ucl.ac.uk/bartlett/public-purpose"}, {"t": "Nesta", "u": "https://www.nesta.org.uk"}, {"t": "UNDP Accelerator Labs", "u": "https://www.undp.org/acceleratorlabs"}, {"t": "International Futures Forum", "u": "https://www.internationalfuturesforum.com"}, {"t": "H3Uni (Three Horizons)", "u": "https://www.h3uni.org"}, {"t": "OECD Observatory of Public Sector Innovation", "u": "https://oecd-opsi.org"}, {"t": "Dark Matter Labs", "u": "https://darkmatterlabs.org"}], "kind": "Field", "terms": ["policy", "government", "public sector", "public service", "civic", "human learning systems", "mazzucato", "municipal", "city"], "caps": ["Advocacy & Political Participation", "Socioeconomic & Political Inquiry", "Planning & Resource Mobilization"], "id": "public-policy-and-government-innovation", "orgs": ["hls", "cpi", "iipp", "nesta", "undp", "dml"], "cases": ["amsterdam-doughnut", "plymouth", "hls-cases", "legible", "kerala", "wales-future-generations"], "gov": true, "reading": [], "short": "pubpol", "short_name": "Public policy innovation", "family": "sci", "sectors": ["gov"], "scales": ["pol"], "work_kinds": ["pol"], "goals": ["policy"], "lens": "Complexity as wicked problems: issues with no final definition, no single owner, and no solution that stays solved, so policy has to keep learning.", "lens_status": "draft", "explainer": ["This pathway asks how government can work when the problems it faces are tangled and changing. Instead of setting targets and rolling out a fixed plan, it treats public services as systems that need to learn: trying things, listening to people, building relationships and adjusting.", "It brings together ideas like wicked problems, leverage points and mission-oriented policy, and practical movements like Human Learning Systems and the relational state. The common thread is that outcomes come from many actors working together, so the state's job is often to steward the system rather than control it."], "practice": ["Pick one service and ask who else shapes the outcome it is measured on.", "Replace one target with a learning question that staff and residents review together every few months.", "Spend a day with frontline staff before writing the next policy paper.", "Fund a small portfolio of approaches rather than one pilot, and agree how you will learn across them."], "sector_notes": {"biz": "Firms that deliver public contracts feel this most: payment by results versus alliance contracts.", "ngo": "Charities are often the frontline of public services and can push for learning-based commissioning.", "health": "Integrated care systems are attempts to run health and care as one learning system.", "edu": "Education policy that sets curriculum but trusts schools to adapt sits in this space.", "com": "Community groups are partners, not just consultees, in the relational state."}, "key_ideas": [{"term": "wicked problem", "defn": "A problem with no clear definition, no right answer, and no point where it is solved for good."}, {"term": "leverage point", "defn": "A place in a system where a small shift produces big change, from Donella Meadows."}, {"term": "human learning systems", "defn": "An approach to public management built on learning, relationships and system stewardship instead of targets."}, {"term": "mission-oriented policy", "defn": "Policy organized around a bold, concrete goal that many sectors work toward."}, {"term": "stewardship", "defn": "Looking after the health of a whole system rather than controlling its parts."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "Rittel and Webber", "note": "wicked problems", "years": "", "people": []}, {"name": "Donella Meadows", "note": "leverage points", "years": "1941–2001", "people": ["Donella Meadows"]}, {"name": "Geoff Mulgan", "note": "collective intelligence, public imagination", "years": "b. 1961", "people": ["Geoff Mulgan"]}, {"name": "Toby Lowe", "note": "Human Learning Systems", "years": "", "people": []}, {"name": "Hilary Cottam", "note": "Radical Help, the relational state", "years": "b. 1965", "people": ["Hilary Cottam"]}]}, {"name": "Systemic design and futures", "cluster": "Policy, systemic design, and economics", "overview": "Design practice scaled up to whole systems, paired with ways of using the future to act differently in the present.", "road": "Horst Rittel → Birger Sevaldson (gigamapping) → Hugh Dubberly and Paul Pangaro → Riel Miller (futures literacy) → Bill Sharpe (Three Horizons)", "mix": "Dan Hill (Dark Matter and Trojan Horses), Christian Bason, Dunne and Raby (critical design), Stuart Candy (experiential futures)", "policy": "Government policy labs, anticipatory governance, futures literacy for civil servants, and portfolio approaches instead of single-bet programs.", "links": [{"t": "Systemic Design Association", "u": "https://systemic-design.org"}, {"t": "UNESCO Futures Literacy", "u": "https://www.unesco.org/en/futures-literacy"}, {"t": "H3Uni (Three Horizons)", "u": "https://www.h3uni.org"}], "kind": "Method", "terms": ["systemic design", "gigamap", "futures", "foresight", "three horizons", "scenario", "speculative", "anticipat"], "caps": ["Futures Thinking & Foresight", "Regenerative Systems Design"], "id": "systemic-design-and-futures", "orgs": ["iff", "unesco-fl"], "cases": ["mont-fleur"], "gov": true, "reading": [], "short": "sysdes", "short_name": "Systemic design and futures", "family": "sci", "sectors": ["gov", "edu"], "scales": ["pol", "pla"], "work_kinds": ["cre"], "goals": ["uncertain"], "lens": "Complexity as a mess to be seen whole: map the system richly enough that people can find leverage, and use several futures to loosen today's assumptions.", "lens_status": "draft", "explainer": ["Systemic design takes the tools of design, like drawing, prototyping and working with users, and applies them to whole systems such as food, mobility or care. Designers make big visual maps, sometimes called gigamaps, so a group can see a whole system at once and find where to act.", "Futures work is its companion. Methods like Three Horizons, scenarios and futures literacy help people imagine several possible futures and use them to make better choices today, instead of betting on one forecast."], "practice": ["Make a big shared map of a system with the people in it, on one wall, before choosing an intervention.", "Run a Three Horizons conversation: what is fading, what is emerging, what is the bridge between them?", "Write two or three short scenarios and test your plan against each.", "Look for the pockets of the future already present today."], "sector_notes": {"biz": "Strategy teams use scenarios and horizon scanning to stress-test plans.", "ngo": "System maps help coalitions agree where each organization fits.", "health": "Gigamaps of patient pathways show where handoffs fail.", "edu": "Futures literacy is taught in schools and universities through UNESCO labs.", "com": "Community futures workshops let residents imagine their place in 30 years."}, "key_ideas": [{"term": "gigamapping", "defn": "Making very large, detailed visual maps of a system so a group can see it whole."}, {"term": "three horizons", "defn": "A framework that looks at the fading present, the emerging future, and the transition between them."}, {"term": "futures literacy", "defn": "The skill of using imagined futures to understand and act in the present."}, {"term": "scenario", "defn": "A coherent story of a possible future, used to test plans, not to predict."}, {"term": "foresight", "defn": "Systematic thinking about possible futures to inform decisions now."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "Horst Rittel", "note": "", "years": "1930–1990", "people": ["Horst Rittel"]}, {"name": "Birger Sevaldson", "note": "gigamapping", "years": "", "people": []}, {"name": "Hugh Dubberly and Paul Pangaro", "note": "", "years": "", "people": []}, {"name": "Riel Miller", "note": "futures literacy", "years": "", "people": []}, {"name": "Bill Sharpe", "note": "Three Horizons", "years": "", "people": []}]}, {"name": "Complexity economics and new economic models", "cluster": "Policy, systemic design, and economics", "overview": "The economy as an evolving, adaptive system of people and institutions rather than an equilibrium machine.", "road": "Herbert Simon (bounded rationality) → W. Brian Arthur (increasing returns) → Eric Beinhocker (The Origin of Wealth) → Kate Raworth (Doughnut Economics)", "mix": "J. Doyne Farmer (Making Sense of Chaos), Elinor Ostrom, Mariana Mazzucato", "policy": "City Doughnut portraits (Amsterdam adopted the model in 2020), mission-oriented innovation, and regulation that expects adaptation.", "links": [{"t": "Doughnut Economics Action Lab", "u": "https://doughnuteconomics.org"}, {"t": "INET Oxford", "u": "https://www.inet.ox.ac.uk"}], "kind": "Lineage", "terms": ["doughnut", "raworth", "economics", "economy", "beinhocker", "brian arthur", "wellbeing economy", "post-growth"], "caps": ["Socioeconomic & Political Inquiry", "Networking & Engaging Capital"], "id": "complexity-economics-and-new-economic-models", "orgs": ["ostrom", "iipp", "deal"], "cases": ["amsterdam-doughnut"], "gov": false, "reading": [], "short": "econ", "short_name": "Complexity economics", "family": "sci", "sectors": ["edu", "gov"], "scales": ["pol", "pla"], "work_kinds": ["adm"], "goals": ["connect"], "lens": "Complexity as an economy that is always forming: agents adapt to patterns they create together, so markets rarely settle into equilibrium.", "lens_status": "draft", "explainer": ["Mainstream economics often pictures the economy as a machine that settles into balance. Complexity economics sees it instead as an ecosystem that never stops changing: people and firms learn, copy each other and invent, so the economy keeps creating new patterns, booms and crashes.", "New economic models build on this. Kate Raworth's Doughnut asks how to meet everyone's needs without overshooting the planet's limits. Others look at wellbeing economies and post-growth. Together they argue that the goal of an economy is a choice, and that it should be set openly."], "practice": ["Draw your city or organization's Doughnut: which social needs fall short, which planetary limits are overshot?", "Ask where increasing returns lock in a winner, and whether that is healthy.", "Swap one growth metric for a wellbeing indicator and see what changes in the conversation.", "Look at who benefits from a policy over time, not only at launch."], "sector_notes": {"biz": "Platform markets show increasing returns: the leader gets stronger simply by being ahead.", "ngo": "Wellbeing economy alliances bring charities into economic policy.", "health": "Health is a big part of any wellbeing economy and of the social foundation in the Doughnut.", "edu": "Rethinking Economics and CORE teach economics with these ideas built in.", "com": "Local Doughnut groups and community wealth building apply it at neighbourhood scale."}, "key_ideas": [{"term": "increasing returns", "defn": "When being ahead makes it easier to get further ahead, so small early leads lock in."}, {"term": "doughnut economics", "defn": "Kate Raworth's model: meet everyone's needs without overshooting the planet's limits."}, {"term": "bounded rationality", "defn": "Herbert Simon's idea that people decide with limited time, information and attention."}, {"term": "equilibrium", "defn": "A state of balance. Complexity economics argues real economies rarely settle into one."}, {"term": "wellbeing economy", "defn": "An economy designed to deliver human and ecological wellbeing rather than growth for its own sake."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "Herbert Simon", "note": "bounded rationality", "years": "1916–2001", "people": ["Herbert Simon"]}, {"name": "W. Brian Arthur", "note": "increasing returns", "years": "b. 1945", "people": ["W. Brian Arthur"]}, {"name": "Eric Beinhocker", "note": "The Origin of Wealth", "years": "", "people": []}, {"name": "Kate Raworth", "note": "Doughnut Economics", "years": "b. 1970", "people": ["Kate Raworth"]}]}, {"name": "Strategy under uncertainty", "cluster": "Strategy, money, and accountability", "kind": "Method", "overview": "Strategy that assumes the future cannot be predicted: rehearse several futures, map how value chains evolve, and build options that benefit from surprise.", "road": "Pierre Wack (Shell scenarios) → Adam Kahane (transformative scenario planning) → Simon Wardley (Wardley Mapping) → Nassim Nicholas Taleb (antifragility)", "mix": "Three Horizons, Cynefin, future
