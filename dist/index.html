<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pathways into Complexity</title>
<meta name="description" content="Ideas and practices for complex work, from many fields, in plain English: a wiki, a learning path, maps, people, and cases.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Field Atlas: paper, ink, four hue families at oklch(0.52 0.09 H). */
:root{
  color-scheme: light;
  --paper:#f4f1ea; --paper2:#ece8de; --card:#fbfaf6; --ink:#1c211f; --muted:#5b625e; --line:#d9d4c7; --line2:#e6e1d5;
  --link:#2f5873; --warn:#9a4a1c; --gold:#8a6a14;
  --night:#151918; --night2:#1d2321; --night-line:#2e3633; --night-ink:#efece4; --night-muted:#9aa29c;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sci:oklch(0.52 0.09 245); --rel:oklch(0.52 0.09 150); --chg:oklch(0.52 0.09 40); --prc:oklch(0.52 0.09 85);
  --sci-t:oklch(0.92 0.035 245); --rel-t:oklch(0.92 0.035 150); --chg-t:oklch(0.92 0.035 40); --prc-t:oklch(0.92 0.035 85);
  --sci-n:oklch(0.76 0.1 245); --rel-n:oklch(0.76 0.1 150); --chg-n:oklch(0.76 0.1 40); --prc-n:oklch(0.78 0.1 85);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#171b1a; --paper2:#1f2422; --card:#202624; --ink:#ece8de; --muted:#a3aaa5; --line:#38403c; --line2:#2c3330;
    --link:#9cc3df; --warn:#e7a07a; --gold:#e0c070;
    --sci:oklch(0.74 0.1 245); --rel:oklch(0.74 0.1 150); --chg:oklch(0.74 0.1 40); --prc:oklch(0.78 0.1 85);
    --sci-t:oklch(0.3 0.04 245); --rel-t:oklch(0.3 0.04 150); --chg-t:oklch(0.3 0.04 40); --prc-t:oklch(0.32 0.04 85);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#171b1a; --paper2:#1f2422; --card:#202624; --ink:#ece8de; --muted:#a3aaa5; --line:#38403c; --line2:#2c3330;
  --link:#9cc3df; --warn:#e7a07a; --gold:#e0c070;
  --sci:oklch(0.74 0.1 245); --rel:oklch(0.74 0.1 150); --chg:oklch(0.74 0.1 40); --prc:oklch(0.78 0.1 85);
  --sci-t:oklch(0.3 0.04 245); --rel-t:oklch(0.3 0.04 150); --chg-t:oklch(0.3 0.04 40); --prc-t:oklch(0.32 0.04 85);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--sans);-webkit-text-size-adjust:100%}
body.dark{background:var(--night);color:var(--night-ink)}
a{color:var(--link)}
a:hover{color:var(--ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.sr{position:absolute;left:-9999px}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
.serif{font-family:var(--serif)}
.mono{font-family:var(--mono)}
.label{font:500 10.5px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3,h4{font-family:var(--serif);font-weight:400;margin:0;text-wrap:balance}
p{margin:0}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;padding:18px 0;flex-wrap:wrap}
.brand{font:400 19px/1 var(--serif);color:var(--ink);text-decoration:none}
body.dark .brand{color:var(--night-ink)}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav a{font-size:14px;color:var(--ink);text-decoration:none;padding:7px 12px;border-radius:999px}
.nav a[aria-current="page"]{background:var(--ink);color:var(--paper)}
.nav a:hover:not([aria-current="page"]){background:var(--paper2)}

/* shared bits */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;text-decoration:none;cursor:pointer}
.pill:hover{border-color:var(--ink);color:var(--ink)}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.badge{font:500 11px/1 var(--mono);border:1px solid var(--line);border-radius:999px;padding:5px 9px;color:var(--muted);display:inline-block}
.badge.dash{border-style:dashed}
.draft{font:500 11.5px/1.4 var(--mono);color:var(--warn)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 14px var(--sans);border-radius:999px;padding:11px 20px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);text-decoration:none;cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:hover{opacity:.9;color:var(--paper)}
.btn.ghost:hover{color:var(--ink);background:var(--paper2)}
.ext::after{content:" \2197"}
.empty{border:1px dashed var(--line);border-radius:12px;padding:14px 16px;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;color:var(--ink);text-decoration:none;min-width:0}
a.tile:hover{border-color:var(--ink);color:var(--ink)}
.tile .t{font-weight:700;line-height:1.3}
.tile p{font-size:13.5px;color:var(--muted)}
.tile .meta{font:12px var(--mono);color:var(--muted)}
.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
section.sec{margin-top:44px}
section.sec>h2{font-size:28px;margin-bottom:14px}
.sub{color:var(--muted);font-size:14px;margin:-6px 0 14px}
footer.foot{margin-top:56px;background:var(--paper2);border-top:1px solid var(--line)}
footer.foot .wrap{padding-top:22px;padding-bottom:28px;display:grid;gap:12px;font-size:13px;color:var(--muted)}
footer.foot .row{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline}
.status{display:inline-flex;align-items:center;gap:8px;font:500 12px/1.3 var(--mono);color:var(--muted)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status[data-state="live"] i{background:oklch(0.6 0.12 150)}
.status[data-state="cached"] i{background:oklch(0.7 0.12 85)}
.status[data-state="error"] i{background:oklch(0.6 0.14 30)}
.status button{background:none;border:0;padding:0;color:var(--link);text-decoration:underline;cursor:pointer;font:inherit}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.85fr);gap:48px;padding:36px 0 8px;align-items:start}
.hero h1{font-size:clamp(38px,5.2vw,58px);line-height:1.04;letter-spacing:-.015em;margin:10px 0 18px}
.hero .lede{font-size:16.5px;line-height:1.6;max-width:44ch}
.search{display:flex;align-items:center;border:1.5px solid var(--ink);border-radius:999px;background:var(--card);padding:4px 4px 4px 18px;margin-top:24px;max-width:500px;position:relative}
.search input{flex:1;min-width:0;border:0;background:transparent;font:15px var(--sans);color:var(--ink);padding:9px 0;outline:none}
.search button{border:0;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:600;padding:9px 16px;cursor:pointer}
.results[hidden]{display:none}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.12);padding:6px;display:grid}
.results a{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink)}
.results a:hover,.results a:focus{background:var(--paper2)}
.results .k{font:11px var(--mono);color:var(--muted);margin-left:auto;flex:none}
.popular{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px;font-size:12.5px;color:var(--muted)}
.popular .pill{font-size:12.5px;padding:4px 10px}
.photo{aspect-ratio:1/1;border:1.5px dashed var(--line);border-radius:16px;background:var(--paper2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-size:13px;text-align:center;padding:24px}
.photo svg{width:22px;height:22px}
.doors{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.door{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:16px 16px 22px;min-height:150px;text-decoration:none;color:var(--ink)}
.door .label{color:var(--muted)}
.door b{font:400 19px/1.2 var(--serif)}
.door span:last-child{font-size:13px;color:var(--muted)}
.door.blue{background:oklch(0.42 0.08 245);border-color:oklch(0.42 0.08 245);color:#f4f1ea}
.door.black{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.door.blue .label,.door.black .label,.door.blue span:last-child,.door.black span:last-child{color:inherit;opacity:.78}
.door.dashed{border-style:dashed;background:transparent}
.door:hover{transform:translateY(-1px);color:inherit}
.door.blue:hover{color:#f4f1ea}
.door.black:hover{color:var(--paper)}
.browse-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.browse-head h2{font-size:28px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card)}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.goals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.goal{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:16px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;gap:16px;text-decoration:none;color:var(--ink)}
.goal b{font:400 18px/1.25 var(--serif)}
.goal span{font-size:12.5px;color:var(--muted)}
.goal:hover{border-color:var(--ink);color:var(--ink)}
.lenses{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px 18px}
.lens{border-left:1.5px solid var(--ink);padding:2px 0 2px 12px}
.lens i{font:italic 15px/1.45 var(--serif);display:block;margin-top:4px}
.mission{background:var(--ink);color:var(--paper);margin-top:56px}
.mission .wrap{display:grid;grid-template-columns:180px 1fr;gap:24px;padding-top:56px;padding-bottom:60px;align-items:baseline}
.mission .label{color:var(--paper);opacity:.6}
.mission p{font:400 clamp(24px,3vw,32px)/1.25 var(--serif);max-width:28ch}
.ctas{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cta{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:26px 28px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--ink);min-height:200px}
.cta h3{font-size:32px}
.cta p{color:var(--muted);max-width:40ch}
.cta b{margin-top:auto;font-size:14px}
.cta.blue{background:oklch(0.42 0.08 245);border-color:oklch(0.42 0.08 245);color:#f4f1ea}
.cta.blue p,.cta.blue .label{color:#f4f1ea;opacity:.82}
.cta:hover{color:inherit;border-color:var(--ink)}
.featured{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:40px;border-top:1px solid var(--line);padding-top:28px}
.featured h3{font-size:30px;margin:8px 0 10px}
.also a{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.also a:hover{color:var(--link)}

/* wiki */
.wiki{display:grid;grid-template-columns:150px minmax(0,1fr) 300px;gap:0;border-top:1px solid var(--line)}
.wiki>aside.toc{border-right:1px solid var(--line);padding:24px 18px 24px 0}
.toc a{display:block;font-size:13.5px;color:var(--ink);text-decoration:none;padding:6px 0;border-bottom:1px solid var(--line2)}
.toc a:hover{color:var(--link)}
.wiki>article{padding:24px 36px 40px;min-width:0}
.wiki>aside.side{border-left:1px solid var(--line);padding:20px 0 20px 18px;min-width:0}
.art-title{font-size:clamp(32px,4vw,44px);line-height:1.06;margin:8px 0 12px;max-width:16ch}
.art-ov{font:italic 20px/1.45 var(--serif);max-width:34ch;margin:14px 0 6px}
.art h2{font-size:26px;margin:40px 0 12px;scroll-margin-top:16px}
.art .body p{font-size:15.5px;line-height:1.65;max-width:62ch;margin-bottom:12px}
.terms{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.def{margin-top:10px;border-left:2px solid var(--ink);padding:6px 12px;font-size:14px;max-width:60ch}
.lensbox{margin-top:28px;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:18px 20px}
.lensbox .h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.lensbox .h h3{font-size:20px}
.lensbox p{font:italic 18px/1.5 var(--serif);margin-top:10px;max-width:56ch}
.road{list-style:none;margin:0;padding:0;position:relative}
.road::before{content:"";position:absolute;left:6px;top:10px;bottom:10px;border-left:1.5px solid var(--ink)}
.road>li{position:relative;padding:5px 0 5px 26px}
.road>li::before{content:"";position:absolute;left:0;top:13px;width:11px;height:11px;border-radius:50%;border:1.5px solid var(--ink);background:var(--paper)}
.road button.who,.road a.who{font:400 18px/1.3 var(--serif);background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px;cursor:pointer}
.road .n{font:11.5px var(--mono);color:var(--muted);margin-left:8px}
.road .y{font:11.5px var(--mono);color:var(--gold);margin-left:8px}
.road .pop{margin:8px 0 6px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:10px 12px;font-size:13.5px}
.gov{border-left:2px solid var(--ink);padding:2px 0 2px 12px;margin:6px 0 14px;max-width:62ch}
.gov .label{color:var(--ink);font-weight:600}
.sectors{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px}
.sectors .badge{border-style:dashed}
.casebox{background:var(--paper2);border-radius:12px;padding:14px 16px;margin-top:10px;display:block;color:var(--ink);text-decoration:none}
.casebox:hover{color:var(--ink);outline:1px solid var(--line)}
.casebox h4{font-size:18px;margin:4px 0}
.casebox p{font-size:14px}
.placeholder{border:1px dashed var(--line);border-radius:10px;padding:10px 14px;font:12px var(--mono);color:var(--muted);margin-top:10px}
.sim{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.diff{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.diff .tile{border-style:dashed}
.why{font:11.5px var(--mono);color:var(--muted)}
.localmap{position:relative;aspect-ratio:36/32;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:14px 14px}
.localmap svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;display:flex;align-items:center;gap:4px;text-align:center;font-size:11px;line-height:1.2;color:var(--ink);text-decoration:none;width:110px;cursor:pointer;background:none;border:0;padding:0}
.node i{display:block;border-radius:50%;flex:none;border:1.5px solid;background:var(--card)}
.node span{display:block}
.node:hover span{text-decoration:underline}
.key{margin-top:14px;padding:14px;font-size:12.5px;display:grid;gap:7px}
.key div{display:flex;gap:8px;align-items:center}
.key .ln{width:18px;border-top:1.5px solid var(--ink)}
.key .ln.d{border-top-style:dashed;border-color:var(--muted)}
.idx-filters{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 22px}
.idx{columns:3 280px;column-gap:28px}
.idx .cl{break-inside:avoid;margin-bottom:22px}
.idx .cl h3{font:500 11px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.idx .cl a{display:block;color:var(--ink);text-decoration:none;padding:5px 0;border-bottom:1px solid var(--line2);font-size:14.5px}
.idx .cl a:hover{color:var(--link)}
.idx .cl a small{font:11px var(--mono);color:var(--muted);margin-left:6px}

/* path (learning tree) */
.steps{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 6px}
.crumbs a{font-size:13px;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:var(--card)}
.crumbs a::after{content:" \00d7";color:var(--muted)}
.qh{font-size:clamp(32px,4.4vw,48px);line-height:1.08;margin:18px 0 28px}
.starts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.start{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:26px;min-height:180px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;color:var(--ink);text-decoration:none}
.start b{font:400 26px/1.15 var(--serif)}
.start span{color:var(--muted);font-size:14px}
.start:hover{border-color:var(--ink);color:var(--ink)}
.branchwrap{display:grid;grid-template-columns:auto 1fr;gap:0;align-items:center}
.root{background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 14px;margin-right:24px}
.root .label{color:var(--paper);opacity:.65}
.root b{display:block;font-size:16px}
.branches{border-left:1.5px solid var(--ink);display:grid;gap:10px;padding:6px 0}
.branch{position:relative;margin-left:24px;max-width:420px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 16px;text-decoration:none;color:var(--ink);display:block}
.branch::before{content:"";position:absolute;left:-25px;top:50%;width:24px;border-top:1.5px solid var(--ink)}
.branch:hover{border-color:var(--ink);color:var(--ink)}
.branch b{font-size:16.5px;display:flex;align-items:center;gap:8px}
.branch .m{font:12px/1.5 var(--mono);color:var(--muted);margin:2px 0 4px}
.branch i{font:italic 14.5px/1.45 var(--serif);display:block}
.branch.add{border-style:dashed;background:transparent}
.addbox{margin:6px 0 0 24px;max-width:520px;border:1px dashed var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
.addbox input{font:15px var(--sans);border:1px solid var(--line);border-radius:999px;padding:9px 14px;background:var(--card);color:var(--ink);width:100%}
.where{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.where .card{padding:18px 20px}
.where h3{font-size:22px;margin-bottom:8px}
.where li{margin:6px 0}
.where ul{padding-left:18px;margin:0}

/* people */
.people{display:grid;grid-template-columns:200px minmax(0,1fr) 260px;border-top:1px solid var(--line);min-height:70vh}
.people>nav{background:var(--paper2);padding:20px 12px;border-right:1px solid var(--line)}
.people>nav a{display:block;text-decoration:none;color:var(--ink);padding:9px 10px;border-radius:10px;margin-bottom:4px}
.people>nav a b{font:600 14.5px var(--serif);display:block}
.people>nav a small{font:11px var(--mono);color:var(--muted)}
.people>nav a[aria-current="true"]{background:var(--ink);color:var(--paper)}
.people>nav a[aria-current="true"] small{color:var(--paper);opacity:.7}
.people>article{padding:28px 40px 48px;min-width:0}
.people>aside{border-left:1px solid var(--line);padding:24px 20px;background:var(--card)}
.pname{font-size:clamp(36px,4.6vw,50px);line-height:1.05;margin:6px 0 10px}
.known{font-size:17px;max-width:52ch}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:68px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.tl b{font:600 13px var(--mono)}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}

/* map hub (always night) */

.hub a{color:oklch(0.82 0.08 85)}
.hub a.plain{color:var(--night-ink);text-decoration:none}
.hub .btn{background:var(--night-ink);color:var(--night);border-color:var(--night-ink)}
.hub .btn.ghost{background:transparent;color:var(--night-ink);border-color:var(--night-line)}
.scrollx{overflow-x:auto;max-width:100%}
.stage{position:relative;width:100%;aspect-ratio:1000/620;min-width:0}

.stage .lab{position:absolute;transform:translate(-50%,-50%);font:500 10.5px/1.25 var(--mono);letter-spacing:.06em;text-transform:uppercase;text-align:center;white-space:nowrap;pointer-events:none}
.stage .slab{position:absolute;font:12px/1.2 var(--serif);color:var(--night-ink);white-space:nowrap;pointer-events:none;text-shadow:0 0 4px var(--night)}

.stage .gal{position:absolute;transform:translate(-50%,-50%);border-radius:50%;background:transparent;border:0;cursor:pointer}
.stage .gal:hover{background:radial-gradient(rgba(255,255,255,.04),transparent 70%)}
.mapfoot{font:12px/1.6 var(--mono);color:var(--night-muted);margin-top:10px;display:flex;flex-wrap:wrap;gap:4px 18px}
.panel h3{font-size:24px;line-height:1.15;margin:4px 0 8px;color:var(--night-ink)}

.panel .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.list a{display:block;padding:9px 0;border-bottom:1px solid var(--night-line);color:var(--night-ink);text-decoration:none;font-size:14.5px}

.tree{position:relative;overflow-x:auto;padding-bottom:6px}

.stop b{font:600 13.5px/1.2 var(--serif)}
.stop .nt{font:11px/1.2 var(--serif);color:var(--night-muted)}

.stats span{font:11px var(--mono);color:var(--night-muted)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.hub .pill{background:transparent;color:var(--night-ink);border-color:var(--night-line)}

.time{overflow:auto;max-height:600px;position:relative;border-top:1px solid var(--night-line)}

.time .bar{position:absolute;top:3px;height:20px;border-radius:999px;display:flex;align-items:center;gap:6px;padding:0 10px;white-space:nowrap;font:600 12px var(--serif);color:var(--night);text-decoration:none;min-width:max-content}
.time .bar small{font:400 11px var(--mono);opacity:.75}
.time .bar.inst{background:transparent!important;border:1px solid;color:var(--night-ink)}
.time .bar.living{border-top-right-radius:0;border-bottom-right-radius:0}
.time .grid-l{position:absolute;top:0;bottom:0;border-left:1px solid var(--night-line)}
.addstops{display:flex;flex-wrap:wrap;gap:8px}

.addstops small{display:block;font:11px var(--mono);color:var(--night-muted)}

}

  .mission .wrap{grid-template-columns:1fr;gap:10px}

  .people>aside{grid-column:auto}
  .q .pair{grid-template-columns:1fr}

  .hubgrid{grid-template-columns:1fr}

  .scrollx .stage{min-width:780px}
  .branchwrap{grid-template-columns:1fr}

  .levels th{width:auto}
  .media li{grid-template-columns:1fr;gap:2px}
  .libbar{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){ .door,.goal,.tile,.start,.branch{transition:border-color .15s,transform .15s} }

<script>
const DATA = {"about": {"title": "Pathways into Complexity", "lede": "Lineages, practices, and methods for working in complex systems, with cases, organizations, and live resources from the Systems Change Learning Guide.", "worker": "https://capacities.jayajohnyramchandani.workers.dev/"}, "clusters": [{"name": "Foundations and science", "token": "found", "light": "#3b5b7a", "dark": "#86a7c7"}, {"name": "Relational, Indigenous, and meaning", "token": "rel", "light": "#8a4f7d", "dark": "#c894bb"}, {"name": "Living systems", "token": "live", "light": "#4f7a3a", "dark": "#96c07f"}, {"name": "Organizing and sensemaking", "token": "org", "light": "#2f6f62", "dark": "#6fb7a6"}, {"name": "Movements and hosting", "token": "mov", "light": "#b0613a", "dark": "#e19a72"}, {"name": "Living practices", "token": "prac", "light": "#7a4a2a", "dark": "#d09a74"}, {"name": "Power, narrative, and conflict", "token": "pow", "light": "#6a3f8f", "dark": "#b596d8"}, {"name": "Crisis and transition", "token": "cri", "light": "#9a3b3b", "dark": "#e28b85"}, {"name": "Policy, systemic design, and economics", "token": "pol", "light": "#a8741a", "dark": "#e0b25a"}, {"name": "Strategy, money, and accountability", "token": "str", "light": "#2e5d73", "dark": "#7fb3cc"}, {"name": "Design and practice", "token": "des", "light": "#5a5f8f", "dark": "#a5a9d8"}, {"name": "Learning and pedagogy", "token": "ped", "light": "#6b6a1f", "dark": "#c9c66a"}], "kinds": [{"name": "Lineage", "desc": "A body of ideas that changes how you understand systems. It informs action without prescribing it."}, {"name": "Practice", "desc": "A way of being together that shifts perception and relationship. It works indirectly and breaks when aimed at an output."}, {"name": "Method", "desc": "A structured process with steps and artifacts, aimed at a designed outcome. It can be commissioned and reported on."}, {"name": "Structure", "desc": "An arrangement of authority, decision-making, and feedback. It changes who decides and how information flows."}, {"name": "Field", "desc": "A domain where lineages, practices, methods, and structures meet a context. It is where you work, not how."}, {"name": "Tradition", "desc": "A whole way of knowing held by peoples and places. It enters through relationship, consent, and shared power."}, {"name": "Hybrid", "desc": "A pathway that is several kinds at once. Watch for the method part being taken and the rest dropped."}], "orientations": [{"name": "Consent before command", "line": "Move when no one has a reasoned objection, rather than waiting for everyone to agree or for someone to order it.", "source": "Sociocracy (Kees Boeke, Gerard Endenburg)", "ask": "Who has not yet been asked whether they can live with this?"}, {"name": "Match the variety", "line": "A response has to be as varied as the situation it meets. Do not simplify people to fit the system.", "source": "W. Ross Ashby, requisite variety", "ask": "Where are we forcing many different lives through one channel?"}, {"name": "Widen the choices", "line": "Act so that the people affected have more options afterward, not fewer.", "source": "Heinz von Foerster, the ethical imperative", "ask": "Does this close doors for anyone who was not in the room?"}, {"name": "Take only what is given", "line": "Relationship before extraction. Ask, take what is offered, share it, and give something back.", "source": "Robin Wall Kimmerer, the Honorable Harvest", "ask": "What are we taking from this community, and what are we returning?"}, {"name": "Many contexts, no master frame", "line": "Every issue lives in family, work, body, place, and history at once. No single discipline or worldview holds all of it.", "source": "Nora Bateson (transcontextuality), Arturo Escobar (the pluriverse)", "ask": "Which context are we ignoring because it does not fit our frame?"}, {"name": "Learning over proving", "line": "Treat results as information for the next move, and hold people accountable for learning, not for hitting numbers they do not control.", "source": "Human Learning Systems, developmental evaluation, Deming", "ask": "What did we learn that changes what we do next?"}, {"name": "Power in plain sight", "line": "Name who decides, whose issues never reach the table, and which beliefs make the arrangement feel natural.", "source": "Steven Lukes, John Gaventa, Paulo Freire", "ask": "Which form of power is doing the work here without being named?"}], "levels": [{"name": "Body and person", "who": "Resmaa Menakem, Staci K. Haines, Robert Kegan, Jennifer Garvey Berger. Practices: somatic work, immunity to change, reflective practice"}, {"name": "Knowing and perception", "who": "Iain McGilchrist, Evan Thompson, Alicia Juarrero, Terrence Deacon, Isabelle Stengers, Donna Haraway, Karen Barad, Jan Meyer and Ray Land"}, {"name": "Group and dialogue", "who": "Arawana Hayashi, William Isaacs, Chris Corrigan. Practices: Bohm Dialogue, T-groups, Group Relations, Warm Data Labs, Art of Hosting, Liberating Structures, Work That Reconnects, action learning"}, {"name": "Organization", "who": "Dave Snowden, Glenda Eoyang, Otto Scharmer, Peter Senge, Amy Edmondson, David Cooperrider, Bjarte Bogsnes, Matthew Skelton and Manuel Pais. Practices: sociocracy, Appreciative Inquiry, Adaptive Action, Beyond Budgeting"}, {"name": "Community and place", "who": "Nora Bateson, Bayo Akomolafe, adrienne maree brown, Robin Wall Kimmerer, Tyson Yunkaporta, Rebecca Solnit, Daniel Aldrich, Dean Spade. Practices: positive deviance, participatory action research, popular education, mutual aid"}, {"name": "Society and policy", "who": "Toby Lowe, Geoff Mulgan, Hilary Cottam, Mariana Mazzucato, Jennifer Pahlka, Charles Sabel, Indy Johar, Lou Downe, Michael Quinn Patton, John Gaventa. Practices: Human Learning Systems, developmental evaluation, service design, narrative change"}, {"name": "Planetary and civilizational", "who": "Vanessa Machado de Oliveira, Jonathan Rowson, Carl Folke, Daniel Christian Wahl, Fritjof Capra, Kate Raworth, Arturo Escobar, Yaneer Bar-Yam"}], "braids": [{"pair": "Nora Bateson + Otto Scharmer", "why": "Relational sensing beside a structured change process. The friction shows what each assumes about intention."}, {"pair": "Bayo Akomolafe + Dave Snowden", "why": "Post-humanist inquiry beside practical sensemaking. Both distrust tidy plans for different reasons."}, {"pair": "Robin Wall Kimmerer + Elinor Ostrom", "why": "Reciprocity beside commons governance. Two routes to the same insight about shared resources."}, {"pair": "Service design + developmental evaluation + transition design", "why": "Journey, learning loop, and long horizon for government innovation."}, {"pair": "Power analysis + Hosting", "why": "Hosting without power analysis can launder existing hierarchies; power analysis without hosting can stay academic."}, {"pair": "Somatic practice + Crisis response", "why": "Regulated bodies make better decisions in the first hours, and recover better afterward."}], "journeys": [{"id": "quiet-heron", "title": "From crisis response to city innovation", "who": "quiet-heron started in government crisis response, working with small, ritual-rich communities, and later moved into a city innovation role inside a reluctant bureaucracy.", "stages": [{"where": "Starting point: crisis response in small communities", "levels": ["Community and place", "Group and dialogue", "Body and person"], "pathways": ["crisis-disaster-and-high-reliability", "ritual-liminality-and-transition", "somatic-and-embodied-practice", "indigenous-and-land-based-knowledge", "positive-deviance"], "note": "What they already know: communities self-organize in a crisis, ritual holds people through disruption, and regulated bodies make better decisions. These pathways name and deepen that knowledge."}, {"where": "Arriving in city government", "levels": ["Organization", "Society and policy"], "pathways": ["sensemaking-and-acting-in-uncertainty", "group-relations", "power-analysis", "government-plumbing"], rnwegrow.github.io/capacities/"}]}], "cases": [{"id": "cybersyn", "title": "Project Cybersyn", "place": "Chile", "years": "1971 to 1973", "summary": "Stafford Beer's team built a real-time economic feedback network for Salvador Allende's government using the Viable System Model, telex machines, and an operations room.", "lesson": "Cybernetic governance can move information and authority closer to where work happens. It also shows how quickly politics overtakes design.", "note": "Ended by the 1973 coup. Historians still debate how much it worked as intended.", "pathways": ["cybernetics-the-shared-foundation", "governance-and-self-organizing-structures"], "sources": [{"t": "Eden Medina: Cybernetic Revolutionaries (MIT Press)", "u": "https://mitpress.mit.edu/9780262525961/cybernetic-revolutionaries/"}]}, {"id": "rahs", "title": "Risk Assessment and Horizon Scanning", "place": "Singapore", "years": "2004 onward", "summary": "Singapore's government built a national horizon-scanning program informed by Cynefin and narrative sensemaking to detect weak signals early.", "lesson": "Sensemaking methods can be institutionalized inside a state, but they need continual protection from reverting to prediction.", "note": "Later commentary asks how much of the original ambition survived.", "pathways": ["sensemaking-and-acting-in-uncertainty", "strategy-under-uncertainty"], "sources": [{"t": "The Cynefin Co: Horizon scanning", "u": "https://thecynefin.co/horizon-scanning/"}, {"t": "Integrating foresight into policy: RAHS in Singapore", "u": "https://www.interface-eu.org/archive/publications/1273"}]}, {"id": "buurtzorg", "title": "Buurtzorg neighbourhood nursing", "place": "Netherlands", "years": "2006 onward", "summary": "Home care delivered by small self-managing nurse teams with minimal overhead and no middle management, scaling to thousands of nurses.", "lesson": "Distributed authority can scale when support functions serve teams instead of managing them.", "note": "Results depend on Dutch funding rules and professional nursing culture; transplants elsewhere have been mixed.", "pathways": ["governance-and-self-organizing-structures", "corporate-innovation-and-renewal", "teams-and-learning-cultures"], "sources": [{"t": "Commonwealth Fund case study", "u": "https://www.commonwealthfund.org/publications/case-study/2015/may/home-care-self-governing-nursing-teams-netherlands-buurtzorg-model"}, {"t": "Centre for Public Impact profile", "u": "https://centreforpublicimpact.org/public-impact-fundamentals/buurtzorg-revolutionising-home-care-in-the-netherlands/"}]}, {"id": "amsterdam-doughnut", "title": "Amsterdam City Doughnut", "place": "Amsterdam, Netherlands", "years": "2020 onward", "summary": "The city adopted a Doughnut portrait to guide its circular economy strategy, asking how the city can thrive within planetary and social boundaries.", "lesson": "A shared picture of the goal can realign many departments without a single master plan.", "note": "Researchers question how far it has changed core economic decisions.", "pathways": ["complexity-economics-and-new-economic-models", "public-policy-and-government-innovation"], "sources": [{"t": "DEAL: Amsterdam City Doughnut", "u": "https://doughnuteconomics.org/stories/amsterdam-city-doughnut"}, {"t": "TIME: Amsterdam is embracing a new economic theory", "u": "https://time.com/5930093/amsterdam-doughnut-economics/"}]}, {"id": "porto-alegre", "title": "Participatory budgeting", "place": "Porto Alegre, Brazil", "years": "1989 onward", "summary": "Residents deliberated and voted on a share of the city's capital budget through neighborhood and thematic assemblies, and the model spread worldwide.", "lesson": "Real decision power, not consultation, draws people in. Participation shifted spending toward poorer neighborhoods.", "note": "Weakened by later administrations; recent research documents its dismantling in its birthplace.", "pathways": ["hosting-and-participatory-practice", "participatory-design-and-design-justice", "power-analysis"], "sources": [{"t": "WRI: Porto Alegre and the challenge of sustaining transformative change", "u": "https://www.wri.org/research/porto-alegre-participatory-budgeting-and-challenge-sustaining-transformative-change"}, {"t": "Participedia: Porto Alegre 1989 to present", "u": "https://participedia.net/case/5524"}, {"t": "From innovation to erosion (2026)", "u": "https://journals.sagepub.com/doi/10.1177/1866802X261464354"}]}, {"id": "pd-vietnam", "title": "Child nutrition through positive deviance", "place": "Vietnam", "years": "1990 onward", "summary": "Jerry and Monique Sternin worked with villages to find poor families whose children were well nourished, then helped others adopt their feeding practices.", "lesson": "Solutions already present in a community spread faster than imported ones, because they come from peers.", "note": "", "pathways": ["positive-deviance"], "sources": [{"t": "The Vietnam story: 25 years later", "u": "https://positivedeviance.org/case-studies-all/2018/4/16/the-vietnam-story-25-years-later"}]}, {"id": "100k-lives", "title": "100,000 Lives Campaign", "place": "United States", "years": "2004 to 2006", "summary": "IHI enrolled thousands of hospitals in six evidence-based changes, using improvement cycles and peer networks to spread them.", "lesson": "A campaign structure plus local PDSA testing can spread practice fast across independent organizations.", "note": "Its headline lives-saved figure was challenged by researchers, and IHI published a reply.", "pathways": ["improvement-and-adaptive-management"], "sources": [{"t": "IHI: 100,000 Lives Campaign ten years later", "u": "https://www.ihi.org/library/blog/100000-lives-campaign-ten-years-later"}, {"t": "The 100,000 Lives Campaign: a scientific and policy review (PubMed)", "u": "https://pubmed.ncbi.nlm.nih.gov/17120921/"}]}, {"id": "menominee", "title": "Menominee Forest", "place": "Wisconsin, United States", "years": "1854 onward", "summary": "The Menominee Nation has managed its forest on a sustained-yield basis for generations, harvesting while the standing timber has grown.", "lesson": "Long-horizon stewardship rooted in relationship with land can outperform short-cycle management on both ecology and livelihood.", "note": "", "pathways": ["indigenous-and-land-based-knowledge", "living-systems-and-regeneration"], "sources": [{"t": "Yale Environment 360: Menominee forest management", "u": "https://e360.yale.edu/features/menominee-forest-management-logging"}, {"t": "Menominee Tribal Enterprises: sustainable forest management", "u": "https://www.mtewood.com/SustainableForestry/ForestManagement"}]}, {"id": "sva", "title": "Student Volunteer Army", "place": "Christchurch, Aotearoa New Zealand", "years": "2010 onward", "summary": "After the Canterbury earthquakes, students self-organized thousands of volunteers to clear liquefaction silt, then became a lasting emergency response organization.", "lesson": "Spontaneous volunteers become an asset when officials make room for them and when light structure forms quickly.", "note": "", "pathways": ["crisis-disaster-and-high-reliability", "emergence-in-movements-and-social-change"], "sources": [{"t": "A shovel or a shopping cart: ten years of the SVA (PMC)", "u": "https://pmc.ncbi.nlm.nih.gov/articles/PMC8453034/"}]}, {"id": "plymouth", "title": "Plymouth Alliance for Complex Needs", "place": "Plymouth, England", "years": "2019 onward", "summary": "The council and health commissioners replaced competing service contracts with a single alliance of providers sharing budget and responsibility for people with complex needs.", "lesson": "Contract form shapes behavior. Alliance commissioning lets providers learn together instead of competing over targets.", "note": "", "pathways": ["government-plumbing", "public-policy-and-government-innovation", "funding-and-budgeting-for-adaptation"], "sources": [{"t": "HLS case study: Plymouth Alliance", "u": "https://www.humanlearning.systems/uploads/Plymouth%20Alliance.pdf"}, {"t": "Co-operative Councils Innovation Network case study", "u": "https://www.councils.coop/case-study/plymouth-alliance-for-complex-needs/"}]}, {"id": "hls-cases", "title": "Human Learning Systems in practice", "place": "UK and beyond", "years": "2019 onward", "summary": "Dozens of public service organizations documenting their shift from targets and payment by results toward learning, relationships, and system stewardship.", "lesson": "The shift is less about a new tool than about changing funding, accountability, and management at the same time.", "note": "", "pathways": ["public-policy-and-government-innovation", "measurement-and-accountability", "developmental-evaluation"], "sources": [{"t": "HLS case studies", "u": "https://www.humanlearning.systems/case-studies/"}, {"t": "JRF: relational public service can tackle hardship", "u": "https://www.jrf.org.uk/neighbourhoods-and-communities/relational-public-service-can-tackle-hardship-in-neighbourhoods"}]}, {"id": "legible", "title": "Legible Practises", "place": "Helsinki, Finland", "years": "2013", "summary": "A free book of six stories, collected by Helsinki Design Lab, about public institutions that changed how they work and the stewardship craft behind it.", "lesson": "Stewardship is a craft that can be described and taught when practitioners make their decisions visible.", "note": "", "pathways": ["strategic-design-and-policy-labs", "public-policy-and-government-innovation"], "sources": [{"t": "Legible Practises (free book)", "u": "https://www.helsinkidesignlab.org/legiblepractises"}]}, {"id": "ojai", "title": "Water shortage in Ojai", "place": "Ojai, California", "years": "2016 onward", "summary": "Carnegie Mellon's transition design team worked with residents and stakeholders to map a wicked water problem and seed interventions across timescales.", "lesson": "Mapping a problem with the people inside it, across long horizons, reveals where small interventions can connect.", "note": "", "pathways": ["transition-design"], "sources": [{"t": "Words into action: transition design in Ojai (SciELO)", "u": "https://www.scielo.org.ar/scielo.php?script=sci_arttext&pid=S1853-35232019000300196"}]}, {"id": "handelsbanken", "title": "Handelsbanken and Equinor without annual budgets", "place": "Sweden and Norway", "years": "1970s onward", "summary": "Two large firms dropped fixed annual budgets for rolling forecasts, relative targets, and local authority.", "lesson": "Budget processes are a governance structure; changing them changes what people are allowed to learn.", "note": "", "pathways": ["funding-and-budgeting-for-adaptation", "corporate-innovation-and-renewal"], "sources": [{"t": "Forbes: how Equinor and Handelsbanken abolished budgeting", "u": "https://www.forbes.com/sites/stevedenning/2019/06/24/how-equinor-and-handelsbanken-abolished-budgeting/"}, {"t": "Handelsbanken case story (Agile Business Consortium)", "u": "https://www.agilebusiness.org/resource/beyond-budgeting-business-agility-in-practice-the-handelsbanken-case-story.html"}]}, {"id": "highlander-case", "title": "Highlander Folk School and the civil rights movement", "place": "Tennessee, United States", "years": "1932 onward", "summary": "Workshops where ordinary people analyzed their own situations trained labor organizers and civil rights leaders, including Rosa Parks and Septima Clark's citizenship schools.", "lesson": "Popular education builds the analysis and relationships that movements later act on.", "note": "", "pathways": ["critical-and-popular-education", "emergence-in-movements-and-social-change"], "sources": [{"t": "How Myles Horton built a social movement institution", "u": "https://convergencemag.com/articles/myles-horton-highlander/"}, {"t": "Highlander Folk School (King Institute, Stanford)", "u": "https://kinginstitute.stanford.edu/highlander-folk-school"}]}, {"id": "haier", "title": "Haier's RenDanHeYi", "place": "China", "years": "2005 onward", "summary": "The appliance maker broke itself into thousands of microenterprises that contract with each other and serve users directly.", "lesson": "Large organizations can shrink the distance between decisions and users by dissolving middle layers.", "note": "", "pathways": ["corporate-innovation-and-renewal"], "sources": [{"t": "Corporate Rebels: RenDanHeYi", "u": "https://www.corporate-rebels.com/blog/rendanheyi-forum"}]}, {"id": "wajir", "title": "Wajir Peace and Development Committee", "place": "Wajir, Kenya", "years": "1992 onward", "summary": "After clan violence killed hundreds, women traders led by Dekha Ibrahim Abdi began mediating between clans. The agreement grew into a standing committee of elders, religious leaders, security services, officials, and NGOs.", "lesson": "Peace held when people from every side kept meeting to carry it out, not when a single agreement was signed. Traditional Somali ways of settling disputes did much of the work.", "note": "The model spread to other districts in northern Kenya; violence in the region has flared again since.", "pathways": ["conflict-transformation", "emergence-in-movements-and-social-change"], "sources": [{"t": "Right Livelihood: Dekha Ibrahim Abdi (2007 laureate)", "u": "https://rightlivelihood.org/the-change-makers/find-a-laureate/dekha-abdi/"}, {"t": "Dekha Ibrahim Abdi (Wikipedia)", "u": "https://en.wikipedia.org/wiki/Dekha_Ibrahim_Abdi"}]}, {"id": "trc", "title": "Truth and Reconciliation Commission", "place": "South Africa", "years": "1996 to 2003", "summary": "Public hearings across the country let victims of apartheid-era violence tell their stories and let perpetrators apply for amnesty in exchange for full disclosure.", "lesson": "A shared public ritual can mark a passage between two orders of society and help people move through it together.", "note": "Many survivors felt reparations and prosecutions never followed through; the TRC remains debated as a model.", "pathways": ["ritual-liminality-and-transition", "conflict-transformation"], "sources": [{"t": "Truth and Reconciliation Commission (Department of Justice, South Africa)", "u": "https://www.justice.gov.za/trc/"}, {"t": "Truth and Reconciliation Commission (Wikipedia)", "u": "https://en.wikipedia.org/wiki/Truth_and_Reconciliation_Commission_(South_Africa)"}]}, {"id": "mont-fleur", "title": "Mont Fleur scenarios", "place": "South Africa", "years": "1991 to 1992", "summary": "As negotiations to end apartheid began, 22 leaders from the ANC, the government, business, unions, and academia built four stories of where the country could go, named Ostrich, Lame Duck, Icarus, and Flight of the Flamingos.", "lesson": "Scenarios built by people who disagree can give a whole country a shared language for choices ahead, without forcing agreement on what to do.", "note": "Participants and facilitator Adam Kahane describe its influence; it is hard to separate from everything else happening in the transition.", "pathways": ["systemic-design-and-futures", "strategy-under-uncertainty"], "sources": [{"t": "Reos Partners: Lessons from the Mont Fleur scenarios (PDF)", "u": "https://globaltfokus.dk/images/Kapacitetsudvikling/Arrangementer_kap_forum/Lessons_from_Mont_Fleur.pdf"}, {"t": "The Mont Fleur scenarios (Open Foresight Hub)", "u": "https://openforesighthub.org/doku.php?id=library:the_mont_fleur_scenarios_2007"}]}, {"id": "food-lab", "title": "Sustainable Food Lab", "place": "US, Europe, and Latin America", "years": "2004 onward", "summary": "About 30 leaders from food companies, NGOs, and governments went on a two-year learning journey designed around Theory U, with field visits, a wilderness retreat, and prototype projects.", "lesson": "People who compete or oppose each other can sense a system together first and then act on what they saw, but prototypes need a home after the lab ends.", "note": "Became a lasting network; some prototypes stalled and the founders write openly about trial and error.", "pathways": ["presencing-theory-u-and-social-presencing-theater", "collaboration-across-boundaries"], "sources": [{"t": "Reos Partners: The Sustainable Food Lab, eight years and counting", "u": "https://reospartners.com/the-sustainable-food-lab-eight-years-and-counting/"}, {"t": "Hal Hamilton: Trial and Error, a personal story (PDF)", "u": "https://sustainablefoodlab.org/wp-content/uploads/2015/12/Trial-and-Error-3-22.pdf"}]}, {"id": "kerala", "title": "People's Plan Campaign", "place": "Kerala, India", "years": "1996 to 2001", "summary": "The state devolved 35 to 40 percent of its development budget to local governments. Village assemblies in every ward set priorities, and volunteers trained in large numbers helped draw up local plans.", "lesson": "Moving money and authority closer to people works when it comes with mass learning, so residents can actually use the power they are given.", "note": "Quality varied by place; later governments kept the structures but some of the campaign energy faded.", "pathways": ["public-policy-and-government-innovation", "critical-and-popular-education"], "sources": [{"t": "Isaac and Franke: Local Democracy and Development (book summary)", "u": "https://msuweb.montclair.edu/~franker/isaacbook.htm"}, {"t": "Building local democracy: evaluating decentralization in Kerala (World Development)", "u": "https://www.sciencedirect.com/science/article/abs/pii/S0305750X06002269"}]}, {"id": "imagine-chicago", "title": "Imagine Chicago", "place": "Chicago, United States", "years": "1992 onward", "summary": "Young people, paired with adult mentors, interviewed business, civic, and cultural leaders about what gives the city life and what they hoped for, using Appreciative Inquiry questions.", "lesson": "Asking what already works, and letting young people ask, can open conversations that problem-focused planning shuts down.", "note": "Results are mostly told as stories by the organizers; the model spread to other cities.", "pathways": ["appreciative-inquiry"], "sources": [{"t": "Imagine Chicago: the early story", "u": "https://www.imaginechicago.org/founders-story"}, {"t": "Imagine Chicago (Appreciative Inquiry Commons)", "u": "https://aicommons.champlain.edu/educational-material/imagine-chicago-2/"}]}, {"id": "gds", "title": "Government Digital Service and GOV.UK", "place": "United Kingdom", "years": "2011 onward", "summary": "A new team in the Cabinet Office replaced hundreds of government websites with one, GOV.UK, built around user needs, user research, and small multidisciplinary teams working in the open.", "lesson": "Service design changes government when it comes with the authority to say no to old contracts and the skills to build in-house.", "note": "Its influence peaked in the early 2010s; later reviews describe a loss of central authority and uneven adoption.", "pathways": ["service-design", "government-plumbing"], "sources": [{"t": "UK Government Digital Service: moving beyond a website (Harvard Kennedy School case)", "u": "https://case.hks.harvard.edu/uk-government-digital-service-moving-beyond-a-website/"}, {"t": "The UK government's digital transformation: how did it come about? (Economics Observatory)", "u": "https://www.economicsobservatory.com/the-uk-governments-digital-transformation-how-did-it-come-about"}]}, {"id": "fals-borda", "title": "Participatory action research on Colombia's Caribbean coast", "place": "Córdoba, Colombia", "years": "1972 to 1975", "summary": "Orlando Fals Borda and La Rosca worked with the national peasant users' association to research land struggles with peasants, not about them, and returned the findings in forms people could use.", "lesson": "Research can be a tool for the people it studies when they set the questions and own the results.", "note": "Historians, notably Joanne Rappaport, show how messy and contested the early practice was.", "pathways": ["action-research", "critical-and-popular-education"], "sources": [{"t": "The participatory research of Orlando Fals Borda (Participatory Methods, IDS)", "u": "https://www.participatorymethods.org/resource/the-participatory-research-of-orlando-fals-borda/"}, {"t": "Joanne Rappaport: Cowards Don't Make History (Duke University Press)", "u": "https://read.dukeupress.edu/books/book/2805/Cowards-Don-t-Make-HistoryOrlando-Fals-Borda-and"}]}, {"id": "ddo", "title": "Deliberately developmental organizations", "place": "United States", "years": "Studied 2011 to 2016", "summary": "Robert Kegan and Lisa Lahey studied companies such as Decurion that build personal growth into daily work, for example by making weaknesses and mistakes openly discussable.", "lesson": "Adult development can be part of how work is organized, not just a training course.", "note": "The evidence comes from a small number of firms studied by the theory's authors.", "pathways": ["adult-development-and-immunity-to-change"], "sources": [{"t": "Kegan, Lahey et al.: Making Business Personal (HBR, April 2014)", "u": "https://hbr.org/2014/04/making-business-personal"}, {"t": "On deliberately developmental organizations (Harvard Graduate School of Education)", "u": "https://www.gse.harvard.edu/ideas/news/14/04/deliberately-developmental-organizations"}]}, {"id": "embrace", "title": "Embrace infant warmer", "place": "Stanford, United States, and India", "years": "2007 onward", "summary": "Students in Stanford's Design for Extreme Affordability class were asked for a cheaper incubator. Field visits showed many babies died far from hospitals, so they designed a warmer that works without steady power.", "lesson": "Watching how people actually live can change the question you are answering, not just the answer.", "note": "Embrace later had to change its business model to reach scale; design alone did not solve distribution.", "pathways": ["design-thinking"], "sources": [{"t": "Embrace Innovations (Wikipedia)", "u": "https://en.wikipedia.org/wiki/Embrace_Innovations"}]}, {"id": "strive", "title": "Strive Partnership", "place": "Cincinnati and Northern Kentucky, United States", "years": "2006 onward", "summary": "School districts, universities, funders, businesses, and nonprofits agreed on shared goals and measures for children from cradle to career, with a backbone team to coordinate them.", "lesson": "Organizations that each own one piece of a problem can coordinate when they share data and a common agenda.", "note": "The case that launched the Collective Impact model; later critiques say it underplayed community voice and power.", "pathways": ["collaboration-across-boundaries", "measurement-and-accountability"], "sources": [{"t": "Kania and Kramer: Collective Impact (SSIR, 2011)", "u": "https://ssir.org/articles/entry/collective_impact"}, {"t": "StriveTogether: reinventing the local education ecosystem (Harvard Business School case, PDF)", "u": "https://www.strivetogether.org/wp-content/uploads/2017/03/StriveTogether-Reinventing-the-Local-Education-Ecosystem-314-031.pdf"}]}, {"id": "reframing-aging", "title": "Reframing Aging", "place": "United States", "years": "2015 onward", "summary": "FrameWorks researched how Americans think about getting older, then worked with aging organizations to change the words and metaphors they used, such as 'older people' and 'building momentum'.", "lesson": "Narrative change is slow, research-led, and collective: many organizations telling a new story the same way.", "note": "FrameWorks links the shift to later policy, such as Colorado's 2023 Job Application Fairness Act; attribution is its own.", "pathways": ["narrative-change"], "sources": [{"t": "FrameWorks: Impact spotlight, aging and ageism", "u": "https://www.frameworksinstitute.org/impact-stories/impact-spotlight-aging-and-ageism/"}, {"t": "Finding the Frame: research report (FrameWorks, 2017, PDF)", "u": "https://www.frameworksinstitute.org/app/uploads/2020/05/aging_research_report_final_2017.pdf"}]}, {"id": "artificial-anasazi", "title": "Artificial Anasazi", "place": "Long House Valley, Arizona, United States", "years": "Model published 2002", "summary": "Researchers at the Santa Fe Institute and Brookings built an agent-based model of Ancestral Puebloan households from 800 to 1350 and compared it with archaeological records.", "lesson": "Simple rules for many varied agents can reproduce real population patterns, and show which explanations for a collapse hold up.", "note": "The model matched growth well but not the final abandonment, suggesting social reasons beyond the environment.", "pathways": ["the-formal-science-of-complex-systems"], "sources": [{"t": "Axtell et al.: Population growth and collapse in a multiagent model (PubMed)", "u": "https://pubmed.ncbi.nlm.nih.gov/12011406/"}, {"t": "Artificial Anasazi model code (CoMSES)", "u": "https://www.comses.net/codebases/2222/releases/1.1.0/"}]}, {"id": "outward-bound", "title": "Outward Bound", "place": "Aberdyfi, Wales", "years": "1941 onward", "summary": "Shipping owner Lawrence Holt and educator Kurt Hahn started month-long courses of sailing, expeditions, and rescue training for young seamen during the Second World War.", "lesson": "Learning by doing hard things together, then reflecting on them, builds capacities a classroom can't.", "note": "", "pathways": ["experiential-learning-and-reflective-practice"], "sources": [{"t": "Outward Bound (Wikipedia)", "u": "https://en.wikipedia.org/wiki/Outward_Bound"}, {"t": "Outward Bound USA: history", "u": "https://www.outwardbound.org/about-us/outward-bound-history/"}]}, {"id": "reentry", "title": "Women's re-entry programs study", "place": "New York, New Jersey, California, and Washington, United States", "years": "1975 to 1978", "summary": "Jack Mezirow and Victoria Marsick studied 83 women returning to college in 12 programs and found many went through a 'perspective transformation' in how they saw themselves and their roles.", "lesson": "Adults change most deeply when a disorienting experience meets reflection and support from others going through the same thing.", "note": "The founding study of transformative learning; later scholars questioned how universal its ten phases are.", "pathways": ["transformative-learning"], "sources": [{"t": "Mezirow and Marsick: Education for Perspective Transformation (Semantic Scholar)", "u": "https://www.semanticscholar.org/paper/Education-for-Perspective-Transformation.-Women's-Mezirow-Marsick/a8cbf0444d3c73f343eb221d81ca150bf403b2bf"}, {"t": "Jack Mezirow (Wikipedia)", "u": "https://en.wikipedia.org/wiki/Jack_Mezirow"}]}, {"id": "eureka", "title": "Xerox Eureka", "place": "France and worldwide", "years": "1990s", "summary": "Anthropologist Julian Orr found copier technicians learned mostly by swapping stories. Xerox PARC then built Eureka, a peer-reviewed database of technicians' own repair tips, credited to their authors.", "lesson": "Communities of practice already exist; support works best when it amplifies how people learn from each other.", "note": "Widely cited in knowledge management; most accounts come from Xerox and PARC.", "pathways": ["communities-of-practice-and-action-learning"], "sources": [{"t": "Eureka! Xerox discovers way to grow community knowledge (KMWorld)", "u": "https://www.kmworld.com/Articles/Editorial/Features/Best-Practices-Eureka!-Xerox-discovers-way-to-grow-community-knowledge.-.-And-customer-satisfaction-9140.aspx"}, {"t": "Field work in the tribal office (MIT Technology Review, 1998)", "u": "https://www.technologyreview.com/1998/05/01/41585/field-work-in-the-tribal-office/"}]}, {"id": "new-britain", "title": "The New Britain workshop", "place": "New Britain, Connecticut, United States", "years": "1946", "summary": "Kurt Lewin's team ran a workshop for community leaders on fair employment. When participants sat in on staff discussions of their own behavior, the group's here-and-now interaction became the learning.", "lesson": "A group studying itself as it happens can learn faster than one studying a topic.", "note": "Led to the National Training Laboratories at Bethel, Maine, in 1947.", " // #/orgs[/:id]  #/cases[/:id]  #/library. Old links (#p-…, #o-…, #c-…, #library…) still work.
function legacy(h){
  const m = h.match(/^#(p|o|c)-(.+)$/); if (m) return {p:"#/wiki/", o:"#/orgs/", c:"#/cases/"}[m[1]] + m[2];
  return {"#pathways":"#/wiki","#orgs":"#/orgs","#cases":"#/cases","#journeys":"#/about","#orientations":"#/about","#levels":"#/about","#library":"#/library"}[h] || null;

  else if (key !== lastRoute || parts[0] !== "map") window.scrollTo(0, 0);
  lastRoute = key;

  document.title = t ? `${t} · Pathways into Complexity` : "Pathways into Complexity";
