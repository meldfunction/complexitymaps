is Sumara applied complexity science to teaching. The Inner Development Goals offer a framework of inner capacities for working on global challenges."], "practice": ["Design one lesson around an open question with no single right answer.", "Let students explore a local system, like the school's food or energy, as a complex system.", "Assess learning by how students handle uncertainty, not only by recall.", "Treat the school itself as a learning system: what feedback loops help it improve?"], "sector_notes": {"biz": "Corporate learning moving toward capacities, not just skills.", "ngo": "Education charities designing for adaptability.", "health": "Training clinicians to work with uncertainty.", "edu": "Home ground: schools, universities and learning designers.", "com": "Community learning that builds collective capacity."}, "key_ideas": [{"term": "complexity thinking", "defn": "Seeing a situation as many interacting parts producing patterns no one part explains."}, {"term": "inner development goals", "defn": "A framework of inner capacities, like perspective-taking and self-awareness, for working on global challenges."}, {"term": "emergence", "defn": "When a whole shows patterns that none of its parts have on their own."}, {"term": "teaching uncertainty", "defn": "Morin's call to prepare learners for the unexpected."}, {"term": "learning system", "defn": "An organization or community designed to learn continually."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "Edgar Morin", "note": "Seven Complex Lessons in Education for the Future", "years": "1921–2026", "people": ["Edgar Morin"]}, {"name": "Brent Davis and Dennis Sumara", "note": "Complexity and Education", "years": "", "people": []}, {"name": "Nora Bateson on education", "note": "", "years": "b. 1969", "people": ["Nora Bateson"]}, {"name": "Inner Development Goals", "note": "a widely used capacity framework", "years": "", "people": []}]}], "orgs": [{"id": "bateson-institute", "name": "Internatio ns-codes-and-meaning-making"], "media": [{"kind": "Article", "title": "Ecosemiotics research group", "u": "https://www.ecosem.ut.ee/en/?p=36"}, {"kind": "Journal", "title": "Sign Systems Studies (open access)", "u": "https://ojs.utlib.ee/index.php/sss"}, {"kind": "Article", "title": "Reintroduction of the European mink: local community experience (project page)", "u": "https://www.serake.ut.ee/en/?p=818"}]}, {"id": "iass", "name": "International Association for Semiotic Studies", "url": "https://iass-ais.org/", "summary": "The worldwide association for semiotics, founded in 1969. Holds world congresses and links national societies such as the Semiotic Society of America.", "pathways": ["semiotics-signs-codes-and-meaning-making"], "media": [{"kind": "Article", "title": "Peirce's theory of signs (Stanford Encyclopedia of Philosophy)", "u": "https://plato.stanford.edu/entries/peirce-semiotics/"}, {"kind": "Article", "title": "Semiotic Society of America", "u": "https://www.semioticsocietyofamerica.org/"}]}], "cases": [{"id": "cybersyn", "title": "Project Cybersyn", "place": "Chile", "years": "1971 to 1973", "summary": "Stafford Beer's team built a real-time economic feedback network for Salvador Allende's government using the Viable System Model, telex machines, and an operations room.", "lesson": "Cybernetic governance can move information and authority closer to where work happens. It also shows how quickly politics overtakes design.", "note": "Ended by the 1973 coup. Historians still debate how much it worked as intended.", "pathways": ["cybernetics-the-shared-foundation", "governance-and-self-organizing-structures"], "sources": [{"t": "Eden Medina: Cybernetic Revolutionaries (MIT Press)", "u": "https://mitpress.mit.edu/9780262525961/cybernetic-revolutionaries/"}]}, {"id": "rahs", "title": "Risk Assessment and Horizon Scanning", "place": "Singapore", "years": "2004 onward", "summary": "Singapore's government built a national horizon-scanning program informed by Cynefin and narrative sensemaking to detect weak signals early.", "lesson": "Sensemaking methods can be institutionalized inside a state, but they need continual protection from reverting to prediction.", "note": "Later commentary asks how much of the original ambition survived.", "pathways": ["sensemaking-and-acting-in-uncertainty", "strategy-under-uncertainty"], "sources": [{"t": "The Cynefin Co: Horizon scanning", "u": "https://thecynefin.co/horizon-scanning/"}, {"t": "Integrating foresight into policy: RAHS in Singapore", "u": "https://www.interface-eu.org/archive/publications/1273"}]}, {"id": "buurtzorg", "title": "Buurtzorg neighbourhood nursing", "place": "Netherlands", "years": "2006 onward", "summary": "Home care delivered by small self-managing nurse teams with minimal overhead and no middle management, scaling to thousands of nurses.", "lesson": "Distributed authority can scale when support functions serve teams instead of managing them.", "note": "Results depend on Dutch funding rules and professional nursing culture; transplants elsewhere have been mixed.", "pathways": ["governance-and-self-organizing-structures", "corporate-innovation-and-renewal", "teams-and-learning-cultures"], "sources": [{"t": "Commonwealth Fund case study", "u": "https://www.commonwealthfund.org/publications/case-study/2015/may/home-care-self-governing-nursing-teams-netherlands-buurtzorg-model"}, {"t": "Centre for Public Impact profile", "u": "https://centreforpublicimpact.org/public-impact-fundamentals/buurtzorg-revolutionising-home-care-in-the-netherlands/"}]}, {"id": "amsterdam-doughnut", "title": "Amsterdam City Doughnut", "place": "Amsterdam, Netherlands", "years": "2020 onward", "summary": "The city adopted a Doughnut portrait to guide its circular economy strategy, asking how the city can thrive within planetary and social boundaries.", "lesson": "A shared picture of the goal can realign many departments without a single master plan.", "note": "Researchers question how far it has changed core economic decisions.", "pathways": ["complexity-economics-and-new-economic-models", "public-policy-and-government-innovation"], "sources": [{"t": "DEAL: Amsterdam City Doughnut", "u": "https://doughnuteconomics.org/stories/amsterdam-city-doughnut"}, {"t": "TIME: Amsterdam is embracing a new economic theory", "u": "https://time.com/5930093/amsterdam-doughnut-economics/"}]}, {"id": "porto-alegre", "title": "Participatory budgeting", "place": "Porto Alegre, Brazil", "years": "1989 onward", "summary": "Residents deliberated and voted on a share of the city's capital budget through neighborhood and thematic assemblies, and the model spread worldwide.", "lesson": "Real decision power, not consultation, draws people in. Participation shifted spending toward poorer neighborhoods.", "note": "Weakened by later administrations; recent research documents its dismantling in its birthplace.", "pathways": ["hosting-and-participatory-practice", "participatory-design-and-design-justice", "power-analysis"], "sources": [{"t": "WRI: Porto Alegre and the challenge of sustaining transformative change", "u": "https://www.wri.org/research/porto-alegre-participatory-budgeting-and-challenge-sustaining-transformative-change"}, {"t": "Participedia: Porto Alegre 1989 to present", "u": "https://participedia.net/case/5524"}, {"t": "From innovation to erosion (2026)", "u": "https://journals.sagepub.com/doi/10.1177/1866802X261464354"}]}, {"id": "pd-vietnam", "title": "Child nutrition through positive deviance", "place": "Vietnam", "years": "1990 onward", "summary": "Jerry and Monique Sternin worked with villages to find poor families whose children were well nourished, then helped others adopt their feeding practices.", "lesson": "Solutions already present in a community spread faster than imported ones, because they come from peers.", "note": "", "pathways": ["positive-deviance"], "sources": [{"t": "The Vietnam story: 25 years later", "u": "https://positivedeviance.org/case-studies-all/2018/4/16/the-vietnam-story-25-years-later"}]}, {"id": "100k-lives", "title": "100,000 Lives Campaign", "place": "United States", "years": "2004 to 2006", "summary": "IHI enrolled thousands of hospitals in six evidence-based changes, using improvement cycles and peer networks to spread them.", "lesson": "A campaign structure plus local PDSA testing can spread practice fast across independent organizations.", "note": "Its headline lives-saved figure was challenged by researchers, and IHI published a reply.", "pathways": ["improvement-and-adaptive-management"], "sources": [{"t": "IHI: 100,000 Lives Campaign ten years later", "u": "https://www.ihi.org/library/blog/100000-lives-campaign-ten-years-later"}, {"t": "The 100,000 Lives Campaign: a scientific and policy review (PubMed)", "u": "https://pubmed.ncbi.nlm.nih.gov/17120921/"}]}, {"id": "menominee", "title": "Menominee Forest", "place": "Wisconsin, United States", "years": "1854 onward", "summary": "The Menominee Nation has managed its forest on a sustained-yield basis for generations, harvesting while the standing timber has grown.", "lesson": "Long-horizon stewardship rooted in relationship with land can outperform short-cycle management on both ecology and livelihood.", "note": "", "pathways": ["indigenous-and-land-based-knowledge", "living-systems-and-regeneration"], "sources": [{"t": "Yale Environment 360: Menominee forest management", "u": "https://e360.yale.edu/features/menominee-forest-management-logging"}, {"t": "Menominee Tribal Enterprises: sustainable forest management", "u": "https://www.mtewood.com/SustainableForestry/ForestManagement"}]}, {"id": "sva", "title": "Student Volunteer Army", "place": "Christchurch, Aotearoa New Zealand", "years": "2010 onward", "summary": "After the Canterbury earthquakes, students self-organized thousands of volunteers to clear liquefaction silt, then became a lasting emergency response organization.", "lesson": "Spontaneous volunteers become an asset when officials make room for them and when light structure forms quickly.", "note": "", "pathways": ["crisis-disaster-and-high-reliability", "emergence-in-movements-and-social-change"], "sources": [{"t": "A shovel or a shopping cart: ten years of the SVA (PMC)", "u": "https://pmc.ncbi.nlm.nih.gov/articles/PMC8453034/"}]}, {"id": "plymouth", "title": "Plymouth Alliance for Complex Needs", "place": "Plymouth, England", "years": "2019 onward", "summary": "The council and health commissioners replaced competing service contracts with a single alliance of providers sharing budget and responsibility for people with complex needs.", "lesson": "Contract form shapes behavior. Alliance commissioning lets providers learn together instead of competing over targets.", "note": "", "pathways": ["government-plumbing", "public-policy-and-government-innovation", "funding-and-budgeting-for-adaptation"], "sources": [{"t": "HLS case study: Plymouth Alliance", "u": "https://www.humanlearning.systems/uploads/Plymouth%20Alliance.pdf"}, {"t": "Co-operative Councils Innovation Network case study", "u": "https://www.councils.coop/case-study/plymouth-alliance-for-complex-needs/"}]}, {"id": "hls-cases", "title": "Human Learning Systems in practice", "place": "UK and beyond", "years": "2019 onward", "summary": "Dozens of public service organizations documenting their shift from targets and payment by results toward learning, relationships, and system stewardship.", "lesson": "The shift is less about a new tool than about changing funding, accountability, and management at the same time.", "note": "", "pathways": ["public-policy-and-government-innovation", "measurement-and-accountability", "developmental-evaluation"], "sources": [{"t": "HLS case studies", "u": "https://www.humanlearning.systems/case-studies/"}, {"t": "JRF: relational public service can tackle hardship", "u": "https://www.jrf.org.uk/neighbourhoods-and-communities/relational-public-service-can-tackle-hardship-in-neighbourhoods"}]}, {"id": "legible", "title": "Legible Practises", "place": "Helsinki, Finland", "years": "2013", "summary": "A free book of six stories, collected by Helsinki Design Lab, about public institutions that changed how they work and the stewardship craft behind it.", "lesson": "Stewardship is a craft that can be described and taught when practitioners make their decisions visible.", "note": "", "pathways": ["strategic-design-and-policy-labs", "public-policy-and-government-innovation"], "sources": [{"t": "Legible Practises (free book)", "u": "https://www.helsinkidesignlab.org/legiblepractises"}]}, {"id": "ojai", "title": "Water shortage in Ojai", "place": "Ojai, California", "years": "2016 onward", "summary": "Carnegie Mellon's transition design team worked with residents and stakeholders to map a wicked water problem and seed interventions across timescales.", "lesson": "Mapping a problem with the people inside it, across long horizons, reveals where small interventions can connect.", "note": "", "pathways": ["transition-design"], "sources": [{"t": "Words into action: transition design in Ojai (SciELO)", "u": "https://www.scielo.org.ar/scielo.php?script=sci_arttext&pid=S1853-35232019000300196"}]}, {"id": "handelsbanken", "title": "Handelsbanken and Equinor without annual budgets", "place": "Sweden and Norway", "years": "1970s onward", "summary": "Two large firms dropped fixed annual budgets for rolling forecasts, relative targets, and local authority.", "lesson": "Budget processes are a governance structure; changing them changes what people are allowed to learn.", "note": "", "pathways": ["funding-and-budgeting-for-adaptation", "corporate-innovation-and-renewal"], "sources": [{"t": "Forbes: how Equinor and Handelsbanken abolished budgeting", "u": "https://www.forbes.com/sites/stevedenning/2019/06/24/how-equinor-and-handelsbanken-abolished-budgeting/"}, {"t": "Handelsbanken case story (Agile Business Consortium)", "u": "https://www.agilebusiness.org/resource/beyond-budgeting-business-agility-in-practice-the-handelsbanken-case-story.html"}]}, {"id": "highlander-case", "title": "Highlander Folk School and the civil rights movement", "place": "Tennessee, United States", "years": "1932 onward", "summary": "Workshops where ordinary people analyzed their own situations trained labor organizers and civil rights leaders, including Rosa Parks and Septima Clark's citizenship schools.", "lesson": "Popular education builds the analysis and relationships that movements later act on.", "note": "", "pathways": ["critical-and-popular-education", "emergence-in-movements-and-social-change"], "sources": [{"t": "How Myles Horton built a social movement institution", "u": "https://convergencemag.com/articles/myles-horton-highlander/"}, {"t": "Highlander Folk School (King Institute, Stanford)", "u": "https://kinginstitute.stanford.edu/highlander-folk-school"}]}, {"id": "haier", "title": "Haier's RenDanHeYi", "place": "China", "years": "2005 onward", "summary": "The appliance maker broke itself into thousands of microenterprises that contract with each other and serve users directly.", "lesson": "Large organizations can shrink the distance between decisions and users by dissolving middle layers.", "note": "", "pathways": ["corporate-innovation-and-renewal"], "sources": [{"t": "Corporate Rebels: RenDanHeYi", "u": "https://www.corporate-rebels.com/blog/rendanheyi-forum"}]}, {"id": "wajir", "title": "Wajir Peace and Development Committee", "place": "Wajir, Kenya", "years": "1992 onward", "summary": "After clan violence killed hundreds, women traders led by Dekha Ibrahim Abdi began mediating between clans. The agreement grew into a standing committee of elders, religious leaders, security services, officials, and NGOs.", "lesson": "Peace held when people from every side kept meeting to carry it out, not when a single agreement was signed. Traditional Somali ways of settling disputes did much of the work.", "note": "The model spread to other districts in northern Kenya; violence in the region has flared again since.", "pathways": ["conflict-transformation", "emergence-in-movements-and-social-change"], "sources": [{"t": "Right Livelihood: Dekha Ibrahim Abdi (2007 laureate)", "u": "https://rightlivelihood.org/the-change-makers/find-a-laureate/dekha-abdi/"}, {"t": "Dekha Ibrahim Abdi (Wikipedia)", "u": "https://en.wikipedia.org/wiki/Dekha_Ibrahim_Abdi"}]}, {"id": "trc", "title": "Truth and Reconciliation Commission", "place": "South Africa", "years": "1996 to 2003", "summary": "Public hearings across the country let victims of apartheid-era violence tell their stories and let perpetrators apply for amnesty in exchange for full disclosure.", "lesson": "A shared public ritual can mark a passage between two orders of society and help people move through it together.", "note": "Many survivors felt reparations and prosecutions never followed through; the TRC remains debated as a model.", "pathways": ["ritual-liminality-and-transition", "conflict-transformation"], "sources": [{"t": "Truth and Reconciliation Commission (Department of Justice, South Africa)", "u": "https://www.justice.gov.za/trc/"}, {"t": "Truth and Reconciliation Commission (Wikipedia)", "u": "https://en.wikipedia.org/wiki/Truth_and_Reconciliation_Commission_(South_Africa)"}]}, {"id": "mont-fleur", "title": "Mont Fleur scenarios", "place": "South Africa", "years": "1991 to 1992", "summary": "As negotiations to end apartheid began, 22 leaders from the ANC, the government, business, unions, and academia built four stories of where the country could go, named Ostrich, Lame Duck, Icarus, and Flight of the Flamingos.", "lesson": "Scenarios built by people who disagree can give a whole country a shared language for choices ahead, without forcing agreement on what to do.", "note": "Participants and facilitator Adam Kahane describe its influence; it is hard to separate from everything else happening in the transition.", "pathways": ["systemic-design-and-futures", "strategy-under-uncertainty"], "sources": [{"t": "Reos Partners: Lessons from the Mont Fleur scenarios (PDF)", "u": "https://globaltfokus.dk/images/Kapacitetsudvikling/Arrangementer_kap_forum/Lessons_from_Mont_Fleur.pdf"}, {"t": "The Mont Fleur scenarios (Open Foresight Hub)", "u": "https://openforesighthub.org/doku.php?id=library:the_mont_fleur_scenarios_2007"}]}, {"id": "food-lab", "title": "Sustainable Food Lab", "place": "US, Europe, and Latin America", "years": "2004 onward", "summary": "About 30 leaders from food companies, NGOs, and governments went on a two-year learning journey designed around Theory U, with field visits, a wilderness retreat, and prototype projects.", "lesson": "People who compete or oppose each other can sense a system together first and then act on what they saw, but prototypes need a home after the lab ends.", "note": "Became a lasting network; some prototypes stalled and the founders write openly about trial and error.", "pathways": ["presencing-theory-u-and-social-presencing-theater", "collaboration-across-boundaries"], "sources": [{"t": "Reos Partners: The Sustainable Food Lab, eight years and counting", "u": "https://reospartners.com/the-sustainable-food-lab-eight-years-and-counting/"}, {"t": "Hal Hamilton: Trial and Error, a personal story (PDF)", "u": "https://sustainablefoodlab.org/wp-content/uploads/2015/12/Trial-and-Error-3-22.pdf"}]}, {"id": "kerala", "title": "People's Plan Campaign", "place": "Kerala, India", "years": "1996 to 2001", "summary": "The state devolved 35 to 40 percent of its development budget to local governments. Village assemblies in every ward set priorities, and volunteers trained in large numbers helped draw up local plans.", "lesson": "Moving money and authority closer to people works when it comes with mass learning, so residents can actually use the power they are given.", "note": "Quality varied by place; later governments kept the structures but some of the campaign energy faded.", "pathways": ["public-policy-and-government-innovation", "critical-and-popular-education"], "sources": [{"t": "Isaac and Franke: Local Democracy and Development (book summary)", "u": "https://msuweb.montclair.edu/~franker/isaacbook.htm"}, {"t": "Building local democracy: evaluating decentralization in Kerala (World Development)", "u": "https://www.sciencedirect.com/science/article/abs/pii/S0305750X06002269"}]}, {"id": "imagine-chicago", "title": "Imagine Chicago", "place": "Chicago, United States", "years": "1992 onward", "summary": "Young people, paired with adult mentors, interviewed business, civic, and cultural leaders about what gives the city life and what they hoped for, using Appreciative Inquiry questions.", "lesson": "Asking what already works, and letting young people ask, can open conversations that problem-focused planning shuts down.", "note": "Results are mostly told as stories by the organizers; the model spread to other cities.", "pathways": ["appreciative-inquiry"], "sources": [{"t": "Imagine Chicago: the early story", "u": "https://www.imaginechicago.org/founders-story"}, {"t": "Imagine Chicago (Appreciative Inquiry Commons)", "u": "https://aicommons.champlain.edu/educational-material/imagine-chicago-2/"}]}, {"id": "gds", "title": "Government Digital Service and GOV.UK", "place": "United Kingdom", "years": "2011 onward", "summary": "A new team in the Cabinet Office replaced hundreds of government websites with one, GOV.UK, built around user needs, user research, and small multidisciplinary teams working in the open.", "lesson": "Service design changes government when it comes with the authority to say no to old contracts and the skills to build in-house.", "note": "Its influence peaked in the early 2010s; later reviews describe a loss of central authority and uneven adoption.", "pathways": ["service-design", "government-plumbing"], "sources": [{"t": "UK Government Digital Service: moving beyond a website (Harvard Kennedy School case)", "u": "https://case.hks.harvard.edu/uk-government-digital-service-moving-beyond-a-website/"}, {"t": "The UK government's digital transformation: how did it come about? (Economics Observatory)", "u": "https://www.economicsobservatory.com/the-uk-governments-digital-transformation-how-did-it-come-about"}]}, {"id": "fals-borda", "title": "Participatory action research on Colombia's Caribbean coast", "place": "Córdoba, Colombia", "years": "1972 to 1975", "summary": "Orlando Fals Borda and La Rosca worked with the national peasant users' association to research land struggles with peasants, not about them, and returned the findings in forms people could use.", "lesson": "Research can be a tool for the people it studies when they set the questions and own the results.", "note": "Historians, notably Joanne Rappaport, show how messy and contested the early practice was.", "pathways": ["action-research", "critical-and-popular-education"], "sources": [{"t": "The participatory research of Orlando Fals Borda (Participatory Methods, IDS)", "u": "https://www.participatorymethods.org/resource/the-participatory-research-of-orlando-fals-borda/"}, {"t": "Joanne Rappaport: Cowards Don't Make History (Duke University Press)", "u": "https://read.dukeupress.edu/books/book/2805/Cowards-Don-t-Make-HistoryOrlando-Fals-Borda-and"}]}, {"id": "ddo", "title": "Deliberately developmental organizations", "place": "United States", "years": "Studied 2011 to 2016", "summary": "Robert Kegan and Lisa Lahey studied companies such as Decurion that build personal growth into daily work, for example by making weaknesses and mistakes openly discussable.", "lesson": "Adult development can be part of how work is organized, not just a training course.", "note": "The evidence comes from a small number of firms studied by the theory's authors.", "pathways": ["adult-development-and-immunity-to-change"], "sources": [{"t": "Kegan, Lahey et al.: Making Business Personal (HBR, April 2014)", "u": "https://hbr.org/2014/04/making-business-personal"}, {"t": "On deliberately developmental organizations (Harvard Graduate School of Education)", "u": "https://www.gse.harvard.edu/ideas/news/14/04/deliberately-developmental-organizations"}]}, {"id": "embrace", "title": "Embrace infant warmer", "place": "Stanford, United States, and India", "years": "2007 onward", "summary": "Students in Stanford's Design for Extreme Affordability class were asked for a cheaper incubator. Field visits showed many babies died far from hospitals, so they designed a warmer that works without steady power.", "lesson": "Watching how people actually live can change the question you are answering, not just the answer.", "note": "Embrace later had to change its business model to reach scale; design alone did not solve distribution.", "pathways": ["design-thinking"], "sources": [{"t": "Embrace Innovations (Wikipedia)", "u": "https://en.wikipedia.org/wiki/Embrace_Innovations"}]}, {"id": "strive", "title": "Strive Partnership", "place": "Cincinnati and Northern Kentucky, United States", "years": "2006 onward", "summary": "School districts, universities, funders, businesses, and nonprofits agreed on shared goals and measures for children from cradle to career, with a backbone team to coordinate them.", "lesson": "Organizations that each own one piece of a problem can coordinate when they share data and a common agenda.", "note": "The case that launched the Collective Impact model; later critiques say it underplayed community voice and power.", "pathways": ["collaboration-across-boundaries", "measurement-and-accountability"], "sources": [{"t": "Kania and Kramer: Collective Impact (SSIR, 2011)", "u": "https://ssir.org/articles/entry/collective_impact"}, {"t": "StriveTogether: reinventing the local education ecosystem (Harvard Business School case, PDF)", "u": "https://www.strivetogether.org/wp-content/uploads/2017/03/StriveTogether-Reinventing-the-Local-Education-Ecosystem-314-031.pdf"}]}, {"id": "reframing-aging", "title": "Reframing Aging", "place": "United States", "years": "2015 onward", "summary": "FrameWorks researched how Americans think about getting older, then worked with aging organizations to change the words and metaphors they used, such as 'older people' and 'building momentum'.", "lesson": "Narrative change is slow, research-led, and collective: many organizations telling a new story the same way.", "note": "FrameWorks links the shift to later policy, such as Colorado's 2023 Job Application Fairness Act; attribution is its own.", "pathways": ["narrative-change"], "sources": [{"t": "FrameWorks: Impact spotlight, aging and ageism", "u": "https://www.frameworksinstitute.org/impact-stories/impact-spotlight-aging-and-ageism/"}, {"t": "Finding the Frame: research report (FrameWorks, 2017, PDF)", "u": "https://www.frameworksinstitute.org/app/uploads/2020/05/aging_research_report_final_2017.pdf"}]}, {"id": "artificial-anasazi", "title": "Artificial Anasazi", "place": "Long House Valley, Arizona, United States", "years": "Model published 2002", "summary": "Researchers at the Santa Fe Institute and Brookings built an agent-based model of Ancestral Puebloan households from 800 to 1350 and compared it with archaeological records.", "lesson": "Simple rules for many varied agents can reproduce real population patterns, and show which explanations for a collapse hold up.", "note": "The model matched growth well but not the final abandonment, suggesting social reasons beyond the environment.", "pathways": ["the-formal-science-of-complex-systems"], "sources": [{"t": "Axtell et al.: Population growth and collapse in a multiagent model (PubMed)", "u": "https://pubmed.ncbi.nlm.nih.gov/12011406/"}, {"t": "Artificial Anasazi model code (CoMSES)", "u": "https://www.comses.net/codebases/2222/releases/1.1.0/"}]}, {"id": "outward-bound", "title": "Outward Bound", "place": "Aberdyfi, Wales", "years": "1941 onward", "summary": "Shipping owner Lawrence Holt and educator Kurt Hahn started month-long courses of sailing, expeditions, and rescue training for young seamen during the Second World War.", "lesson": "Learning by doing hard things together, then reflecting on them, builds capacities a classroom can't.", "note": "", "pathways": ["experiential-learning-and-reflective-practice"], "sources": [{"t": "Outward Bound (Wikipedia)", "u": "https://en.wikipedia.org/wiki/Outward_Bound"}, {"t": "Outward Bound USA: history", "u": "https://www.outwardbound.org/about-us/outward-bound-history/"}]}, {"id": "reentry", "title": "Women's re-entry programs study", "place": "New York, New Jersey, California, and Washington, United States", "years": "1975 to 1978", "summary": "Jack Mezirow and Victoria Marsick studied 83 women returning to college in 12 programs and found many went through a 'perspective transformation' in how they saw themselves and their roles.", "lesson": "Adults change most deeply when a disorienting experience meets reflection and support from others going through the same thing.", "note": "The founding study of transformative learning; later scholars questioned how universal its ten phases are.", "pathways": ["transformative-learning"], "sources": [{"t": "Mezirow and Marsick: Education for Perspective Transformation (Semantic Scholar)", "u": "https://www.semanticscholar.org/paper/Education-for-Perspective-Transformation.-Women's-Mezirow-Marsick/a8cbf0444d3c73f343eb221d81ca150bf403b2bf"}, {"t": "Jack Mezirow (Wikipedia)", "u": "https://en.wikipedia.org/wiki/Jack_Mezirow"}]}, {"id": "eureka", "title": "Xerox Eureka", "place": "France and worldwide", "years": "1990s", "summary": "Anthropologist Julian Orr found copier technicians learned mostly by swapping stories. Xerox PARC then built Eureka, a peer-reviewed database of technicians' own repair tips, credited to their authors.", "lesson": "Communities of practice already exist; support works best when it amplifies how people learn from each other.", "note": "Widely cited in knowledge management; most accounts come from Xerox and PARC.", "pathways": ["communities-of-practice-and-action-learning"], "sources": [{"t": "Eureka! Xerox discovers way to grow community knowledge (KMWorld)", "u": "https://www.kmworld.com/Articles/Editorial/Features/Best-Practices-Eureka!-Xerox-discovers-way-to-grow-community-knowledge.-.-And-customer-satisfaction-9140.aspx"}, {"t": "Field work in the tribal office (MIT Technology Review, 1998)", "u": "https://www.technologyreview.com/1998/05/01/41585/field-work-in-the-tribal-office/"}]}, {"id": "new-britain", "title": "The New Britain workshop", "place": "New Britain, Connecticut, United States", "years": "1946", "summary": "Kurt Lewin's team ran a workshop for community leaders on fair employment. When participants sat in on staff discussions of their own behavior, the group's here-and-now interaction became the learning.", "lesson": "A group studying itself as it happens can learn faster than one studying a topic.", "note": "Led to the National Training Laboratories at Bethel, Maine, in 1947.", "pathways": ["t-groups-and-sensitivity-training"], "sources": [{"t": "Ed Batista: A brief history of T-groups", "u": "https://edbatista.com/2018/06/a-brief-history-of-t-groups.html"}, {"t": "Kurt Lewin: groups, experiential learning and action research (infed)", "u": "https://web.archive.org/web/2025/https://infed.org/dir/welcome/kurt-lewin-groups-experiential-learning-and-action-research/"}]}, {"id": "leicester", "title": "The Leicester Conference", "place": "Leicester, England", "years": "1957 onward", "summary": "The Tavistock Institute's two-week residential conference turns the event itself into a temporary organization, so members can study authority, leadership, and group life as they happen.", "lesson": "Hidden group dynamics such as anxiety and projection become workable once they can be seen in the room.", "note": "Intense by design; some participants find it destabilizing.", "pathways": ["group-relations"], "sources": [{"t": "Tavistock Institute: What is a group relations conference?", "u": "https://tavinstitute.org/news/what-is-a-group-relations-conference-2"}, {"t": "Tavistock Institute: The Leicester Conference", "u": "https://www.tavinstitute.org/projects/group-relations-conferences-leicester-conference/"}]}, {"id": "ten-millennia", "title": "Warning people 10,000 years from now", "place": "United States", "years": "1981 to 1993", "summary": "The US Department of Energy's Human Interference Task Force asked how to mark nuclear waste sites so people thousands of years in the future would not dig there. Semiotician Thomas Sebeok's 1984 report, Communication Measures to Bridge Ten Millennia, treated it as a problem of signs that outlive their language.", "lesson": "No single sign survives that long. Sebeok recommended mixing icons, indexes and symbols, building in heavy redundancy, and relaying the message, re-encoded by each generation, rather than trusting one monument.", "note": "The task force's recommendations were never implemented as such. Sandia's 1993 marker study for the Waste Isolation Pilot Plant built on this work; the final marker design is still being developed.", "pathways": ["semiotics-signs-codes-and-meaning-making", "strategy-under-uncertainty"], "sources": [{"t": "Science History Institute: Speaking to the future", "u": "https://sciencehistory.org/stories/magazine/speaking-to-the-future"}, {"t": "Long Now: Communication measures to bridge 10 millennia", "u": "https://longnow.org/ideas/communication-measures-to-bridge-10-millennia"}]}, {"id": "mink-hiiumaa", "title": "European mink on Hiiumaa and Saaremaa", "place": "Estonia", "years": "2019 to 2021", "summary": "Semioticians at the University of Tartu studied how island communities understood the European mink, an endangered species released on Hiiumaa since 2000, to help plan a further reintroduction on Saaremaa.", "lesson": "An animal carries different meanings for different people. Reading those local meanings, alongside the species' own needs, reduces conflict in reintroduction.", "note": "A research and advisory project; the report gives recommendations rather than measured conservation outcomes.", "pathways": ["biosemiotics-and-the-umwelt", "living-systems-and-regeneration"], "sources": [{"t": "University of Tartu: Reintroduction of the European mink, analysis of the local community's experience", "u": "https://www.serake.ut.ee/en/?p=818"}, {"t": "University of Tartu ecosemiotics group", "u": "https://www.ecosem.ut.ee/en/?p=36"}]}, {"id": "steel-dialogue", "title": "Dialogue at a steel mill", "place": "United States", "years": "Early 1990s", "summary": "The MIT Dialogue Project, led by William Isaacs, worked with union and management at a steel mill whose relationship had been adversarial for about fifty years. They met in dialogue, with no deal on the table, to look at how they thought about each other.", "lesson": "Participants said they had learned to question the labels they applied to each other, and found they had more in common than they expected. Dialogue changed the relationship that later negotiations ran through.", "note": "Reported by the project's own lead, without independent evaluation or long-term follow-up. The source does not name the plant.", "pathways": ["bohm-dialogue", "conflict-transformation"], "sources": [{"t": "William Isaacs: Dialogue, the power of collective thinking (The Systems Thinker)", "u": "https://thesystemsthinker.com/dialogue-the-power-of-collective-thinking"}, {"t": "The art of dialogue (MIT)", "u": "https://betterworld.mit.edu/spectrum/issues/winter-2001/the-art-of-dialogue/"}]}, {"id": "trojan-warrior", "title": "The Trojan Warrior Project", "place": "United States", "years": "1985", "summary": "A six-month US Army Special Forces experiment that taught a group of Green Berets aikido, meditation and body awareness alongside their training. Richard Strozzi-Heckler was one of the civilian teachers.", "lesson": "Body-based awareness can be taught as a skill inside a demanding institution, not just practised privately. It also shows how such practices get absorbed into whatever purpose the institution already has.", "note": "Results were mixed by the soldiers' own accounts, and no formal evaluation was published. Strozzi-Heckler's account is a first-person book.", "pathways": ["somatic-and-embodied-practice"], "sources": [{"t": "Richard Strozzi-Heckler (Wikipedia)", "u": "https://en.wikipedia.org/wiki/Richard_Strozzi-Heckler"}, {"t": "In Search of the Warrior Spirit (North Atlantic Books)", "u": "https://www.northatlanticbooks.com/shop/in-search-of-the-warrior-spirit-fourth-edition/"}]}, {"id": "after-chernobyl", "title": "Despair and empowerment work after Chernobyl", "place": "Russia and Ukraine", "years": "1990s", "summary": "Joanna Macy took her workshops on despair and empowerment in the nuclear age to the former Soviet Union after the 1986 Chernobyl accident, including a 1992 workshop in Russia for people living with its effects.", "lesson": "Naming grief and fear together, in communities living with long-term contamination, helped turn paralysis into the energy to act and care for each other.", "note": "Documented mainly in tributes and practitioner accounts; there is no independent study of outcomes.", "pathways": ["work-that-reconnects"], "sources": [{"t": "Tricycle: Remembering Joanna Macy", "u": "https://tricycle.org/article/remembering-joanna-macy/"}, {"t": "Believe.Earth: Joanna Macy, pain as inspiration", "u": "https://believe.earth/en/joanna-macy-pain-as-inspiration/"}]}, {"id": "zero-step", "title": "Zero Step Warm Data Project", "place": "United Nations (online)", "years": "2021", "summary": "Alongside the formal working groups of the UN High-Level Dialogue on Energy, UNDP and the International Bateson Institute co-chaired a Warm Data process, People Need People Online, to help participants see how energy access is tangled up with family, health, economy and culture.", "lesson": "A Warm Data process can sit beside a formal policy process without replacing it, giving people a different way to perceive the same issue.", "note": "The public record is an event notice; we found no published account of what changed as a result.", "pathways": ["nora-bateson-and-warm-data"], "sources": [{"t": "UN: Zero Step Warm Data Project (side event notice)", "u": "https://www.un.org/sites/un2.un.org/files/04_zero_step_warm_data_project.docx"}]}, {"id": "te-awa-tupua", "title": "Te Awa Tupua, the Whanganui River", "place": "Aotearoa New Zealand", "years": "2017 onward", "summary": "A Treaty of Waitangi settlement with Whanganui iwi recognised the river, from the mountains to the sea with its physical and metaphysical elements, as an indivisible living whole and a legal person. Two guardians, one named by iwi and one by the Crown, act as its human face.", "lesson": "Law can be rewritten to start from relationship: the river is treated as an ancestor and a whole, not a set of resources divided among owners.", "note": "Implementation is slow and contested, and legal personhood is a Western tool that only partly expresses the iwi's relationship with the river.", "pathways": ["indigenous-and-land-based-knowledge", "relational-transcontextual-and-post-humanist-knowing"], "sources": [{"t": "Te Awa Tupua (Whanganui River Claims Settlement) Act 2017", "u": "https://legislation.govt.nz/act/public/2017/7/en/latest/"}, {"t": "Whanganui District Council: Te Awa Tupua", "u": "https://whanganui.govt.nz/About-Whanganui/Our-District/Te-Awa-Tupua-Whanganui-River-Settlement"}]}, {"id": "finland-phenomena", "title": "Phenomenon-based learning in Finland's core curriculum", "place": "Finland", "years": "2016 onward", "summary": "Finland's national curriculum, in force from 2016, requires every school to run at least one multidisciplinary learning module each year, where pupils help plan and study a real theme across subject boundaries, alongside transversal competences.", "lesson": "An education system can build in time to study whole, real-world problems without abandoning subjects.", "note": "Early media reports that Finland had scrapped subjects were wrong; how deeply schools use the modules varies.", "pathways": ["complexity-and-education", "experiential-learning-and-reflective-practice"], "sources": [{"t": "Finnish National Agency for Education: New national core curriculum for basic education (PDF)", "u": "https://www.oph.fi/sites/default/files/documents/new-national-core-curriculum-for-basic-education.pdf"}, {"t": "Phenomenon-based learning in Finland: a critical overview (Cogent Education, 2024)", "u": "https://www.tandfonline.com/doi/full/10.1080/2331186X.2024.2309733"}]}, {"id": "wales-future-generations", "title": "Well-being of Future Generations Act", "place": "Wales", "years": "2015 onward", "summary": "Wales made long-term thinking a legal duty: public bodies must pursue seven linked well-being goals using five ways of working (long term, prevention, integration, collaboration, involvement), overseen by a Future Generations Commissioner.", "lesson": "Treating environmental, social and cultural crises as one pattern can be written into law, so that decisions are judged against the long term and against each other.", "note": "How far it changes real decisions is debated, and its duties are hard to enforce in court.", "pathways": ["the-metacrisis-and-meaning", "public-policy-and-government-innovation"], "sources": [{"t": "Well-being of Future Generations (Wales) Act 2015 (legislation.gov.uk)", "u": "https://www.legislation.gov.uk/anaw/2015/2/contents"}, {"t": "Well-being of Future Generations (Wales) Act 2015 (Wikipedia)", "u": "https://en.wikipedia.org/wiki/Well-being_of_Future_Generations_(Wales)_Act_2015"}]}], "people": [{"name": "Joanna Macy", "years": "1929–2025", "kind": "person", "status": "checked", "src": "https://en.wikipedia.org/wiki/Joanna_Macy", "slug": "joanna-macy", "appears": ["relational-transcontextual-and-post-humanist-knowing", "living-systems-and-regeneration", "work-that-reco stice"], "born": 1945, "died": null, "founded": null, "profile": null}, {"name": "Geoff Mulgan", "years": "b. 1961", "kind": "person", "status": "checked", "src": "https://en.wikipedia.org/wiki/Geoff_Mulgan", "slug": "geoff-mulgan", "appears": ["public-policy-and-government-innovation", "strategic-design-and-policy-labs"], "born": 1961, "died": null, "founded": null, "profile": null}, {"name": "Howard Zehr", "years": "b. 1944", "kind": "person", "status": "checked", "src": "https://en.wikipedia.org/wiki/Howard_Zehr", "slug": "howard-zehr", "appears": ["conflict-transformation"], "born": 1944, "died": null, "founded": null, "profile": null}, {"name": "Jennifer Pahlka", "years": "b. 1969", "kind": "person", "status": "checked", "src": "https://en.wikipedia.org/wiki/Jennifer_Pahlka", "slug": "jennifer-pahlka", "appears": ["government-plumbing"], "born": 1969, "died": null, "founded": null, "profile": null}, {"name": "John Gaventa", "years": "b. 1949", "kind": "person", "status": "checked", "src": "https://en.wikipedia.org/wiki/John_Gaventa", "slug": "john-gaventa", "appears": ["power-analysis"], "born": 1949, "died": null, "founded": null, "profile": null}, {"name": "Jonathan Rowson", "years": "b. 1977", "kind": "person", "status": "checked", "src": "https://en.wikipedia.org/wiki/Jonathan_Rowson", "slug": "jonathan-rowson", "appears": ["the-metacrisis-and-meaning"], "born": 1977, "died": null, "founded": null, "profile": null}, {"name": "Marshall Ganz", "years": "b. 1943", "kind": "person", "status": "checked", "src": "https://en.wikipedia.org/wiki/Marshall_Ganz", "slug": "marshall-ganz", "appears": ["narrative-change"], "born": 1943, "died": null, "founded": null, "profile": null}, {"name": "Michael Tushman", "years": "b. 1947", "kind": "person", "status": "checked", "src": "https://en.wikipedia.org/wiki/Michael_Tushman", "slug": "michael-tushman", "appears": ["corporate-innovation-and-renewal"], "born": 1947, "died": null, "founded": null, "profile": null}, {"name": "Nigel Cross", "years": "b. 1942", "kind": "person", "status": "checked", "src": "https://en.wikipedia.org/wiki/Nigel_Cross", "slug": "nigel-cross", "appears": ["design-thinking"], "born": 1942, "died": null, "founded": null, "profile": null}, {"name": "Rebecca Solnit", "years": "b. 1961", "kind": "person", "status": "checked", "src": "https://en.wikipedia.org/wiki/Rebecca_Solnit", "slug": "rebecca-solnit", "appears": ["crisis-disaster-and-high-reliability"], "born": 1961, "died": null, "founded": null, "profile": null}, {"name": "Richard Strozzi-Heckler", "years": "b. 1944", "kind": "person", "status": "checked", "src": "https://en.wikipedia.org/wiki/Richard_Strozzi-Heckler", "slug": "richard-strozzi-heckler", "appears": ["somatic-and-embodied-practice"], "born": 1944, "died": null, "founded": null, "profile": null}, {"name": "Jakob von Uexküll", "years": "1864–1944", "kind": "person", "status": "checked", "src": "https://en.wikipedia.org/wiki/Jakob_Johann_von_Uexk%C3%BCll", "slug": "jakob-von-uexk-ll", "appears": ["biosemiotics-and-the-umwelt"], "born": 1864, "died": 1944, "founded": null, "profile": {"known": "Baltic German biologist who gave us the Umwelt: each creature lives in its own world, made of the signs it can sense and act on.", "timeline": [[1864, "Born in Keblaste, in what is now Estonia"], [1909, "Publishes Umwelt und Innenwelt der Tiere (The Environment and Inner World of Animals)"], [1926, "Founds the Institute for Umwelt Research at the University of Hamburg"], [1934, "Publishes A Foray into the Worlds of Animals and Humans, with its famous tick"], [1944, "Dies on Capri"]], "ideas": [["Umwelt", "The world as one organism experiences it: only the things it can sense and act on. A tick lives in a world of three signs: butyric acid, warmth and hair."], ["Functional circle", "Perceiving and acting form a loop between an organism and the things around it, close to what cybernetics later called feedback."]], "questions": [{"target": "Animals as machines", "claim": "Animals are subjects with their own worlds, not machines reacting to stimuli.", "who": "Behaviourists and mechanistic physiologists of his time", "other": "Talk of an animal's inner world cannot be tested; science should describe only behaviour.", "what": "The view, going back to Descartes and strong in early twentieth-century physiology and behaviourism, that animals are complex mechanisms: a stimulus goes in, a response comes out, and there is no need to talk about what the animal experiences or what anything means to it."}, {"target": "His own politics", "claim": "Historians note that his holism was tied to anti-democratic views and, briefly, to sympathy with the early Nazi state, which he later distanced himself from.", "who": "Historians of science such as Anne Harrington (Reenchanted Science, 1996)", "other": "Admirers argue the biology stands apart from the politics and has been taken up by people of every persuasion.", "what": "This is a critique of Uexküll himself rather than of an idea. His holistic biology pictured the state as an organism whose parts should each keep to their function, a picture he used to argue against parliamentary democracy. In the early 1930s he briefly expressed sympathy for the new Nazi state."}], "sources": [["A Foray into the Worlds of Animals and Humans (1934; English 2010)", "Short and illustrated", "https://www.upress.umn.edu/9780816659005/a-foray-into-the-worlds-of-animals-and-humans/"], ["Umwelt (overview)", "Background on the concept", "https://en.wikipedia.org/wiki/Umwelt"]], "ask": ["What does your workplace look like in the Umwelt of someone who uses it?", "Which signs do you not notice that others depend on?"], "checked": [["Life dates", "https://en.wikipedia.org/wiki/Jakob_Johann_von_Uexk%C3%BCll"]], "status": "draft"}}, {"name": "Thomas Sebeok", "years": "1920–2001", "kind": "person", "status": "checked", "src": "https://en.wikipedia.org/wiki/Thomas_Sebeok", "slug": "thomas-sebeok", "appears": ["semiotics-signs-codes-and-meaning-making", "biosemiotics-and-the-umwelt"], "born": 1920, "died": 2001, "founded": null, "profile": null}, {"name": "Jesper Hoffmeyer", "years": "1942–2019", "kind": "person", "status": "checked", "src": "https://en.wikipedia.org/wiki/Jesper_Hoffmeyer", "slug": "jesper-hoffmeyer", "appears": ["biosemiotics-and-the-umwelt"], "born": 1942, "died": 2019, "founded": null, "profile": {"known": "Danish biochemist at the University of Copenhagen and a founder of biosemiotics. Argued that life is built on sign relations, and that the capacity to interpret signs grows through evolution.", "timeline": [[1942, "Born in Denmark"], [1991, "With Claus Emmeche, proposes code duality: life passes on both a digital code (DNA) and an analog one (the living organism)"], [1993, "Publishes En snegl på vejen in Danish"], [1996, "Its English edition, Signs of Meaning in the Universe, becomes a turning point for the field"], [2005, "Becomes the first President of the International Society for Biosemiotic Studies, serving until 2015"], [2008, "Publishes Biosemiotics: An Examination into the Signs of Life and the Life of Signs"], [2019, "Dies on 25 September, aged 77"]], "ideas": [["Semiotic freedom", "How many ways a living thing can respond to the same sign. It tends to grow through evolution, from bacteria following a chemical trail to animals reading each other."], ["Code duality", "Life runs on two codes at once: the digital code of DNA, and the analog code of the living body that reads it and is shaped by its world."], ["Semiosphere", "He stretched Yuri Lotman's word for a culture's world of signs to cover all life: every organism lives inside a web of signs made by others."]], "questions": [{"target": "Codes without interpreters", "claim": "Even the simplest living things interpret signs. Meaning is part of biology from the start, not something added later by minds.", "who": "Marcello Barbieri (code biology)", "other": "The genetic code and other organic codes are fixed rules of correspondence. They need no interpreter, and interpretation appears only in more complex animals.", "more": [["Code biology, Wikipedia", "https://en.wikipedia.org/wiki/Code_biology", "Barbieri's alternative, which split from Peircean biosemiotics"], ["Biosemiotics, Wikipedia", "https://en.wikipedia.org/wiki/Biosemiotics", "Overview of the field and its schools"]], "what": "Code biology, developed by Marcello Barbieri, holds that life is built on organic codes such as the genetic code: fixed rules that match one set of molecules to another, like a dictionary. In his view these codes work without anyone interpreting them, and meaning in the full sense only arrives later, with animals that have minds."}, {"target": "Information talk in molecular biology", "claim": "Biology already speaks of genes as information, messages and codes. Taking that language seriously means admitting that something reads them.", "who": "Mainstream molecular biology", "other": "Information is a useful shorthand. The chemistry explains what happens, and calling it meaning adds nothing testable.", "what": "Since the 1950s molecular biologists have described DNA as carrying information, genes as instructions, and cells as reading, copying and translating messages. Most biologists treat this language as a convenient metaphor for chemical processes rather than a claim that cells understand anything."}], "sources": [["Signs of Meaning in the Universe (1996)", "His best-known book, Indiana University Press"], ["Biosemiotics: An Examination into the Signs of Life and the Life of Signs (2008)", "The fuller statement"], ["International Society for Biosemiotic Studies", "The society he led", "https://biosemiotics.org/"], ["Emmeche, Favareau and Kull: Jesper Hoffmeyer 1942–2019", "Obituary in Biosemiotics 12 (2019)", "https://philpapers.org/rec/EMMJH"]], "ask": ["Does a bacterium following sugar \"interpret\" anything, or is that just a figure of speech?", "If meaning goes all the way down, what changes about how you treat other living things?", "Where would you draw the line between a signal and a sign?"], "checked": [["Life dates and ISBS presidency (2005–2015)", "https://philpapers.org/rec/EMMJH"], ["ISBS founding in 2005", "https://en.wikipedia.org/wiki/International_Society_for_Biosemiotic_Studies"]], "status": "draft"}}, {"name": "Kalevi Kull", "years": "b. 1952", "kind": "person", "status": "checked", "src": "https://en.wikipedia.org/wiki/Kalevi_Kull", "slug": "kalevi-kull", "appears": ["biosemiotics-and-the-umwelt"], "born": 1952, "died": null, "founded": null, "profile": null}, {"name": "Terrence Deacon", "years": "b. 1950", "kind": "person", "status": "checked", "src": "https://en.wikipedia.org/wiki/Terrence_Deacon", "slug": "terrence-deacon", "appears": ["biosemiotics-and-the-umwelt"], "born": 1950, "died": null, "founded": null, "profile": null}, {"name": "Charles Sanders Peirce", "years": "1839–1914", "kind": "person", "status": "checked", "src": "https://en.wikipedia.org/wiki/Charles_Sanders_Peirce", "slug": "charles-sanders-peirce", "appears": ["semiotics-signs-codes-and-meaning-making", "biosemiotics-and-the-umwelt"], "born": 1839, "died": 1914, "founded": null, "profile": {"known": "American philosopher and scientist. Founded pragmatism and the modern theory of signs.", "timeline": [[1839, "Born in Cambridge, Massachusetts"], [1859, "Begins three decades of work for the US Coast Survey"], [1867, "Publishes On a New List of Categories, the root of his sign theory"], [1878, "Publishes How to Make Our Ideas Clear, a founding text of pragmatism"], [1914, "Dies in Milford, Pennsylvania, poor and largely unpublished"]], "ideas": [["Icon, index, symbol", "Signs work by resemblance (a map), by real connection (smoke means fire) or by convention (a word)."], ["Semiosis", "Meaning is a three-way process between a sign, what it stands for and the interpretation it produces, which is itself a new sign."], ["Abduction", "Reasoning to the best guess: forming a hypothesis that would explain a surprise."], ["Fallibilism", "Any belief might be wrong, so inquiry never closes."]], "questions": [{"target": "Two-part theories of the sign", "claim": "A sign is not just a word and a meaning: interpretation is a third part, and it keeps going.", "who": "Followers of Saussure's signifier and signified", "other": "A two-part model is simpler and was more useful for studying language as a system.", "what": "Ferdinand de Saussure's model of the sign has two sides: the signifier (a sound or written form) and the signified (the concept it calls up), joined by convention within a language. It became the basis of structuralism in linguistics, anthropology and cultural studies."}], "sources": [["Peirce's theory of signs (Stanford Encyclopedia of Philosophy)", "Clear overview", "https://plato.stanford.edu/entries/peirce-semiotics/"], ["How to Make Our Ideas Clear (1878)", "Short essay"]], "ask": ["Which signs in your work are icons, which indexes, which symbols?", "Where are you using abduction without calling it that?"], "checked": [["Life dates", "https://en.wikipedia.org/wiki/Charles_Sanders_Peirce"]], "status": "draft"}}, {"name": "Ferdinand de Saussure", "years": "1857–1913", "kind": "person", "status": "checked", "src": "https://en.wikipedia.org/wiki/Ferdinand_de_Saussure", "slug": "ferdinand-de-saussure", "appears": ["semiotics-signs-codes-and-meaning-making"], "born": 1857, "died": 1913, "founded": null, "profile": null}, {"name": "Yuri Lotman", "years": "1922–1993", "kind": "person", "status": "checked", "src": "https://en.wikipedia.org/wiki/Yuri_Lotman", "slug": "yuri-lotman", "appears": ["semiotics-signs-codes-and-meaning-making"], "born": 1922, "died": 1993, "founded": null, "profile": null}, {"name": "Umberto Eco", "years": "1932–2016", "kind": "person", "status": "checked", "src": "https://en.wikipedia.org/wiki/Umberto_Eco", "slug": "umberto-eco", "appears": ["semiotics-signs-codes-and-meaning-making"], "born":
