s literacy", "policy": "Scenario work before long-lived infrastructure or budget commitments, and mapping which public capabilities are commodity versus genuinely new before procuring them.", "links": [{"t": "Pierre Wack: Scenarios, Uncharted Waters Ahead (HBR)", "u": "https://hbr.org/1985/09/scenarios-uncharted-waters-ahead"}, {"t": "Learn Wardley Mapping: Simon's book", "u": "https://archive.learnwardleymapping.com/book.html"}, {"t": "Adam Kahane: Transformative Scenario Planning (SSIR excerpt)", "u": "https://ssir.org/books/excerpts/entry/transformative_scenario_planning_working_together_to_change_the_future"}], "terms": ["strategy", "scenario", "wardley", "uncertainty", "foresight", "antifragil"], "caps": ["Futures Thinking & Foresight", "Complex Problem Solving"], "id": "strategy-under-uncertainty", "orgs": ["iff", "reos", "wardley"], "cases": ["rahs", "mont-fleur", "ten-millennia"], "gov": false, "reading": [], "short": "strat", "short_name": "Strategy under uncertainty", "family": "sci", "sectors": ["biz", "gov"], "scales": ["org"], "work_kinds": ["adm"], "goals": ["uncertain"], "lens": "Complexity as an open future: plans must hold up across several possible worlds, and strategy is a way of noticing and responding, not a fixed route.", "lens_status": "draft", "explainer": ["Strategy under uncertainty starts from an honest admission: nobody can predict the future well enough to plan around a single forecast. Instead, it uses tools that prepare an organization for several futures at once.", "Scenarios rehearse plausible futures so leaders notice early signs. Wardley Maps show how the parts of a business or service evolve from new to commodity, so you know what to build and what to buy. Antifragility asks how to design things that gain from shocks rather than break."], "practice": ["Write two to four scenarios with people who disagree, then ask what you would do in each.", "Draw a Wardley Map of one service: what users need, and how evolved each component is.", "List decisions that are hard to reverse and slow them down; speed up the easy-to-reverse ones.", "Name the early signs that would tell you which scenario is unfolding, and watch for them."], "sector_notes": {"biz": "Shell's scenarios are the classic case; Wardley Mapping is widely used in tech strategy.", "ngo": "Scenarios help charities plan when funding and policy may shift sharply.", "health": "Pandemic preparedness is scenario work; the plans that held up were the flexible ones.", "edu": "Universities use scenarios to think about demographics and technology.", "com": "Transformative scenario planning brought opposing groups together in South Africa."}, "key_ideas": [{"term": "scenario planning", "defn": "Rehearsing several plausible futures to make better decisions now."}, {"term": "wardley mapping", "defn": "A map of a value chain showing how each component evolves from novel to commodity."}, {"term": "antifragility", "defn": "Nassim Taleb's word for things that get stronger from shocks and stress."}, {"term": "optionality", "defn": "Keeping choices open so you can act when the future becomes clearer."}, {"term": "transformative scenario planning", "defn": "Adam Kahane's method where opponents build scenarios together to change the situation, not just adapt to it."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "Pierre Wack", "note": "Shell scenarios", "years": "1922–1997", "people": ["Pierre Wack"]}, {"name": "Adam Kahane", "note": "transformative scenario planning", "years": "", "people": []}, {"name": "Simon Wardley", "note": "Wardley Mapping", "years": "", "people": []}, {"name": "Nassim Nicholas Taleb", "note": "antifragility", "years": "b. 1960", "people": ["Nassim Nicholas Taleb"]}]}, {"name": "Funding and budgeting for adaptation", "cluster": "Strategy, money, and accountability", "kind": "Structure", "overview": "Money that can follow learning. Replaces fixed annual budgets and single big bets with rolling allocation, portfolios of experiments, and funders who trust grantees.", "road": "Jeremy Hope and Robin Fraser (Beyond Budgeting) → Bjarte Bogsnes (Equinor) → UNDP portfolio approach → Trust-Based Philanthropy Project", "mix": "Human Learning Systems, developmental evaluation, Mariana Mazzucato", "policy": "Multi-year flexible funding, portfolio budgets for missions, and grant terms that let providers change course when they learn something.", "links": [{"t": "Bogsnes: Beyond Budgeting at Equinor (Drucker Forum)", "u": "https://www.druckerforum.org/blog/beyond-budgeting-at-equinor-how-to-become-more-adaptive-and-more-humanby-bjarte-bogsnes/"}, {"t": "Trust-Based Philanthropy practices", "u": "https://www.trustbasedphilanthropy.org/practices"}, {"t": "UNDP: portfolio approach to system transformation", "u": "https://medium.com/@undp.innovation/locally-grown-missions-undps-experience-on-portfolio-approach-to-system-transformation-our-bfc4de2ba199"}], "terms": ["budget", "funding", "philanthrop", "grant", "portfolio", "finance", "capital", "investment"], "caps": ["Planning & Resource Mobilization", "Networking & Engaging Capital"], "id": "funding-and-budgeting-for-adaptation", "orgs": ["undp", "tbp"], "cases": ["plymouth", "handelsbanken"], "gov": false, "reading": [], "short": "fund", "short_name": "Funding for adaptation", "family": "sci", "sectors": ["fund", "gov", "ngo"], "scales": ["org", "pol"], "work_kinds": ["adm"], "goals": ["policy"], "lens": "Complexity as money that has to adapt: when outcomes are uncertain, funding works best in portfolios and rolling cycles that can follow what is learned.", "lens_status": "draft", "explainer": ["Most money in organizations and government is tied to fixed annual budgets and detailed plans. That makes it hard to change course when you learn something. This pathway collects ways to let money follow learning instead.", "Beyond Budgeting replaces the annual budget with rolling forecasts and decisions made closer to the work. Portfolio approaches fund several experiments at once and move money toward what works. Trust-based philanthropy gives grantees flexible, multi-year money and lighter reporting."], "practice": ["Find one budget line that could move from annual to rolling review.", "Fund three small, different approaches to one problem instead of one big bet.", "Ask a grantee what reporting they would drop if they could, and drop it.", "Agree up front how money will move when you learn something, so changing course is not a failure."], "sector_notes": {"biz": "Handelsbanken and Equinor run without traditional annual budgets.", "ngo": "Unrestricted, multi-year grants let charities adapt; trust-based funders lead this.", "health": "Pooled budgets across health and care follow patients instead of departments.", "edu": "Schools with flexible budgets can respond to what pupils need mid-year.", "com": "Participatory grant-making lets residents decide where community money goes."}, "key_ideas": [{"term": "beyond budgeting", "defn": "Running an organization without fixed annual budgets, using rolling forecasts and devolved decisions."}, {"term": "portfolio approach", "defn": "Funding several linked experiments together and managing them as a whole."}, {"term": "trust-based philanthropy", "defn": "Grant-making built on flexible money, light reporting and shared power with grantees."}, {"term": "rolling forecast", "defn": "A forecast updated regularly instead of fixed once a year."}, {"term": "unrestricted funding", "defn": "Money a grantee can spend on whatever the work needs."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "Jeremy Hope and Robin Fraser", "note": "Beyond Budgeting", "years": "d. 2011", "people": ["Jeremy Hope"]}, {"name": "Bjarte Bogsnes", "note": "Equinor", "years": "", "people": []}, {"name": "UNDP portfolio approach", "note": "", "years": "", "people": []}, {"name": "Trust-Based Philanthropy Project", "note": "", "years": "", "people": []}]}, {"name": "Measurement and accountability", "cluster": "Strategy, money, and accountability", "kind": "Lineage", "overview": "Why targets distort what they measure, and what accountability can look like when outcomes are emergent. Moves from proving results to learning in public.", "road": "Donald Campbell and Charles Goodhart (the laws named after them) → Mark Moore (public value, the strategic triangle) → Jerry Muller (<i>The Tyranny of Metrics<\/i>) → Toby Lowe (accountability for learning)", "mix": "Deming, developmental evaluation, Human Learning Systems", "policy": "Replacing target regimes with learning reviews, reporting what changed and why, and holding services accountable for the health of relationships and systems, not activity counts.", "links": [{"t": "Jerry Muller: The Tyranny of Metrics (Chronicle)", "u": "https://www.chronicle.com/article/the-tyranny-of-metrics/"}, {"t": "Moore's strategic triangle (Atlas of Public Management)", "u": "https://www.atlas101.ca/pm/concepts/moores-strategic-triangle/"}], "terms": ["metric", "measure", "target", "accountab", "kpi", "indicator", "public value", "outcome"], "caps": ["Data Analysis & Evaluation"], "id": "measurement-and-accountability", "orgs": ["hls", "deming"], "cases": ["hls-cases", "strive"], "gov": true, "reading": [], "short": "meas", "short_name": "Measurement and accountability", "family": "sci", "sectors": ["gov", "fund", "ngo"], "scales": ["org", "pol"], "work_kinds": ["adm"], "goals": ["policy"], "lens": "Complexity as outcomes nobody controls alone: numbers can inform learning, but used as targets in a complex system they distort the work they are meant to measure.", "lens_status": "draft", "explainer": ["When a number becomes a target, people start working to the number instead of the purpose behind it. This pathway explains why that happens and what to do instead. Campbell's and Goodhart's laws describe the distortion; Jerry Muller's The Tyranny of Metrics collects the evidence.", "The alternative is not to stop measuring but to measure for learning. Public value thinking asks what a service is for and who it answers to. Accountability for learning holds people to account for reflecting honestly and improving, not for hitting numbers they do not control."], "practice": ["List your targets and ask, for each one, how someone could hit it while making things worse.", "Turn one target into a question you review together: what did we learn, and what will we try next?", "Collect a few stories alongside the numbers so you can see what the numbers miss.", "Ask who the measures are for: the people served, the staff, or the funder."], "sector_notes": {"biz": "Sales targets that encourage mis-selling are a classic case of Goodhart's law.", "ngo": "Funders and charities can agree learning questions instead of output counts.", "health": "Waiting-time targets have led to gaming, such as patients held in ambulances.", "edu": "Test-score targets narrow teaching to the test.", "com": "Community groups can track what matters to members, not just attendance."}, "key_ideas": [{"term": "goodhart's law", "defn": "When a measure becomes a target, it stops being a good measure."}, {"term": "campbell's law", "defn": "The more a number is used for decisions, the more it gets corrupted and corrupts the work."}, {"term": "public value", "defn": "Mark Moore's idea that public managers should create value the public cares about, with legitimacy and capacity to deliver it."}, {"term": "accountability for learning", "defn": "Holding people to account for learning and improving, not for numbers they do not control."}, {"term": "gaming", "defn": "Hitting a target in ways that defeat its purpose."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "Donald Campbell and Charles Goodhart", "note": "the laws named after them", "years": "1916–1996", "people": ["Donald Campbell"]}, {"name": "Mark Moore", "note": "public value, the strategic triangle", "years": "", "people": []}, {"name": "Jerry Muller", "note": "The Tyranny of Metrics", "years": "", "people": []}, {"name": "Toby Lowe", "note": "accountability for learning", "years": "", "people": []}]}, {"name": "Government plumbing", "cluster": "Strategy, money, and accountability", "kind": "Field", "overview": "The rules, contracts, and routines where reluctant bureaucracies actually push back. Procurement, delivery, regulation, and frontline discretion decide whether complexity methods survive.", "road": "Michael Lipsky (<i>Street-Level Bureaucracy<\/i>) → Charles Sabel and Jonathan Zeitlin (experimentalist governance) → relational commissioning (Plymouth Alliance) → Jennifer Pahlka (<i>Recoding America<\/i>)", "mix": "Nesta on anticipatory regulation and sandboxes, Hilary Cottam, service design", "policy": "Alliance contracts instead of payment by results, policy written with delivery teams at the table, regulatory sandboxes, and trusting frontline discretion instead of scripting it away.", "links": [{"t": "Recoding America", "u": "https://www.recodingamerica.us/"}, {"t": "Sabel and Zeitlin: Experimentalist Governance (chapter)", "u": "https://charlessabel.com/papers/Sabel%20and%20Zeitlin%20handbook%20chapter%20final%20(with%20abstract).pdf"}, {"t": "Nesta: Renewing Regulation", "u": "https://www.nesta.org.uk/report/renewing-regulation-anticipatory-regulation-in-an-age-of-disruption/"}], "terms": ["procurement", "commissioning", "regulation", "bureaucra", "delivery", "contract", "sandbox", "government"], "caps": ["Advocacy & Political Participation", "Planning & Resource Mobilization"], "id": "government-plumbing", "orgs": ["hls", "nesta", "recoding"], "cases": ["plymouth", "gds"], "gov": true, "reading": [], "short": "plumb", "short_name": "Government plumbing", "family": "sci", "sectors": ["gov"], "scales": ["org", "pol"], "work_kinds": ["adm"], "goals": ["policy"], "lens": "Complexity in the machinery: rules, contracts and routines interact in ways no one designed, and they quietly decide which new ideas survive.", "lens_status": "draft", "explainer": ["New ideas about complexity often die in the ordinary machinery of government: procurement rules, contracts, budgets, audits, and job descriptions. This pathway is about that machinery, which some people call the plumbing.", "Michael Lipsky showed that frontline workers make policy every day through the choices they make. Experimentalist governance sets broad goals and lets local units find their way, reviewing together. Jennifer Pahlka's Recoding America shows how layers of rules make simple services fail. The lesson: if you want change to last, change the plumbing."], "practice": ["Trace one simple request through every rule and form it touches, and count the steps.", "Ask procurement to sit in on the design of a service, not just the tender.", "Try an alliance contract where providers share one outcome instead of competing.", "Ask frontline staff which rule they work around most, and why."], "sector_notes": {"biz": "Suppliers to government live with this plumbing and can help redesign contracts.", "ngo": "Charities feel the effects of short contracts and payment by results.", "health": "Commissioning rules decide whether health and care can work as one.", "edu": "Funding formulas and inspection regimes shape what schools can try.", "com": "Grant rules and licensing decide whether community groups can act quickly."}, "key_ideas": [{"term": "street-level bureaucracy", "defn": "Michael Lipsky's insight that frontline workers effectively make policy through daily choices."}, {"term": "experimentalist governance", "defn": "Set broad goals centrally, let local units try ways to meet them, and review together."}, {"term": "relational commissioning", "defn": "Buying services through ongoing relationships and shared goals rather than fixed specifications."}, {"term": "alliance contract", "defn": "One contract where several providers share responsibility for an outcome."}, {"term": "regulatory sandbox", "defn": "A safe space where new approaches can be tested under relaxed rules with close watching."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "Michael Lipsky", "note": "Street-Level Bureaucracy", "years": "b. 1940", "people": ["Michael Lipsky"]}, {"name": "Charles Sabel and Jonathan Zeitlin", "note": "experimentalist governance", "years": "b. 1947", "people": ["Charles Sabel"]}, {"name": "relational commissioning", "note": "Plymouth Alliance", "years": "", "people": []}, {"name": "Jennifer Pahlka", "note": "Recoding America", "years": "b. 1969", "people": ["Jennifer Pahlka"]}]}, {"name": "Teams and learning cultures", "cluster": "Strategy, money, and accountability", "kind": "Method", "overview": "The team-level conditions that let people surface bad news, learn fast, and organize around flow instead of hierarchy.", "road": "Amy Edmondson (psychological safety, teaming) → Jeff Gothelf and Josh Seiden (<i>Sense and Respond<\/i>) → Matthew Skelton and Manuel Pais (<i>Team Topologies<\/i>)", "mix": "Deming, sociocracy, T-groups", "policy": "Blameless reviews in public agencies, product teams that own a service end to end, and outcomes over outputs in digital delivery.", "links": [{"t": "Amy Edmondson: Building a psychologically safe workplace (TEDx)", "u": "https://www.youtube.com/watch?v=LhoLuui9gX8"}, {"t": "Team Topologies key concepts", "u": "https://teamtopologies.com/key-concepts"}], "terms": ["team", "psychological safety", "edmondson", "topolog", "agile", "outcomes over outputs"], "caps": ["Leading in Complexity", "Organizing & Facilitating"], "id": "teams-and-learning-cultures", "orgs": ["teamtop"], "cases": ["buurtzorg"], "gov": false, "reading": [], "short": "teams", "short_name": "Teams and learning cultures", "family": "sci", "sectors": ["biz", "gov"], "scales": ["grp", "org"], "work_kinds": ["adm"], "goals": ["others"], "lens": "Complexity in the team: learning depends on people speaking up and on how teams connect, so the structure of conversations matters as much as the structure of tasks.", "lens_status": "draft", "explainer": ["Most complex work happens in teams. This pathway is about the conditions that let a team learn: people feel safe to raise problems and admit mistakes, the team is organized around the flow of work, and it measures success by outcomes for users rather than tasks finished.", "Amy Edmondson's research on psychological safety showed that the best hospital teams reported more errors, because they talked about them. Team Topologies offers a few simple team types and ways they interact. Sense and Respond applies these ideas to whole organizations."], "practice": ["Start a meeting by inviting the problem nobody has raised yet, and thank whoever raises it.", "Run a blameless review of something that went wrong: what happened, what made sense at the time, what will change.", "Ask the team what outcome for users it is trying to change this quarter.", "Map how your team depends on others and cut one handoff."], "sector_notes": {"biz": "Common in tech and product teams; Google's Project Aristotle highlighted psychological safety.", "ngo": "Small teams under pressure benefit from blameless reviews and clear outcomes.", "health": "Edmondson's research began in hospital teams; speaking up saves lives.", "edu": "Teaching teams that share failures openly improve faster.", "com": "Volunteer groups need the same safety to raise problems early."}, "key_ideas": [{"term": "psychological safety", "defn": "A shared belief that the team is safe for speaking up, asking questions and admitting mistakes."}, {"term": "blameless review", "defn": "Looking at what went wrong to learn, without seeking someone to punish."}, {"term": "team topologies", "defn": "A small set of team types and ways of interacting, to organize around the flow of work."}, {"term": "outcomes over outputs", "defn": "Judging work by the change it makes for people, not by how much was produced."}, {"term": "teaming", "defn": "Edmondson's word for forming and working in teams on the fly."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "Amy Edmondson", "note": "psychological safety, teaming", "years": "b. 1959", "people": ["Amy Edmondson"]}, {"name": "Jeff Gothelf and Josh Seiden", "note": "Sense and Respond", "years": "", "people": []}, {"name": "Matthew Skelton and Manuel Pais", "note": "Team Topologies", "years": "", "people": []}]}, {"name": "Corporate innovation and renewal", "cluster": "Strategy, money, and accountability", "kind": "Field", "overview": "How established organizations explore new value while running the current business, and when they need to break apart into smaller self-managing units.", "road": "Clayton Christensen (disruptive innovation) → Charles O'Reilly and Michael Tushman (ambidextrous organization) → Henry Chesbrough (open innovation) → Haier (RenDanHeYi microenterprises)", "mix": "Buurtzorg, Beyond Budgeting, Wardley Mapping", "policy": "Public agencies face the same exploit and explore tension: protected space for new services without starving the ones residents rely on today.", "links": [{"t": "What Is Disruptive Innovation? (HBR)", "u": "https://hbr.org/2015/12/what-is-disruptive-innovation"}, {"t": "The Ambidextrous Organization (HBR)", "u": "https://hbr.org/2004/04/the-ambidextrous-organization"}, {"t": "Corporate Rebels on RenDanHeYi", "u": "https://www.corporate-rebels.com/blog/rendanheyi-forum"}], "terms": ["innovation", "disrupt", "ambidext", "corporate", "business model", "startup", "entrepreneur"], "caps": ["Experimenting & Building", "Leading in Complexity"], "id": "corporate-innovation-and-renewal", "orgs": ["corprebels"], "cases": ["buurtzorg", "handelsbanken", "haier"], "gov": false, "reading": [], "short": "corp", "short_name": "Corporate innovation", "family": "sci", "sectors": ["biz"], "scales": ["org"], "work_kinds": ["adm"], "goals": ["uncertain"], "lens": "Complexity as constant renewal: an organization is a living system that must keep exploring while exploiting what works, or its environment will move on without it.", "lens_status": "draft", "explainer": ["Established organizations are good at running what they already do and bad at inventing what comes next. This pathway collects research on why, and on how some have managed both.", "Disruptive innovation explains how newcomers win by starting where incumbents are not looking. Ambidextrous organizations protect new units from the old ones while sharing what helps. Open innovation looks outside for ideas. Haier's microenterprises go furthest, breaking a giant firm into thousands of small self-managing businesses."], "practice": ["Split your work into run and explore, and protect a small budget for exploring.", "Ask where a cheaper, simpler competitor could start today, and talk to those customers.", "Invite one outside partner to solve a problem you have kept internal.", "Try a small unit with its own customers and its own profit and loss."], "sector_notes": {"biz": "This is home ground: Christensen, O'Reilly and Tushman, Chesbrough and Haier.", "ngo": "Large charities face the same tension between their core programmes and new approaches.", "health": "Health systems need protected space for new models of care alongside the old.", "edu": "Universities set up separate units for online learning to avoid being smothered.", "com": "Community groups can spin off new projects without risking the core."}, "key_ideas": [{"term": "disruptive innovation", "defn": "When a simpler, cheaper offer starts at the bottom of a market and moves up until it displaces leaders."}, {"term": "ambidexterity", "defn": "Running the current business well while exploring new ones."}, {"term": "open innovation", "defn": "Using ideas and partners from outside the organization."}, {"term": "rendanheyi", "defn": "Haier's model of thousands of small, self-managing units close to customers."}, {"term": "exploit and explore", "defn": "The tension between using what works and searching for what might work."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "Clayton Christensen", "note": "disruptive innovation", "years": "1952–2020", "people": ["Clayton Christensen"]}, {"name": "Charles O'Reilly and Michael Tushman", "note": "ambidextrous organization", "years": "b. 1947", "people": ["Michael Tushman"]}, {"name": "Henry Chesbrough", "note": "open innovation", "years": "b. 1956", "people": ["Henry Chesbrough"]}, {"name": "Haier", "note": "RenDanHeYi microenterprises", "years": "", "people": []}]}, {"name": "Collaboration across boundaries", "cluster": "Strategy, money, and accountability", "kind": "Method", "overview": "How many organizations work on one shared problem without one of them owning it. The field has moved from shared measurement toward equity and community power.", "road": "John Kania and Mark Kramer (collective impact, 2011) → Mark Cabaj and Liz Weaver (Collective Impact 3.0) → Collective Impact Forum's equity turn", "mix": "Ostrom, network weaving, Two Loops, Human Learning Systems", "policy": "Cross-agency place-based partnerships, shared learning agendas instead of shared KPIs, and residents holding real seats in governance.", "links": [{"t": "Collective Impact 3.0 (Collective Impact Forum)", "u": "https://collectiveimpactforum.org/resource/collective-impact-3-0-an-evolving-framework-for-community-change/"}], "terms": ["collective impact", "collaboration", "partnership", "cross-sector", "backbone", "network weav"], "caps": ["Ecosystem Engagement", "Networking & Engaging Capital"], "id": "collaboration-across-boundaries", "orgs": ["tamarack", "cif"], "cases": ["food-lab", "strive"], "gov": true, "reading": [], "short": "collab", "short_name": "Collaboration across boundaries", "family": "sci", "sectors": ["gov", "ngo", "fund", "com"], "scales": ["plc", "pol"], "work_kinds": ["com"], "goals": ["policy"], "lens": "Complexity as shared problems: no single actor can solve them, so progress comes from aligning many actors around learning, with the most affected people holding real power.", "lens_status": "draft", "explainer": ["Big social problems are not owned by any one organization. This pathway is about how many organizations, public, private and community, can work on one shared problem together.", "Collective impact (2011) set out five conditions, including a common agenda and a backbone organization. Practice since then has moved on: Collective Impact 3.0 shifts from management to movement building, and the field now puts equity and community power at the centre."], "practice": ["Map who already works on the problem and invite the people most affected into the first meeting.", "Agree a few shared learning questions before agreeing shared indicators.", "Fund a small backbone team whose job is to connect, not to control.", "Check who holds decision power in the partnership and whether residents have real seats."], "sector_notes": {"biz": "Firms join place-based partnerships as employers, funders and suppliers.", "ngo": "Charities often host the backbone function.", "health": "Health partnerships with councils and charities tackle causes of ill health.", "edu": "Strive in Cincinnati linked schools, colleges and services around children's progress.", "com": "Community organizations bring legitimacy and knowledge the institutions lack."}, "key_ideas": [{"term": "collective impact", "defn": "Many organizations working on one problem with a common agenda and a backbone team."}, {"term": "backbone organization", "defn": "A small team that supports a partnership by connecting, convening and keeping data."}, {"term": "common agenda", "defn": "A shared understanding of the problem and the change being sought."}, {"term": "network weaving", "defn": "Deliberately building connections between people so a network can act."}, {"term": "community power", "defn": "Residents holding real decision-making power, not only a voice."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "John Kania and Mark Kramer", "note": "collective impact, 2011", "years": "", "people": []}, {"name": "Mark Cabaj and Liz Weaver", "note": "Collective Impact 3.0", "years": "", "people": []}, {"name": "Collective Impact Forum's equity turn", "note": "", "years": "", "people": []}]}, {"name": "Design thinking", "cluster": "Design and practice", "overview": "Framing problems through empathy, prototyping, and iteration. Strong for bounded problems, weaker where no single solution exists.", "road": "Herbert Simon (The Sciences of the Artificial) → Horst Rittel → Nigel Cross (Designerly Ways of Knowing) → Donald Schön (reflection-in-action) → IDEO and the Stanford d.school", "mix": "Natasha Iskander's critique of design thinking", "policy": "Human-centered problem framing in agency innovation teams. Most useful when paired with complexity methods for problems without one right answer.", "links": [{"t": "Stanford d.school", "u": "https://dschool.stanford.edu"}, {"t": "IDEO", "u": "https://www.ideo.com"}], "kind": "Method", "terms": ["design thinking", "ideo", "d.school", "human-centered", "human-centred", "prototyp"], "caps": ["Experimenting & Building", "Participatory Research & Design"], "id": "design-thinking", "orgs": ["dschool"], "cases": ["embrace"], "gov": false, "reading": [], "short": "dthink", "short_name": "Design thinking", "family": "prc", "sectors": ["biz"], "scales": ["org"], "work_kinds": ["cra"], "goals": ["policy"], "lens": "Complexity met by making: you understand a problem better by building rough versions and watching what people do with them.", "lens_status": "draft", "explainer": ["Design thinking is a way of solving problems that starts with people. Teams observe and interview users, frame the problem, generate ideas, build quick prototypes and test them, going round the loop several times.", "It was popularized by IDEO and the Stanford d.school, building on design research by Herbert Simon, Horst Rittel and Nigel Cross. It works well for bounded problems. Critics, like Natasha Iskander, note that it can keep power with designers and miss systemic causes."], "practice": ["Watch three people use the thing you want to improve, without helping.", "Write the problem as a question starting with 'How might we'.", "Build a rough prototype in an afternoon and test it the next day.", "Ask who is not in the design process who should be."], "sector_notes": {"biz": "Product and service development in many firms.", "ngo": "Human-centred design for programmes, as with the Embrace infant warmer.", "health": "Patient-centred redesign of clinics and devices.", "edu": "Design thinking courses at d.schools worldwide.", "com": "Community makers and civic tech groups prototype local fixes."}, "key_ideas": [{"term": "human-centred design", "defn": "Design that starts from the needs and behaviour of the people who will use it."}, {"term": "prototype", "defn": "A rough version of an idea, made to learn quickly."}, {"term": "how might we", "defn": "A question format that turns a problem into an invitation to ideas."}, {"term": "empathy", "defn": "In design thinking, understanding users by watching and listening closely."}, {"term": "iteration", "defn": "Repeating the build-test-learn cycle to improve."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "Herbert Simon", "note": "The Sciences of the Artificial", "years": "1916–2001", "people": ["Herbert Simon"]}, {"name": "Horst Rittel", "note": "", "years": "1930–1990", "people": ["Horst Rittel"]}, {"name": "Nigel Cross", "note": "Designerly Ways of Knowing", "years": "b. 1942", "people": ["Nigel Cross"]}, {"name": "Donald Schön", "note": "reflection-in-action", "years": "1930–1997", "people": ["Donald Schön"]}, {"name": "IDEO and the Stanford d.school", "note": "", "years": "", "people": []}]}, {"name": "Service design", "cluster": "Design and practice", "overview": "Services as journeys across touchpoints, with frontstage experience and backstage systems designed together.", "road": "Lynn Shostack (service blueprinting) → Birgit Mager (Köln) → Marc Stickdorn (This Is Service Design Doing) → Lou Downe (Good Services)", "mix": "UK Government Digital Service, US Digital Service, 18F (closed 2025)", "policy": "End-to-end benefit and permit journeys, service standards, and blueprints that expose the policy and system constraints behind a bad experience.", "links": [{"t": "Service Design Network", "u": "https://www.service-design-network.org"}, {"t": "Good Services", "u": "https://good.services"}], "kind": "Method", "terms": ["service design", "service blueprint", "journey map", "good services", "user research"], "caps": ["Participatory Research & Design", "Experimenting & Building"], "id": "service-design", "orgs": ["goodservices"], "cases": ["gds"], "gov": true, "reading": [], "short": "svc", "short_name": "Service design", "family": "prc", "sectors": ["gov", "biz"], "scales": ["org", "pol"], "work_kinds": ["cra"], "goals": ["policy"], "lens": "Complexity in the journey: a service is many systems meeting one person, and the experience emerges from how front and back stages connect.", "lens_status": "draft", "explainer": ["Service design looks at a service the way the person using it experiences it: as one journey from first need to final outcome, across websites, letters, phone calls, counters and waiting rooms. It then designs the frontstage (what people see) and the backstage (the staff, systems and rules behind it) together.", "Lynn Shostack introduced the service blueprint in 1984. The UK's Government Digital Service made it central to public services, and Lou Downe set out plain principles for good services. Done well, it exposes the policy and system problems hiding behind a bad experience."], "practice": ["Follow one person through a whole service, from first need to final outcome, and draw it.", "Make a service blueprint showing what users see and the backstage work behind each step.", "Test a service against Lou Downe's 15 principles of good services.", "Fix one handoff where users have to repeat themselves."], "sector_notes": {"biz": "Banking, retail and telecoms use service design to cut friction.", "ngo": "Charities redesign advice and support services around users.", "health": "Patient journeys through hospitals and GP surgeries.", "edu": "Student services and admissions redesigned end to end.", "com": "Community services, such as food banks, mapped from the user's side."}, "key_ideas": [{"term": "service design", "defn": "Designing a service end to end: what people experience and the behind-the-scenes work that makes it happen."}, {"term": "service blueprint", "defn": "A diagram of a service showing what users see, and the backstage work behind each step."}, {"term": "journey map", "defn": "A picture of the steps someone goes through to get something done, and how each step feels."}, {"term": "good services", "defn": "Lou Downe's plain-language standards for what makes a service work well for the people using it."}, {"term": "user research", "defn": "Learning directly from the people who use a service: watching, asking, testing."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "Lynn Shostack", "note": "service blueprinting", "years": "", "people": []}, {"name": "Birgit Mager", "note": "Köln", "years": "", "people": []}, {"name": "Marc Stickdorn", "note": "This Is Service Design Doing", "years": "", "people": []}, {"name": "Lou Downe", "note": "Good Services", "years": "", "people": []}]}, {"name": "Participatory design and design justice", "cluster": "Design and practice", "overview": "Designing with people rather than for them, with power named and shared in the process.", "road": "Scandinavian participatory design (Pelle Ehn, Kristen Nygaard) → Elizabeth Sanders (co-design) → Ezio Manzini (Design, When Everybody Designs) → Sasha Costanza-Chock (Design Justice) → Arturo Escobar (Designs for the Pluriverse)", "mix": "The relational and Indigenous pathways", "policy": "Co-designing programs with the residents they serve, with explicit attention to who holds decision power.", "links": [{"t": "Design Justice Network", "u": "https://designjustice.org"}, {"t": "DESIS Network", "u": "https://www.desisnetwork.org"}], "kind": "Method", "terms": ["design justice", "costanza-chock", "co-design", "codesign", "participatory design", "escobar", "pluriverse", "manzini"], "caps": ["Participatory Research & Design", "Positionality & Power Analysis"], "id": "participatory-design-and-design-justice", "orgs": ["djn"], "cases": ["porto-alegre"], "gov": false, "reading": [], "short": "pd", "short_name": "Participatory design", "family": "prc", "sectors": ["com", "ngo"], "scales": ["grp", "plc"], "work_kinds": ["cra"], "goals": ["power"], "lens": "Complexity as many worlds: the people living with a problem hold knowledge designers lack, and good design shares power with them.", "lens_status": "draft", "explainer": ["Participatory design means designing with people, not for them. It began in Scandinavia in the 1970s, when trade unions and designers worked together on new workplace technology so workers had a say.", "Co-design (Elizabeth Sanders) and design for social innovation (Ezio Manzini) carried it forward. Design justice (Sasha Costanza-Chock) asks who benefits and who is harmed by design, and centres the people most affected. Arturo Escobar's Designs for the Pluriverse argues for many ways of living, not one."], "practice": ["Invite people affected by a problem to help frame it before any ideas are generated.", "Pay participants for their time and expertise.", "Share decision power: agree which decisions participants make, not just advise on.", "Ask who could be harmed by the design and include them."], "sector_notes": {"biz": "Co-design with customers and workers on products and tools.", "ngo": "Design justice shapes programmes with communities.", "health": "Co-production of services with patients and carers.", "edu": "Co-designing learning spaces with students.", "com": "Communities design their own spaces and services."}, "key_ideas": [{"term": "co-design", "defn": "Designing together with the people who will use or be affected by the result."}, {"term": "design justice", "defn": "Design led by marginalized communities, aiming to dismantle structural inequality."}, {"term": "pluriverse", "defn": "A world where many worlds fit, in Escobar's phrase from the Zapatistas."}, {"term": "participatory design", "defn": "Design in which users take part in decisions, rooted in Scandinavian workplace democracy."}, {"term": "co-production", "defn": "Public services designed and delivered with the people who use them."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "Scandinavian participatory design", "note": "Pelle Ehn, Kristen Nygaard", "years": "", "people": []}, {"name": "Elizabeth Sanders", "note": "co-design", "years": "", "people": []}, {"name": "Ezio Manzini", "note": "Design, When Everybody Designs", "years": "b. 1945", "people": ["Ezio Manzini"]}, {"name": "Sasha Costanza-Chock", "note": "Design Justice", "years": "", "people": []}, {"name": "Arturo Escobar", "note": "Designs for the Pluriverse", "years": "b. 1951", "people": ["Arturo Escobar"]}]}, {"name": "Transition design", "cluster": "Design and practice", "overview": "Design for long-horizon societal transitions, grounded in living systems theory. The design path most explicitly built on complexity.", "road": "Terry Irwin, Gideon Kossoff, and Cameron Tonkinwise (Carnegie Mellon)", "mix": "Three Horizons, Capra, Meadows", "policy": "Long-horizon transitions in energy, food, and care that span agencies and election cycles.", "links": [{"t": "Transition Design", "u": "https://transitiondesign.net"}], "kind": "Method", "terms": ["transition design", "irwin", "tonkinwise", "long-horizon"], "caps": ["Regenerative Systems Design", "Futures Thinking & Foresight"], "id": "transition-design", "orgs": ["td"], "cases": ["ojai"], "gov": false, "reading": [], "short": "trans", "short_name": "Transition design", "family": "prc", "sectors": ["edu", "gov"], "scales": ["pla", "pol"], "work_kinds": ["cra", "cre"], "goals": ["land"], "lens": "Complexity as long transition: societies change over decades through many linked shifts, so design must work across scales and timescales at once.", "lens_status": "draft", "explainer": ["Transition design is design for long-term societal change, such as moving to sustainable food, energy or transport systems. It was developed at Carnegie Mellon by Terry Irwin, Gideon Kossoff, Cameron Tonkinwise and colleagues.", "It asks designers to map the wicked problem and its history, envision a long-horizon future, and design interventions at many levels and timescales that move the system toward it. It draws on living systems and social change theory."], "practice": ["Map your problem's history: how did it come to be this way?", "Write a vision for 40 years ahead and work back to now.", "Design a small intervention today that points toward that future.", "Link projects at household, community and policy scale."], "sector_notes": {"biz": "Firms in energy and food use it to plan long transitions.", "ngo": "Environmental groups apply it to systemic campaigns.", "health": "Long-term shifts toward prevention and community health.", "edu": "Taught in design schools as an alternative to short-term projects.", "com": "Transition Towns and local food networks share the spirit."}, "key_ideas": [{"term": "transition design", "defn": "Design for long-term societal transitions toward sustainable futures."}, {"term": "wicked problem", "defn": "A problem with no clear definition, no right answer, and no point where it is solved for good."}, {"term": "backcasting", "defn": "Imagining a desired future and working backward to see what steps lead there."}, {"term": "multi-level perspective", "defn": "A model of transitions as interactions between niches, regimes and landscapes."}, {"term": "long horizon", "defn": "Thinking in decades, not quarters."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "Terry Irwin, Gideon Kossoff, and Cameron Tonkinwise", "note": "Carnegie Mellon", "years": "", "people": []}]}, {"name": "Strategic design and policy labs", "cluster": "Design and practice", "overview": "Using design to reshape institutions and the rules, budgets, and culture underneath them.", "road": "Helsinki Design Lab (Sitra, Bryan Boyer, Dan Hill) and MindLab (Christian Bason) → Policy Lab UK and La 27e Région → Dark Matter Labs", "mix": "Geoff Mulgan, Nesta", "policy": "In-house policy labs and stewardship models that change procurement, budgeting, and governance, not just services.", "links": [{"t": "Policy Lab UK", "u": "https://openpolicy.blog.gov.uk"}, {"t": "La 27e Région", "u": "https://www.la27eregion.fr"}, {"t": "Dark Matter Labs", "u": "https://darkmatterlabs.org"}], "kind": "Field", "terms": ["policy lab", "dark matter", "strategic design", "helsinki design lab", "mindlab", "innovation lab"], "caps": ["Experimenting & Building", "Leading in Complexity"], "id": "strategic-design-and-policy-labs", "orgs": ["dml", "hdl"], "cases": ["legible"], "gov": true, "reading": [], "short": "labs", "short_name": "Policy labs", "family": "prc", "sectors": ["gov"], "scales": ["pol"], "work_kinds": ["cra"], "goals": ["policy"], "lens": "Complexity in the institution: services sit on top of rules, money and culture, so lasting change means redesigning that dark matter too.", "lens_status": "draft", "explainer": ["Strategic design uses design to change institutions: the rules, budgets, contracts and culture that shape what services can be. Policy labs inside or alongside government test new approaches with civil servants and citizens.", "Helsinki Design Lab and Denmark's MindLab were early examples; Policy Lab UK and France's La 27e Région followed. Dark Matter Labs works on the deep infrastructure of finance, ownership and governance. The aim is change that lasts because the system underneath it has changed."], "practice": ["Pick a policy problem and prototype the experience of the policy before writing it.", "Work with the people who write budgets and contracts, not just service teams.", "Run a small lab with frontline staff and residents for six weeks.", "Document what you learn about the institution, not just the product."], "sector_notes": {"biz": "Corporate innovation labs face the same challenge of changing the host.", "ngo": "Social labs bring many organizations together on one issue.", "health": "Health innovation labs redesign pathways and commissioning.", "edu": "Education labs test new models with schools and ministries.", "com": "Civic labs give residents a role in testing policy."}, "key_ideas": [{"term": "policy lab", "defn": "A team that brings design and experimentation into policymaking."}, {"term": "strategic design", "defn": "Using design to change institutions and the conditions around services."}, {"term": "dark matter", "defn": "Dan Hill's term for the hidden rules, culture and money that shape what institutions can do."}, {"term": "prototype", "defn": "A rough version of an idea, made to learn quickly."}, {"term": "stewardship", "defn": "Looking after the health of a whole system rather than controlling its parts."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "Helsinki Design Lab", "note": "Sitra, Bryan Boyer, Dan Hill) and MindLab (Christian Bason", "years": "founded 2009", "people": ["Helsinki Design Lab"]}, {"name": "Policy Lab UK and La 27e Région", "note": "", "years": "", "people": []}, {"name": "Dark Matter Labs", "note": "", "years": "", "people": []}]}, {"name": "Improvement and adaptive management", "cluster": "Design and practice", "overview": "Learning cycles built into daily operations, treating the organization as a system to be continually improved.", "road": "W. Edwards Deming (System of Profound Knowledge) → Toyota and Lean → Don Berwick and IHI (PDSA cycles) → Agile", "mix": "Plexus Institute's healthcare work, Brenda Zimmerman", "policy": "PDSA cycles in public health and service delivery, and continuous improvement units inside agencies.", "links": [{"t": "The Deming Institute", "u": "https://deming.org"}, {"t": "Institute for Healthcare Improvement", "u": "https://www.ihi.org"}], "kind": "Method", "terms": ["deming", "lean", "agile", "continuous improvement", "pdsa", "quality improvement"], "caps": ["Experimenting & Building", "Data Analysis & Evaluation"], "id": "improvement-and-adaptive-management", "orgs": ["deming", "ihi"], "cases": ["100k-lives"], "gov": true, "reading": [], "short": "improve", "short_name": "Improvement and adaptive management", "family": "prc", "sectors": ["gov", "biz"], "scales": ["org"], "work_kinds": ["cra"], "goals": ["uncertain"], "lens": "Complexity as variation: outcomes come from systems, not individuals, so improvement means learning how the system behaves through many small tests.", "lens_status": "draft", "explainer": ["Improvement treats an organization as a system to be improved continually through small cycles of learning. W. Edwards Deming taught that most problems come from the system, not the people, and that leaders must understand variation and learn through Plan-Do-Study-Act cycles.", "Toyota and Lean built this into daily work. In health care, Don Berwick and the Institute for Healthcare Improvement spread PDSA cycles widely. Agile software development shares the idea: deliver small, learn, adjust."], "practice": ["Pick one measure and plot it over time on a run chart before reacting to any single result.", "Run a PDSA cycle: plan a small change, try it, study the result, act on what you learned.", "Ask the people doing the work what gets in their way.", "Stop blaming individuals for problems the system produces."], "sector_notes": {"biz": "Lean and Toyota Production System in manufacturing and services.", "ngo": "Quality improvement in programme delivery.", "health": "IHI and the 100,000 Lives Campaign.", "edu": "Improvement science in schools through networked improvement communities.", "com": "Small tests of change in community projects."}, "key_ideas": [{"term": "pdsa", "defn": "Plan-Do-Study-Act: a small cycle of testing a change and learning from it."}, {"term": "system of profound knowledge", "defn": "Deming's four parts: systems, variation, knowledge and psychology."}, {"term": "variation", "defn": "The natural ups and downs in any measure; telling noise from signal."}, {"term": "lean", "defn": "A way of working that removes waste and improves flow."}, {"term": "run chart", "defn": "A graph of a measure over time, to see real change."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "W. Edwards Deming", "note": "System of Profound Knowledge", "years": "1900–1993", "people": ["W. Edwards Deming"]}, {"name": "Toyota and Lean", "note": "", "years": "", "people": []}, {"name": "Don Berwick and IHI", "note": "PDSA cycles", "years": "b. 1946", "people": ["Don Berwick"]}, {"name": "Agile", "note": "", "years": "", "people": []}]}, {"name": "Developmental evaluation", "cluster": "Design and practice", "overview": "Evaluation built for innovation in complex settings, feeding real-time learning instead of judging afterward.", "road": "Michael Quinn Patton → Mark Cabaj and the Tamarack Institute", "mix": "Human Learning Systems, Cynefin", "policy": "Funding and accountability for adaptive programs, where evaluators help programs learn while they run.", "links": [{"t": "Tamarack Institute", "u": "https://www.tamarackcommunity.ca"}, {"t": "BetterEvaluation", "u": "https://www.betterevaluation.org"}], "kind": "Method", "terms": ["developmental evaluation", "evaluation", "patton", "tamarack", "measurement", "impact"], "caps": ["Data Analysis & Evaluation"], "id": "developmental-evaluation", "orgs": ["hls", "tamarack"], "cases": ["hls-cases"], "gov": true, "reading": [], "short": "deval", "short_name": "Developmental evaluation", "family": "prc", "sectors": ["fund", "ngo", "gov"], "scales": ["org", "plc"], "work_kinds": ["adm"], "goals": ["policy"], "lens": "Complexity as emergent results: when goals and paths are still forming, evaluation must learn alongside the work, not judge it afterward.", "lens_status": "draft", "explainer": ["Developmental evaluation supports innovation in complex settings. Instead of judging a programme at the end, the evaluator works alongside the team, feeding back what is happening so the programme can adapt.", "Michael Quinn Patton developed it for situations where the goal and the path are still emerging. Mark Cabaj and the Tamarack Institute spread it in community change work. It asks: what are we learning, and what should we do next?"], "practice": ["Bring an evaluator into the team from the start, not at the end.", "Agree a few learning questions and review them every month or two.", "Track what changed in the strategy and why.", "Report to funders what was learned, including what did not work."], "sector_notes": {"biz": "Used in social innovation units and impact investing.", "ngo": "Community change initiatives use it to adapt as they go.", "health": "Evaluating new models of care while they are still forming.", "edu": "Evaluating school reform while it unfolds.", "com": "Community-led projects use it to learn together."}, "key_ideas": [{"term": "developmental evaluation", "defn": "Evaluation that supports a programme to adapt while it runs."}, {"term": "learning question", "defn": "A question a team agrees to explore together over time."}, {"term": "emergent strategy", "defn": "A strategy that takes shape through action and learning."}, {"term": "utilization-focused evaluation", "defn": "Patton's principle that evaluation should be useful to its intended users."}, {"term": "summative evaluation", "defn": "Evaluation that judges results at the end, which developmental evaluation is not."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "Michael Quinn Patton", "note": "", "years": "b. 1945", "people": ["Michael Quinn Patton"]}, {"name": "Mark Cabaj and the Tamarack Institute", "note": "", "years": "", "people": []}]}, {"name": "Action research", "cluster": "Design and practice", "overview": "Inquiry and change as one act, led with and by the people affected.", "road": "Kurt Lewin → Paulo Freire and Orlando Fals-Borda (participatory action research) → Peter Reason and Hilary Bradbury", "mix": "Chris Argyris (action science), the hosting pathway", "policy": "Community-led inquiry into local problems, with residents as co-researchers and co-owners of findings.", "links": [{"t": "Action Research Network of the Americas", "u": "https://arnawebsite.org/"}], "kind": "Method", "terms": ["action research", "participatory action", "fals-borda", "co-research"], "caps": ["Participatory Research & Design", "Critical Consciousness"], "id": "action-research", "orgs": ["arna"], "cases": ["fals-borda"], "gov": false, "reading": [], "short": "ar", "short_name": "Action research", "family": "prc", "sectors": ["edu", "com"], "scales": ["grp", "plc"], "work_kinds": ["com"], "goals": ["power"], "lens": "Complexity known from inside: the people in a situation understand it best by changing it and reflecting together.", "lens_status": "draft", "explainer": ["Action research combines research and change into one process. People affected by a problem study it together, act, look at what happened, and act again. Kurt Lewin coined the term in the 1940s.", "Paulo Freire and Orlando Fals-Borda developed participatory action research with communities in Latin America, treating them as researchers of their own lives. Peter Reason and Hilary Bradbury brought the many traditions together. Knowledge and power are shared."], "practice": ["Gather people affected by a problem and agree a shared question.", "Plan a small action, take it, and meet to reflect on what happened.", "Repeat the cycle several times, writing down what you learn.", "Share findings back with the community first, in a form they can use."], "sector_notes": {"biz": "Action learning and action science in organizations.", "ngo": "Participatory research with communities served.", "health": "Patient-led research and participatory health research.", "edu": "Teacher action research in classrooms.", "com": "Communities research their own housing, health and environment."}, "key_ideas": [{"term": "action research", "defn": "Research and change as one cycle, done with the people affected."}, {"term": "participatory action research", "defn": "Action research led by communities, linking knowledge to power."}, {"term": "co-research", "defn": "Research where participants are researchers too."}, {"term": "cycle of inquiry", "defn": "Plan, act, observe, reflect, and repeat."}, {"term": "praxis", "defn": "Action and reflection together, in Freire's sense."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "Kurt Lewin", "note": "", "years": "1890–1947", "people": ["Kurt Lewin"]}, {"name": "Paulo Freire and Orlando Fals-Borda", "note": "participatory action research", "years": "1921–1997; 1925–2008", "people": ["Paulo Freire", "Orlando Fals-Borda"]}, {"name": "Peter Reason and Hilary Bradbury", "note": "", "years": "", "people": []}]}, {"name": "Positive deviance", "cluster": "Design and practice", "overview": "Finding the uncommon practices that already work inside a community and helping them spread.", "road": "Jerry and Monique Sternin", "mix": "Plexus Institute, which championed it in healthcare", "policy": "Scaling what already works in the field, from frontline caseworkers to communities, before importing outside solutions.", "links": [{"t": "Positive Deviance Collaborative", "u": "https://positivedeviance.org"}], "kind": "Method", "terms": ["positive deviance", "bright spots", "sternin"], "caps": ["Data Analysis & Evaluation", "Participatory Research & Design"], "id": "positive-deviance", "orgs": ["pdc"], "cases": ["pd-vietnam"], "gov": false, "reading": [], "short": "posdev", "short_name": "Positive deviance", "family": "prc", "sectors": ["com", "ngo"], "scales": ["plc"], "work_kinds": ["car"], "goals": ["land"], "lens": "Complexity as local solutions already present: the answer to a complex problem often exists in the system, practised by a few, waiting to be noticed.", "lens_status": "draft", "explainer": ["Positive deviance starts from a simple observation: in almost every community, a few people facing the same problem do better than others, with no extra resources. Finding out what they do differently, and helping it spread, is often faster than importing outside solutions.", "Jerry and Monique Sternin developed it with Save the Children in Vietnam in the 1990s, where some poor families had well-nourished children. The method has since been used in health care, education and business."], "practice": ["Define the problem with the community, then find those who succeed against the odds.", "Learn what they do differently by watching, not just asking.", "Let the community design ways to practise those behaviours, rather than telling them.", "Track progress with the community."], "sector_notes": {"biz": "Finding high-performing teams and spreading their practices.", "ngo": "Nutrition and health programmes in many countries.", "health": "Hospital infection control, through the Plexus Institute's work.", "edu": "Finding teachers whose students thrive and learning from them.", "com": "Communities discovering their own solutions."}, "key_ideas": [{"term": "positive deviance", "defn": "People who succeed against the odds, with the same resources as others."}, {"term": "bright spots", "defn": "Places where something is already working."}, {"term": "acting your way into thinking", "defn": "PD's principle that people change by practising, not by being told."}, {"term": "community ownership", "defn": "The community leads, discovers and spreads the solution."}, {"term": "uncommon practice", "defn": "A behaviour that explains why a few do better."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "Jerry and Monique Sternin", "note": "", "years": "", "people": []}]}, {"name": "Experiential learning and reflective practice", "cluster": "Learning and pedagogy", "kind": "Method", "overview": "Learning as a cycle of doing, noticing, making sense, and trying again. The base layer for learning complexity, because complexity is mostly learned by acting and reflecting.", "road": "John Dewey → Kurt Lewin → David Kolb (the experiential learning cycle) → Donald Schön (reflection-in-action)", "mix": "Action research, T-groups, improvement cycles", "policy": "Learning built into delivery: reflective supervision for frontline staff, learning reviews after each cycle, and training that happens on real cases.", "links": [{"t": "David A. Kolb on experiential learning (infed)", "u": "https://web.archive.org/web/2025/https://infed.org/dir/welcome/david-a-kolb-on-experiential-learning/"}, {"t": "Kurt Lewin: groups, experiential learning, and action research (infed)", "u": "https://web.archive.org/web/2025/https://infed.org/dir/welcome/kurt-lewin-groups-experiential-learning-and-action-research/"}], "terms": ["experiential", "reflective practice", "kolb", "dewey", "schön", "schon", "learning cycle"], "caps": ["Experimenting & Building", "Observing & Listening"], "id": "experiential-learning-and-reflective-practice", "orgs": ["ntl", "infed"], "cases": ["outward-bound", "finland-phenomena"], "gov": false, "reading": [], "short": "exp", "short_name": "Experiential learning", "family": "prc", "sectors": ["edu"], "scales": ["per", "grp"], "work_kinds": ["int"], "goals": ["grow"], "lens": "Complexity of practice: real situations do not match the textbook, so learning happens by acting, noticing and adjusting.", "lens_status": "draft", "explainer": ["Experiential learning describes learning as a cycle: you have an experience, reflect on it, make sense of it, and try something new. David Kolb's cycle built on John Dewey and Kurt Lewin.", "Donald Schön added reflection-in-action: skilled practitioners think while they work, adjusting as surprises come up. Complexity is mostly learned this way, by acting and reflecting, because no rulebook covers it."], "practice": ["After any significant piece of work, write three lines: what happened, what I noticed, what I will try next.", "Pair up for reflective supervision once a month.", "Notice a surprise during your work and ask what it tells you.", "Build learning reviews into the end of each project."], "sector_notes": {"biz": "Action learning and on-the-job development programmes.", "ngo": "Reflective practice for frontline workers.", "health": "Reflective supervision for clinicians and social workers.", "edu": "Outdoor and experiential education, like Outward Bound.", "com": "Community learning through doing projects together."}, "key_ideas": [{"term": "experiential learning cycle", "defn": "Kolb's cycle: experience, reflection, conceptualization, experimentation."}, {"term": "reflection-in-action", "defn": "Schön's idea of thinking on your feet as you work."}, {"term": "reflective practice", "defn": "Regularly looking back at your work to learn from it."}, {"term": "double-loop learning", "defn": "Argyris and Schön's idea of questioning the assumptions behind your actions, not just the actions."}, {"term": "learning by doing", "defn": "Dewey's principle that we learn through experience."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "John Dewey", "note": "", "years": "1859–1952", "people": ["John Dewey"]}, {"name": "Kurt Lewin", "note": "", "years": "1890–1947", "people": ["Kurt Lewin"]}, {"name": "David Kolb", "note": "the experiential learning cycle", "years": "b. 1939", "people": ["David Kolb"]}, {"name": "Donald Schön", "note": "reflection-in-action", "years": "1930–1997", "people": ["Donald Schön"]}]}, {"name": "Transformative learning", "cluster": "Learning and pedagogy", "kind": "Lineage", "overview": "Learning that changes the frame, not just the content. Often starts with a disorienting dilemma and moves through critical reflection toward a new perspective. Threshold concepts name the ideas that are troublesome before they become obvious.", "road": "Jack Mezirow (perspective transformation) → Edward Taylor and Patricia Cranton → Jan Meyer and Ray Land (threshold concepts and troublesome knowledge)", "mix": "Freire, Robert Kegan, Nora Bateson on education", "policy": "Designing public-sector learning so staff can revisit core assumptions, not just learn new procedures, especially when a service model is changing.", "links": [{"t": "Taylor: The Theory and Practice of Transformative Learning (ERIC)", "u": "https://eric.ed.gov/?id=ED423422"}, {"t": "The Value of Troublesome Knowledge (Composition Forum)", "u": "https://compositionforum.com/issue/26/troublesome-knowledge-threshold.php"}], "terms": ["transformative learning", "mezirow", "threshold concept", "troublesome knowledge", "perspective transformation"], "caps": ["Critical Consciousness", "Cultural & Epistemic Inquiry"], "id": "transformative-learning", "orgs": ["itla"], "cases": ["reentry"], "gov": false, "reading": [], "short": "transl", "short_name": "Transformative learning", "family": "prc", "sectors": ["edu"], "scales": ["per"], "work_kinds": ["int"], "goals": ["grow"], "lens": "Complexity of mind: some learning changes the frame through which everything else is seen, and that change is often uncomfortable before it is freeing.", "lens_status": "draft", "explainer": ["Transformative learning is learning that changes how you see, not just what you know. Jack Mezirow found that it often starts with a disorienting dilemma, a situation your current assumptions cannot explain, and moves through critical reflection to a new perspective.", "Others, like Edward Taylor and Patricia Cranton, broadened the theory. Threshold concepts (Jan Meyer and Ray Land) name the ideas in a field that are troublesome at first but transform understanding once grasped."], "practice": ["Notice a moment when something did not fit your assumptions, and write about what it challenged.", "Ask a group what they assumed before a project and what they assume now.", "In teaching, identify the threshold concepts learners find troublesome and give them time there.", "Make space for discomfort; do not rush to resolve it."], "sector_notes": {"biz": "Leadership development aimed at shifting mindsets.", "ngo": "Training that asks staff to rethink assumptions about the people they serve.", "health": "Professional education where clinicians question their frames.", "edu": "Threshold concepts guide curriculum design in universities.", "com": "Community education that shifts how people see their situation."}, "key_ideas": [{"term": "disorienting dilemma", "defn": "A situation that your current assumptions cannot explain, which can trigger transformation."}, {"term": "perspective transformation", "defn": "Mezirow's term for a change in the frame through which you see the world."}, {"term": "threshold concept", "defn": "An idea that is troublesome to learn but transforms understanding once grasped."}, {"term": "critical reflection", "defn": "Examining the assumptions behind your beliefs."}, {"term": "troublesome knowledge", "defn": "Knowledge that feels strange or counter-intuitive at first."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "Jack Mezirow", "note": "perspective transformation", "years": "1923–2014", "people": ["Jack Mezirow"]}, {"name": "Edward Taylor and Patricia Cranton", "note": "", "years": "d. 2016", "people": ["Patricia Cranton"]}, {"name": "Jan Meyer and Ray Land", "note": "threshold concepts and troublesome knowledge", "years": "", "people": []}]}, {"name": "Critical and popular education", "cluster": "Learning and pedagogy", "kind": "Hybrid", "overview": "Education as practice of freedom: learners read their own world, name the forces shaping it, and act together. Popular education schools trained the movements that changed laws.", "road": "Paulo Freire (<i>Pedagogy of the Oppressed<\/i>, conscientization) → Myles Horton and the Highlander Folk School → bell hooks (<i>Teaching to Transgress<\/i>, engaged pedagogy)", "mix": "Orlando Fals-Borda, Grace Lee Boggs, power analysis", "policy": "Community education that builds residents' own analysis before consultation, and civic learning that treats people as co-authors of policy.", "links": [{"t": "Paulo Freire: dialogue, praxis and education (infed)", "u": "https://web.archive.org/web/2025/https://infed.org/dir/welcome/paulo-freire-dialogue-praxis-and-education/"}, {"t": "bell hooks on education (infed)", "u": "https://web.archive.org/web/2025/https://infed.org/dir/welcome/bell-hooks-on-education/"}, {"t": "How Myles Horton built a social movement institution (Convergence)", "u": "https://convergencemag.com/articles/myles-horton-highlander/"}], "terms": ["freire", "pedagogy", "popular education", "highlander", "hooks", "critical consciousness", "conscientiz", "liberat"], "caps": ["Critical Consciousness", "Agency & Expression"], "id": "critical-and-popular-education", "orgs": ["boggs", "infed", "highlander"], "cases": ["highlander-case", "kerala", "fals-borda"], "gov": false, "reading": [], "short": "popedu", "short_name": "Popular education", "family": "prc", "sectors": ["com", "edu"], "scales": ["grp", "plc"], "work_kinds": ["pol"], "goals": ["power"], "lens": "Complexity as lived and named: people understand the systems around them best when they analyse them from their own experience and act together.", "lens_status": "draft", "explainer": ["Critical and popular education treats learning as a practice of freedom. Paulo Freire taught adult literacy in Brazil by starting from learners' own words and lives, so that reading the word became reading the world. He called the awakening of critical awareness conscientization.", "Myles Horton's Highlander Folk School trained labour and civil rights leaders, including Rosa Parks. bell hooks wrote about engaged pedagogy that honours students as whole people. The thread: education that helps people name and change the forces shaping their lives."], "practice": ["Start a session with participants' experience of the issue, not with expert input.", "Use a code, such as a picture or a story, that people can analyse together.", "Ask: why is it this way, who benefits, and what can we do?", "Turn learning into action the group chooses."], "sector_notes": {"biz": "Worker education and union learning.", "ngo": "Community organizations use popular education to build leadership.", "health": "Popular education in community health worker programmes.", "edu": "Critical pedagogy in schools and universities.", "com": "Highlander and similar schools train community leaders."}, "key_ideas": [{"term": "conscientization", "defn": "Freire's term for developing critical awareness of the forces shaping your life."}, {"term": "banking model", "defn": "Freire's critique of education that deposits facts into passive learners."}, {"term": "praxis", "defn": "Action and reflection together, in Freire's sense."}, {"term": "engaged pedagogy", "defn": "bell hooks' teaching that honours students as whole people."}, {"term": "popular education", "defn": "Education rooted in people's experience, aimed at social change."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "Paulo Freire", "note": "Pedagogy of the Oppressed, conscientization", "years": "1921–1997", "people": ["Paulo Freire"]}, {"name": "Myles Horton and the Highlander Folk School", "note": "", "years": "1905–1990", "people": ["Myles Horton"]}, {"name": "bell hooks", "note": "Teaching to Transgress, engaged pedagogy", "years": "1952–2021", "people": ["bell hooks"]}]}, {"name": "Communities of practice and action learning", "cluster": "Learning and pedagogy", "kind": "Structure", "overview": "Learning held by groups of practitioners over time. Communities of practice share a domain; action learning sets meet to work on real problems through questions rather than advice.", "road": "Reg Revans (action learning, learning equals programmed knowledge plus questioning) → Jean Lave and Etienne Wenger (communities of practice) → Etienne and Beverly Wenger-Trayner (social learning, systems convening)", "mix": "Art of Hosting, Human Learning Systems, developmental evaluation", "policy": "Cross-agency practitioner communities, peer learning networks between cities, and action learning sets for managers facing problems with no known answer.", "links": [{"t": "Wenger-Trayner: Introduction to communities of practice", "u": "https://www.wenger-trayner.com/introduction-to-communities-of-practice/"}, {"t": "Revans Action Learning archive (University of Salford)", "u": "https://www.salford.ac.uk/library/archives-and-special-collections/salford-digital-archives/revans-action-learning"}], "terms": ["community of practice", "communities of practice", "wenger", "action learning", "revans", "peer learning", "social learning"], "caps": ["Ecosystem Engagement", "Organizing & Facilitating"], "id": "communities-of-practice-and-action-learning", "orgs": ["wenger"], "cases": ["eureka"], "gov": true, "reading": [], "short": "cop", "short_name": "Communities of practice", "family": "prc", "sectors": ["gov", "ngo", "edu"], "scales": ["grp", "org"], "work_kinds": ["com"], "goals": ["others"], "lens": "Complexity as learning held in groups: knowledge about complex work lives in people's practice, and spreads through relationships over time.", "lens_status": "draft", "explainer": ["Communities of practice are groups of people who share a concern or a craft and learn from each other over time. Jean Lave and Etienne Wenger studied how apprentices learn by taking part in such communities.", "Action learning, created by Reg Revans, brings small groups together to work on real problems by asking each other questions rather than giving advice. Etienne and Beverly Wenger-Trayner extended these ideas to social learning across whole systems."], "practice": ["Find five to ten people who share your practice and meet monthly.", "Bring a real problem to an action learning set and only receive questions for the first half hour.", "Keep a shared log of stories and lessons.", "Invite newcomers to take part at the edge and grow toward the centre."], "sector_notes": {"biz": "Communities of practice spread know-how across large firms.", "ngo": "Peer networks share learning across charities.", "health": "Clinical communities of practice improve care.", "edu": "Teacher learning communities and professional networks.", "com": "Practitioner networks across neighbourhoods and cities."}, "key_ideas": [{"term": "community of practice", "defn": "A group that shares a practice and learns from each other over time."}, {"term": "action learning", "defn": "Revans' method: small groups work on real problems through questions."}, {"term": "legitimate peripheral participation", "defn": "Lave and Wenger's idea that newcomers learn by taking part at the edge."}, {"term": "social learning", "defn": "Learning that happens through relationships and shared practice."}, {"term": "systems convening", "defn": "Wenger-Trayner's term for bringing people together across boundaries to learn."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "Reg Revans", "note": "action learning, learning equals programmed knowledge plus questioning", "years": "1907–2003", "people": ["Reg Revans"]}, {"name": "Jean Lave and Etienne Wenger", "note": "communities of practice", "years": "b. 1939; b. 1952", "people": ["Jean Lave", "Etienne Wenger"]}, {"name": "Etienne and Beverly Wenger-Trayner", "note": "social learning, systems convening", "years": "", "people": []}]}, {"name": "Adult development and immunity to change", "cluster": "Learning and pedagogy", "kind": "Lineage", "overview": "How adults grow in their capacity to hold complexity, and why people stay stuck even when they want to change. Stages describe how someone makes meaning, not how much they are worth.", "road": "Jean Piaget → Robert Kegan (<i>In Over Our Heads<\/i>) → Kegan and Lisa Lahey (immunity to change) → Jennifer Garvey Berger (<i>Simple Habits for Complex Times<\/i>)", "mix": "Transformative learning, Group Relations, Theory U", "policy": "Leadership programs that work with competing commitments behind stalled reforms, without turning developmental stages into a ranking of staff.", "links": [{"t": "Kegan and Lahey: The Real Reason People Won't Change (HBR)", "u": "https://hbr.org/2001/11/the-real-reason-people-wont-change"}, {"t": "Simple Habits for Complex Times (Cultivating Leadership)", "u": "https://www.cultivatingleadership.com/book/simple-habits-for-complex-times"}], "terms": ["kegan", "immunity to change", "adult development", "vertical development", "garvey berger", "meaning-making"], "caps": ["Leading in Complexity", "Critical Consciousness"], "id": "adult-development-and-immunity-to-change", "orgs": ["cultivating"], "cases": ["ddo"], "gov": false, "reading": [], "short": "adult", "short_name": "Adult development", "family": "prc", "sectors": ["edu", "biz"], "scales": ["per"], "work_kinds": ["car", "int"], "goals": ["grow"], "lens": "Complexity of mind: the capacity to hold complexity grows over a lifetime, and stuck change often hides a commitment worth understanding.", "lens_status": "draft", "explainer": ["Adult development research suggests that adults can keep growing in how they make sense of the world, becoming more able to hold several perspectives, uncertainty and contradiction. Robert Kegan described a series of such shifts in In Over Our Heads.", "Kegan and Lisa Lahey's immunity to change explains why people stay stuck: hidden competing commitments protect them from something they fear. Jennifer Garvey Berger made these ideas practical for leaders in complexity. Critics, including Nora Bateson, warn against ranking people by stage."], "practice": ["Map your own immunity to change: goal, what you do instead, hidden worries, big assumptions.", "Test one big assumption with a small, safe experiment.", "Ask a colleague how they see a problem and try to describe it in their terms.", "Avoid using stages to label people; use them to ask what support someone needs."], "sector_notes": {"biz": "Leadership programmes and deliberately developmental organizations.", "ngo": "Supports leaders facing complex, uncertain work.", "health": "Coaching for clinicians moving into leadership.", "edu": "Adult education and teacher development.", "com": "Peer coaching in community leadership."}, "key_ideas": [{"term": "immunity to change", "defn": "Kegan and Lahey's term for hidden commitments that keep us from changing."}, {"term": "subject-object shift", "defn": "Kegan's idea that growth means being able to look at what you used to look through."}, {"term": "big assumption", "defn": "A belief taken as true that holds an immunity to change in place."}, {"term": "vertical development", "defn": "Growth in how you make sense of the world, not just in skills."}, {"term": "self-authoring mind", "defn": "Kegan's stage where people form their own values rather than following others'."}], "plain_overview": "", "plain_policy": "", "stops": [{"name": "Jean Piaget", "note": "", "years": "1896–1980", "people": ["Jean Piaget"]}, {"name": "Robert Kegan", "note": "In Over Our Heads", "years": "b. 1946", "people": ["Robert Kegan"]}, {"name": "Kegan and Lisa Lahey", "note": "immunity to change", "years": "", "people": []}, {"name": "Jennifer Garvey Berger", "note": "Simple Habits for Complex Times", "years": "", "people": []}]}, {"name": "Complexity and education", "cluster": "Learning and pedagogy", "kind": "Lineage", "overview": "Treating classrooms, schools, and learning programs as complex systems in their own right, and asking what it takes to educate people for a world that cannot be predicted.", "road": "Edgar Morin (<i>Seven Complex Lessons in Education for the Future<\/i>) → Brent Davis and Dennis Sumara (<i>Complexity and Education<\/i>) → Nora Bateson on education → Inner Development Goals (a widely used capacity framework)", "mix": "The Systems Change Learning Guide's learning areas, communities of practice, threshold concepts", "policy": "Public education and workforce programs that teach uncertainty, relationship, and systems literacy alongside content, and that evaluate learning developmentally.", "links": [{"t": "Morin: Seven complex lessons in education for the future (UNESCO)", "u": "https://unesdoc.unesco.org/ark:/48223/pf0000123074"}, {"t": "Nora Bateson: Preparing for a confusing future", "u": "https://norabateson.medium.com/preparing-for-a-confusing-future-complexity-warm-data-and-education-8eaae6b09eef"}, {"t": "Inner Development Goals guide", "u": "https://innerdevelopmentgoals.org/guide/"}], "terms": ["education", "school", "curriculum", "teaching", "inner development", "learning design", "educator"], "caps": ["Systems Thinking & Modeling", "Cultural & Epistemic Inquiry"], "id": "complexity-and-education", "orgs": ["bateson-institute", "idg", "sclg"], "cases": ["finland-phenomena"], "gov": false, "reading": [], "short": "cxedu", "short_name": "Complexity and education", "family": "prc", "sectors": ["edu"], "scales": ["org", "pla"], "work_kinds": [], "goals": ["connect"], "lens": "Complexity of learning: learning emerges from relationships between learners, teachers and context, and preparing people for an unpredictable world means teaching uncertainty, not only answers.", "lens_status": "draft", "explainer": ["This pathway asks what education looks like when we take complexity seriously: classrooms, schools and learning systems are complex systems themselves, and learners face a world no one can predict.", "Edgar Morin's Seven Complex Lessons, written for UNESCO, argued that education must teach the human condition, uncertainty and understanding. Brent Davis and Denn
